services:
  nfs-ganesha-media-rw:
    image: docker.io/library/debian:trixie-slim
    container_name: nfs-ganesha-media-rw
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
      - SETPCAP
      - DAC_READ_SEARCH
    security_opt:
      - apparmor:unconfined
    ports:
      - "10.0.10.11:2049:2049/tcp"
    volumes:
      - type: bind
        source: /mnt/core/media-rw
        target: /export/media-rw
        bind:
          propagation: rshared
      - type: bind
        source: /mnt/core/media-nc
        target: /export/media-nc
        bind:
          propagation: rshared
      - type: bind
        source: /mnt/core/nfs-ganesha/ganesha.conf
        target: /run/ganesha.conf
        read_only: true
    entrypoint:
      - /bin/sh
      - -euc
      - |
        echo "nfs-ganesha-media-rw starting"
        echo "kernel: $(uname -a)"
        echo "path: $$PATH"
        id
        cat /etc/os-release 2>/dev/null || true

        export DEBIAN_FRONTEND=noninteractive
        echo "installing nfs-ganesha from Debian trixie-backports"
        echo "deb http://deb.debian.org/debian trixie-backports main" > /etc/apt/sources.list.d/trixie-backports.list
        apt-get update
        apt-get install -y --no-install-recommends -t trixie-backports \
          -o Dpkg::Options::=--force-confdef \
          -o Dpkg::Options::=--force-confnew \
          ca-certificates \
          nfs-ganesha \
          nfs-ganesha-vfs
        rm -rf /var/lib/apt/lists/*

        mkdir -p /var/run/ganesha /var/lib/nfs/ganesha /var/log/ganesha

        GANESHA_NFSD=/usr/bin/ganesha.nfsd
        echo "ganesha package status:"
        dpkg -l 'nfs-ganesha*'
        echo "ganesha binary:"
        ls -lah "$$GANESHA_NFSD"
        stat "$$GANESHA_NFSD"
        chmod 0755 "$$GANESHA_NFSD"
        echo "ganesha libraries:"
        ls -lah /usr/lib/ganesha

        "$$GANESHA_NFSD" -v || {
          rc="$$?"
          echo "ganesha.nfsd version probe failed with exit code $$rc"
          ldd "$$GANESHA_NFSD" || true
        }
        echo "media-rw mountinfo:"
        grep ' /export/media-rw ' /proc/self/mountinfo || true
        echo "media-nc mountinfo:"
        grep ' /export/media-nc ' /proc/self/mountinfo || true

        until grep -q ' /export/media-rw .* - fuse.mergerfs ' /proc/self/mountinfo &&
          test ! -e /export/media-rw/MERGERFS_NOT_MOUNTED; do
          echo "waiting for mergerfs media-rw mount"
          sleep 2
        done
        until grep -q ' /export/media-nc .* - fuse.mergerfs ' /proc/self/mountinfo &&
          test ! -e /export/media-nc/MERGERFS_NOT_MOUNTED; do
          echo "waiting for mergerfs media-nc mount"
          sleep 2
        done

        echo "starting nfs-ganesha"
        exec /usr/bin/ganesha.nfsd \
          -F \
          -L STDOUT \
          -N NIV_EVENT \
          -f /run/ganesha.conf
    healthcheck:
      test:
        - CMD-SHELL
        - >
          grep -q ' /export/media-rw .* - fuse.mergerfs ' /proc/self/mountinfo &&
          test ! -e /export/media-rw/MERGERFS_NOT_MOUNTED &&
          grep -q ' /export/media-nc .* - fuse.mergerfs ' /proc/self/mountinfo &&
          test ! -e /export/media-nc/MERGERFS_NOT_MOUNTED
      interval: 5s
      retries: 100
      start_period: 10s
      timeout: 3s
