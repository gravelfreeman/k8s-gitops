!
! UniFi UDM-SE FRR configuration for Cilium LoadBalancer VIPs.
! UDM-SE ASN: 64513
! Cilium ASN: 64514
!
router bgp 64513
 bgp router-id 10.0.10.1
 neighbor 10.0.10.101 remote-as 64514
 neighbor 10.0.10.101 description cilium-m1
 neighbor 10.0.10.102 remote-as 64514
 neighbor 10.0.10.102 description cilium-m2
 neighbor 10.0.10.103 remote-as 64514
 neighbor 10.0.10.103 description cilium-m3
 !
 address-family ipv4 unicast
  neighbor 10.0.10.101 activate
  neighbor 10.0.10.101 route-map ACCEPT_CILIUM_LB in
  neighbor 10.0.10.101 route-map DENY_ALL out
  neighbor 10.0.10.102 activate
  neighbor 10.0.10.102 route-map ACCEPT_CILIUM_LB in
  neighbor 10.0.10.102 route-map DENY_ALL out
  neighbor 10.0.10.103 activate
  neighbor 10.0.10.103 route-map ACCEPT_CILIUM_LB in
  neighbor 10.0.10.103 route-map DENY_ALL out
 exit-address-family
!
ip prefix-list CILIUM_LB seq 10 permit 10.0.20.0/24 ge 32 le 32
ip prefix-list CILIUM_LB seq 20 permit 10.0.25.80/32
!
route-map ACCEPT_CILIUM_LB permit 10
 match ip address prefix-list CILIUM_LB
!
route-map DENY_ALL deny 10
!
