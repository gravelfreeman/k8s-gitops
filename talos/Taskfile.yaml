# yaml-language-server: $schema=https://taskfile.dev/schema.json
---
version: '3'

vars:
  TALOS_CACHE_DIR: '{{.TALOS_CACHE_DIR | default "/tmp/talos"}}'

tasks:

  dashboard:
    desc: Open control plane Talos dashboard
    cmd: talosctl dashboard --nodes {{.NODES}}
    preconditions:
      - talosctl config info
      - which talosctl

  apply-node:
    desc: Apply Talos config to a node [NODE=required] [MODE={{.MODE}}]
    cmd: |-
      minijinja-cli {{.TALOS_DIR}}/machineconfig.yaml.j2 \
        | op inject \
        | talosctl --nodes {{.NODE}} apply-config \
          --mode {{.MODE}} \
          --config-patch @{{.TALOS_DIR}}/networking.yaml \
          --config-patch "$(minijinja-cli {{.TALOS_DIR}}/{{.MACHINE_TYPE}}/{{.NODE}}.yaml.j2 | op inject)" \
          --file /dev/stdin {{if .INSECURE}}--insecure{{end}}
    vars:
      MODE: '{{.MODE | default "auto"}}'
      INSECURE:
        sh: talosctl --nodes {{.NODE}} get machineconfig &> /dev/null || echo true
      MACHINE_TYPE:
        sh: |-
          talosctl --nodes {{.NODE}} get machinetypes --output=jsonpath='{.spec}' 2> /dev/null \
            || basename $(find '{{.TALOS_DIR}}' -name '{{.NODE}}.yaml.j2' -printf '%h')
    env:
      MACHINE_TYPE: '{{.MACHINE_TYPE}}'
    requires:
      vars: [NODE]
    preconditions:
      - op user get --me
      - talosctl config info
      - test -f {{.TALOS_DIR}}/machineconfig.yaml.j2
      - test -f {{.TALOS_DIR}}/networking.yaml
      - test -f {{.TALOS_DIR}}/{{.MACHINE_TYPE}}/{{.NODE}}.yaml.j2
      - which minijinja-cli op talosctl

  upgrade-node:
    desc: Upgrade Talos on a single node [NODE=required]
    cmd: talosctl --nodes {{.NODE}} upgrade --image={{.TALOS_IMAGE}} --timeout=10m
    vars:
      MACHINE_TYPE:
        sh: talosctl --nodes {{.NODE}} get machinetypes --output=jsonpath='{.spec}'
      TALOS_IMAGE:
        sh: |-
          talosctl --nodes {{.NODE}} get machineconfig --output=jsonpath='{.spec}' \
            | yq '.machine.install.image | select(. != null)'
    requires:
      vars: [NODE]
    preconditions:
      - talosctl config info
      - talosctl --nodes {{.NODE}} get machineconfig
      - which minijinja-cli talosctl yq

  reboot-node:
    desc: Reboot Talos on a single node [NODE=required] [MODE={{.MODE}}]
    cmd: talosctl --nodes {{.NODE}} reboot --mode={{.MODE}}
    vars:
      MODE: '{{.MODE | default "default"}}'
    requires:
      vars: [NODE]
    preconditions:
      - talosctl config info
      - talosctl --nodes {{.NODE}} get machineconfig
      - which talosctl

  shutdown-cluster:
    desc: Shutdown Talos across the whole cluster
    prompt: Shutdown the Talos cluster ... continue?
    cmd: talosctl --nodes {{.NODES}} shutdown --force
    preconditions:
      - talosctl config info
      - talosctl --nodes {{.NODES}} get machineconfig
      - which jq talosctl

  reset-node:
    desc: Reset Talos on a single node [NODE=required]
    prompt: Reset Talos node '{{.NODE}}' ... continue?
    cmd: talosctl --nodes {{.NODE}} reset --reboot=true --graceful=false
    requires:
      vars: [NODE]
    preconditions:
      - talosctl config info
      - talosctl --nodes {{.NODE}} get machineconfig
      - which talosctl

  reset-cluster:
    desc: Reset Talos across the whole cluster
    prompt: Reset the Talos cluster ... continue?
    cmd: talosctl --nodes {{.NODES}} reset --reboot=true --graceful=false
    preconditions:
      - talosctl config info
      - talosctl --nodes {{.NODES}} get machineconfig
      - which jq talosctl

  generate-kubeconfig:
    desc: Generate the kubeconfig for a Talos cluster
    cmd: |-
      talosctl kubeconfig --nodes {{.RANDOM_CONTROLLER}} --force /home/vscode/.kube/config
      chmod 600 /home/vscode/.kube/config
    preconditions:
      - talosctl config info
      - talosctl --nodes {{.RANDOM_CONTROLLER}} get machineconfig
      - which chmod jq talosctl

  generate-iso:
    desc: Generate a Talos SecureBoot ISO for a specific version [VERSION=required]
    cmd: |-
      curl -L --output-dir {{.TALOS_CACHE_DIR}} -O \
        https://factory.talos.dev/image/{{.TALOS_SCHEMATIC}}/{{.VERSION}}/metal-amd64-secureboot.iso
    vars:
      TALOS_SCHEMATIC:
        sh: task --silent talos:generate-schematic
    requires:
      vars: [VERSION]
    preconditions:
      - which curl task

  generate-schematic:
    desc: Generate a Talos schematic
    cmd: |-
      minijinja-cli {{.TALOS_DIR}}/schematic.yaml.j2 \
        | curl --silent -X POST --data-binary @- https://factory.talos.dev/schematics \
        | jq --raw-output '.id'
    env:
      TALOS_CONFIG_EARLY:
        sh: zstd -c {{.TALOS_DIR}}/networking.yaml | base64 -w0
    preconditions:
      - test -f {{.TALOS_DIR}}/schematic.yaml.j2
      - test -f {{.TALOS_DIR}}/networking.yaml
      - which base64 curl jq minijinja-cli zstd

  watch-resources:
    desc: Watch [RESOURCE=services|members|addresses|routes|links|disks|mounts|containers|pods]
    cmd: |-
      watch -c -t -n 2 -- "talosctl --nodes {{.NODES}} get {{.RESOURCE}} \
        | awk 'NR == 1 { header = \$0; next } \$1 != node { if (node) print \"\"; printf \"\\033[1m%s\\033[0m\\n\", header; node = \$1 } { print }'"
    vars:
      RESOURCE: '{{.RESOURCE | default "services"}}'
    preconditions:
      - talosctl config info
      - which awk jq talosctl watch

  watch-thunderbolt:
    desc: Watch control plane Thunderbolt links
    cmd: |-
      watch -t -n 2 -- "talosctl --nodes {{.NODES}} get links --output=yaml \
        | yq -o=tsv 'select(.spec.driver == \"thunderbolt-net\") | [.node, .metadata.id, .spec.hardwareAddr, .spec.busPath]'"
    preconditions:
      - talosctl config info
      - which talosctl watch yq
