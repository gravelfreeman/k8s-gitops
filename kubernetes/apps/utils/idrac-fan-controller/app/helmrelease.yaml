---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: idrac-fan-controller
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      idrac-fan-controller:
        containers:
          app:
            image:
              repository: ghcr.io/tigerblue77/dell_idrac_fan_controller
              tag: v1.91@sha256:420c21bd796d28932603a1bf041317f821a15e4a29191dec2de26f391ba02995
            envFrom:
              - secretRef:
                  name: idrac-fan-controller-app-secret
            probes:
              liveness: &probes
                custom: true
                spec:
                  exec:
                    command: [/app/healthcheck.sh]
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
