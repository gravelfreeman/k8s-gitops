---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: poznote-mcp-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: poznote-mcp-secret
  data:
    - secretKey: POZNOTE_MCP_AUTH_TOKEN
      remoteRef:
        key: poznote
        property: POZNOTE_MCP_AUTH_TOKEN
