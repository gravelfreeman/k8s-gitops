---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: poznote-mcp
spec:
  image: ghcr.io/timothepoznanski/poznote-mcp:6@sha256:a1005f2331fcf3c0562d7e945b4d2cafa6db1075ceca0c412566e6ac20ee1ea5
  transport: streamable-http
  mcpPort: 8045
  groupRef:
    name: toolhive-mcp
  externalAuthConfigRef:
    name: poznote-mcp-auth
  env:
    - name: POZNOTE_API_URL
      value: http://poznote.poznote.svc.cluster.local:8080/api/v1
  secrets:
    - name: poznote-mcp-secret
      key: POZNOTE_MCP_AUTH_TOKEN
