---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: poznote-mcp
spec:
  image: ghcr.io/timothepoznanski/poznote-mcp:6.100.0-beta@sha256:f51c9e0980206986441dcf66ec40f311c44a40d639036d45ddb0ae182a19ee41
  transport: streamable-http
  mcpPort: 8045
  groupRef:
    name: toolhive-mcp
  env:
    - name: POZNOTE_API_URL
      value: http://poznote.poznote.svc.cluster.local:8080/api/v1
    - name: POZNOTE_SERVICE_TOKEN_FILE
      value: /var/run/secrets/poznote/.mcp_token
  secrets:
    - name: poznote-mcp-secret
      key: POZNOTE_MCP_AUTH_TOKEN
  externalAuthConfigRef:
    name: poznote-mcp-auth
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          volumeMounts:
            - name: poznote-service-token
              mountPath: /var/run/secrets/poznote
              readOnly: true
      volumes:
        - name: poznote-service-token
          secret:
            secretName: poznote-mcp-secret
            items:
              - key: POZNOTE_MCP_AUTH_TOKEN
                path: .mcp_token
