---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: poznote
spec:
  authType: bearer_token
  authTokenRef:
    name: poznote-mcp-secret
    key: POZNOTE_MCP_AUTH_TOKEN
  workload:
    image: ghcr.io/timothepoznanski/poznote-mcp:6.108.2-beta@sha256:4ed00609a0e160ecfb81119efde93dd6d66e6761f081772f4c57cf141e696110
    port: 8045
    env:
      - name: POZNOTE_API_URL
        value: http://poznote.poznote.svc.cluster.local:8080/api/v1
      - name: POZNOTE_SERVICE_TOKEN_FILE
        value: /var/run/secrets/poznote/.mcp_token
    volumes:
      - name: poznote-service-token
        secret:
          secretName: poznote-mcp-secret
          items:
            - key: POZNOTE_MCP_AUTH_TOKEN
              path: .mcp_token
    volumeMounts:
      - name: poznote-service-token
        mountPath: /var/run/secrets/poznote
        readOnly: true
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
