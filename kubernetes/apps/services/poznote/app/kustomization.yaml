apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - externalsecret.yaml
  - helmrelease.yaml
configMapGenerator:
  - name: poznote-css
    files:
      - catppuccin_frappe_dark.css=./resources/catppuccin_frappe_dark.css
      - catppuccin_latte_light.css=./resources/catppuccin_latte_light.css
      - catppuccin_macchiato_dark.css=./resources/catppuccin_macchiato_dark.css
      - catppuccin_mocha_dark.css=./resources/catppuccin_mocha_dark.css
generatorOptions:
  disableNameSuffixHash: true
