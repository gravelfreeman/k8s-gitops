---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: poznote
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      mcp-server:
        containers:
          app:
            image:
              repository: ghcr.io/timothepoznanski/poznote-mcp
              tag: 6@sha256:00cd113b17f4836dc1dfa7a4b96f270b254cbfa0c7e6a82e13d2b6de34c44ef8
            env:
              MCP_PORT: 8045
              POZNOTE_API_URL: http://poznote-app:8080/api/v1
              POZNOTE_SERVICE_TOKEN_FILE: /var/www/html/data/.mcp_token
            probes:
              liveness:
                enabled: true
                type: TCP
                port: 8045
              readiness:
                enabled: true
                type: TCP
                port: 8045
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          automountServiceAccountToken: false
      poznote:
        containers:
          app:
            image:
              repository: ghcr.io/timothepoznanski/poznote
              tag: 6-rootless@sha256:7307ffec08405504fb2528215d635278fc09adbf088e91f2cd6a7193f72a49e5
            env:
              POZNOTE_OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    key: POZNOTE_OIDC_CLIENT_ID
                    name: poznote-app-secret
              POZNOTE_OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    key: POZNOTE_OIDC_CLIENT_SECRET
                    name: poznote-app-secret
              POZNOTE_OIDC_DISABLE_NORMAL_LOGIN: false
              SQLITE_DATABASE: /var/www/html/data/database/poznote.db
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
                path: /api/health
              readiness: *probes
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 512Mi
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          automountServiceAccountToken: false
    persistence:
      app-secret:
        type: secret
        name: poznote-app-secret
        advancedMounts:
          poznote:
            app:
              - path: /var/www/html/data/.app_secret
                readOnly: true
                subPath: POZNOTE_APP_SECRET
      data:
        existingClaim: poznote-data
        advancedMounts:
          mcp-server:
            app:
              - path: /var/www/html/data
                readOnly: true
          poznote:
            app:
              - path: /var/www/html/data
      runtime:
        type: emptyDir
        advancedMounts:
          poznote:
            app:
              - path: /run
              - path: /var/lib/nginx
              - path: /var/log
    route:
      app:
        hostnames: ['poznote.${DOMAIN_0}']
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 8080
    service:
      app:
        controller: poznote
        ports:
          http:
            port: 8080
      mcp:
        controller: mcp-server
        ports:
          http:
            port: 8045
