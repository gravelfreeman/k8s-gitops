---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: poznote
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      poznote:
        containers:
          app:
            image:
              repository: ghcr.io/timothepoznanski/poznote
              tag: 6-rootless@sha256:19ab3876952e0949a112863acc63bc5b17532a3d4ed84a75385d2f98bff7ae92
            env:
              POZNOTE_OIDC_CLIENT_ID: b969fd3f-be82-42ba-8515-c090896f600b
            probes:
              liveness: &probesApp
                enabled: true
                type: HTTP
                path: /api/health
              readiness: *probesApp
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
          mcp:
            image:
              repository: ghcr.io/timothepoznanski/poznote-mcp
              tag: 6@sha256:00cd113b17f4836dc1dfa7a4b96f270b254cbfa0c7e6a82e13d2b6de34c44ef8
            env:
              POZNOTE_API_URL: http://localhost:8080/api/v1
            probes:
              liveness: &probesMcp
                enabled: true
                type: TCP
                port: 8045
              readiness: *probesMcp
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi
        defaultContainerOptions:
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsGroup: 568
        runAsUser: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      data:
        existingClaim: poznote-data
        advancedMounts:
          poznote:
            app:
              - path: /var/www/html/data
            mcp:
              - path: /var/www/html/data
                readOnly: true
      runtime:
        type: emptyDir
        advancedMounts:
          poznote:
            app:
              - path: /run
              - path: /var/lib/nginx
              - path: /var/log/supervisor
    route:
      app:
        hostnames: ['poznote.${DOMAIN_0}']
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 8080
          - matches:
              - path:
                  type: PathPrefix
                  value: /mcp
            backendRefs:
              - identifier: app
                port: 8045
    service:
      app:
        controller: poznote
        ports:
          http:
            port: 8080
          mcp:
            port: 8045
