---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: poznote
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      poznote:
        containers:
          app:
            image:
              repository: ghcr.io/timothepoznanski/poznote
              tag: 6.99.0-rootless@sha256:fecbc0c214157b1c5514694df2905c687cce57af13b47bee5c53c5fb7b64a442
            env:
              POZNOTE_OIDC_CLIENT_ID: b969fd3f-be82-42ba-8515-c090896f600b
              POZNOTE_OIDC_DISABLE_NORMAL_LOGIN: true
            envFrom:
              - secretRef:
                  name: poznote-app-secret
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
                path: /api/health
              readiness: *probes
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
        pod:
          securityContext:
            runAsNonRoot: true
            runAsGroup: 1000
            runAsUser: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
    persistence:
      data:
        existingClaim: poznote-data
        globalMounts:
          - path: /var/www/html/data
      # css:
      #   name: poznote-css
      #   type: configMap
      #   globalMounts:
      #     - path: /var/www/html/data/css
      runtime:
        type: emptyDir
        globalMounts:
          - path: /run
          - path: /run/nginx
          - path: /var/lib/nginx/logs
          - path: /var/lib/nginx/tmp
          - path: /var/log/supervisor
    route:
      app:
        hostnames: ['poznote.${DOMAIN_0}']
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
    service:
      app:
        ports:
          http:
            port: 8080
