---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: poznote
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      poznote:
        containers:
          app:
            image:
              repository: ghcr.io/timothepoznanski/poznote
              tag: 6-rootless@sha256:5b70cb6f6843ee82cf29e7728d470a471e70b7a0498606309afb657f34c2c3ce
            env:
              POZNOTE_OIDC_CLIENT_ID: b969fd3f-be82-42ba-8515-c090896f600b
              POZNOTE_OIDC_DISABLE_NORMAL_LOGIN: true
            envFrom:
              - secretRef:
                  name: poznote-app-secret
            probes:
              liveness: &probesApp
                enabled: true
                type: HTTP
                path: /api/health
              readiness: *probesApp
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
          mcp:
            image:
              repository: ghcr.io/timothepoznanski/poznote-mcp
              tag: 6@sha256:37505d3176653c4b52144ad1c27d871d22eee8578697f444fc81d0e831c65fe4
            env:
              POZNOTE_API_URL: http://localhost:8080/api/v1
            probes:
              liveness: &probesMcp
                enabled: true
                type: TCP
                port: 8045
              readiness: *probesMcp
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi
        defaultContainerOptions:
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsGroup: 1000
        runAsUser: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      data:
        existingClaim: poznote-data
        advancedMounts:
          poznote:
            app:
              - path: /var/www/html/data
            mcp:
              - path: /var/www/html/data
                readOnly: true
      css:
        type: configMap
        name: poznote-css
        advancedMounts:
          poznote:
            app:
              - path: /var/www/html/data/css
      runtime:
        type: emptyDir
        advancedMounts:
          poznote:
            app:
              - path: /run
              - path: /run/nginx
              - path: /var/lib/nginx/logs
              - path: /var/lib/nginx/tmp
              - path: /var/log/supervisor
    route:
      app:
        hostnames: ['poznote.${DOMAIN_0}']
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 8080
          - matches:
              - path:
                  type: PathPrefix
                  value: /mcp
            backendRefs:
              - identifier: app
                port: 8045
    service:
      app:
        controller: poznote
        ports:
          http:
            port: 8080
          mcp:
            port: 8045
