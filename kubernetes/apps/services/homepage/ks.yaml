---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app homepage
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/common
    - ../../../../components/envoy-oidc
  dependsOn:
    - name: envoy-gateway-config
    - name: external-secrets-store
  interval: 1h
  path: kubernetes/apps/services/homepage/app
  postBuild:
    substitute:
      APP: *app
      ENVOY_OIDC_SUBDOMAIN: root
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: *app
  timeout: 5m
  wait: true
