apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - externalsecret.yaml
  - helmrelease.yaml
configMapGenerator:
  - name: homepage-config
    files:
      - custom.css=./config/custom.css
      - custom.js=./config/custom.js
      - services.yaml=./config/services.yaml
      - settings.yaml=./config/settings.yaml
      - widgets.yaml=./config/widgets.yaml
    literals:
      - docker.yaml=
      - proxmox.yaml=
      - |-
        kubernetes.yaml=
        mode: cluster
        ingress: false
        traefik: false
        gateway: true
  - name: homepage-assets
    files:
      - favicon.png=./config/assets/favicon.png
      - logo.png=./config/assets/logo.png
configurations:
  - kustomizeconfig.yaml
