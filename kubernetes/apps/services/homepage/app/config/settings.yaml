# yaml-language-server: $schema=https://www.schemastore.org/any.json
---
title: 'root:freeman'
favicon: '/images/favicon.ico'
color: slate
providers:
  openweathermap: 'openweathermapapikey'
  weatherapi: 'weatherapiapikey'
headerStyle: 'clean'
iconStyle: 'theme'
target: '_blank'
language: 'en'
quicklaunch:
    hideInternetSearch: true
    provider: 'duckduckgo'
statusStyle: 'dot'
hideVersion: true
hideErrors: true
disableCollapse: true
useEqualHeights: true
layout:
  # TAB 1
  System:
    tab: 'Homelab'
    header: false
    style: 'row'
    columns: '3'
    Observability:
      icon: 'mdi-kubernetes'
      style: 'row'
      columns: '1'
    Operations:
      header: false
      style: 'row'
      columns: '1'
      Services:
        icon: 'mdi-apps'
        style: 'row'
        columns: '4'
      Domotics:
        icon: 'mdi-home-automation'
        style: 'row'
        columns: '4'
      Core:
        icon: 'mdi-server-network'
        style: 'row'
        columns: '4'
  Scale-1:
    tab: 'Homelab'
    icon: 'sh-truenas-scale.svg'
    style: 'row'
    columns: '3'
    Storage:
      header: false
      style: 'row'
      columns: '1'
    Glances:
      header: false
      style: 'row'
      columns: '3'
  Scale-2:
    tab: 'Homelab'
    icon: 'sh-truenas-scale.svg'
    style: 'row'
    columns: '3'
    Storage:
      header: false
      style: 'row'
      columns: '1'
    Glances:
      header: false
      style: 'row'
      columns: '3'
  Bookmarks:
    tab: 'Homelab'
    icon: 'mdi-bookmark'
  Forums:
    tab: 'Homelab'
    icon: 'mdi-forum'
  Management:
    tab: 'Homelab'
    icon: 'mdi-shield-crown'
  # TAB 2
  Media:
    tab: 'Media'
    icon: 'mdi-bookshelf'
    style: row
    columns: '6'
  Usenet:
    tab: 'Media'
    icon: 'mdi-newspaper-variant-multiple'
  Torrent/EN:
    tab: 'Media'
    icon: 'mdi-share-variant'
  Torrent/FR:
    tab: 'Media'
    icon: 'mdi-baguette'
  Direct Download:
    tab: 'Media'
    icon: 'mdi-cloud-download'
