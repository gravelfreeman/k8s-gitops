# yaml-language-server: $schema=https://www.schemastore.org/any.json
---
title: 'root:freeman'
favicon: '/images/favicon.png'
color: slate
providers:
  openweathermap: 'openweathermapapikey'
  weatherapi: 'weatherapiapikey'
headerStyle: 'clean'
iconStyle: 'theme'
target: '_blank'
language: 'en'
quicklaunch:
    hideInternetSearch: 'true'
    provider: 'duckduckgo'
statusStyle: 'dot'
hideVersion: 'true'
hideErrors: 'true'
useEqualHeights: 'true'
layout:
  # TAB 1
  System:
    tab: 'Homelab'
    header: false
    style: 'row'
    columns: '3'
    Observability:
      style: 'row'
      columns: '1'
    Operations:
      header: false
      style: 'row'
      columns: '1'
      Services:
        style: 'row'
        columns: '4'
      Domotics:
        style: 'row'
        columns: '4'
      Core:
        style: 'row'
        columns: '4'
  Scale-1:
    tab: 'Homelab'
    icon: 'sh-truenas-scale.svg'
    style: 'row'
    columns: '3'
    Storage:
      header: false
      style: 'row'
      columns: '1'
    Glances:
      header: false
      style: 'row'
      columns: '3'
  Scale-2:
    tab: 'Homelab'
    icon: 'sh-truenas-scale.svg'
    style: 'row'
    columns: '3'
    Storage:
      header: false
      style: 'row'
      columns: '1'
    Glances:
      header: false
      style: 'row'
      columns: '3'
  Bookmarks:
    tab: 'Homelab'
  Server:
    tab: 'Homelab'
  Forums:
    tab: 'Homelab'
  # TAB 3
  Media:
    tab: 'Media'
    icon: 'mdi-bookshelf'
    style: row
    columns: '6'
  Usenet:
    tab: 'Media'
    icon: 'mdi-newspaper-variant-multiple'
  Torrent/EN:
    tab: 'Media'
    icon: 'mdi-download-network'
  Torrent/FR:
    tab: 'Media'
    icon: 'mdi-download-network'
  Direct Download:
    tab: 'Media'
    icon: 'mdi-cloud-download'
