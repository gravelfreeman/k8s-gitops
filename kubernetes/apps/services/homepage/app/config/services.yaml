            widget:
                type: glances
                url: 'http://10.0.10.11:30015'
                version: 4
                metric: cpu
        - Memory Usage:
            widget:
                type: glances
                url: 'http://10.0.10.11:30015'
                version: 4
                metric: memory
        - Network Usage:
            widget:
                type: glances
                url: 'http://10.0.10.11:30015'
                version: 4
                metric: 'network:eth0'
        - Top Processes:
            widget:
                type: glances
                url: 'http://10.0.10.11:30015'
                version: 4
                metric: process
        - CPU Temp:
            widget:
                type: glances
                url: 'http://10.0.10.11:30015'
                version: 4
                metric: 'sensor:Package id 0'
        - Disk I/O:
