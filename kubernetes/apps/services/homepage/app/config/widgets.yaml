---
- logo:
    icon: '/images/favicon.png'
- unifi_console:
    url: 'https://10.0.20.1:443'
    key: '{{HOMEPAGE_FILE_UDM_KEY}}'
- kubernetes:
    cluster:
      show: false
      cpu: false
      memory: false
      showLabel: false
      label: 'cluster'
    nodes:
      show: true
      cpu: true
      memory: true
      showLabel: true
- weatherapi:
    label: '${CITY}'
    latitude: '${LATITUDE}'
    longitude: '${LONGITUDE}'
    units: 'metric'
    apiKey: '{{HOMEPAGE_FILE_WEATHERAPI_KEY}}'
    cache: '5'
