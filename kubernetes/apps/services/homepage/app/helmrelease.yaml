---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app homepage
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      homepage:
        containers:
          app:
            image:
              repository: ghcr.io/gethomepage/homepage
              tag: v1.12.3@sha256:cc84f2f5eb3c7734353701ccbaa24ed02dacb0d119114e50e4251e2005f3990a
            env:
              HOMEPAGE_ALLOWED_HOSTS: root.${DOMAIN_0}
              HOMEPAGE_FILE_AUDIOBOOKSHELF_KEY: /secrets/AUDIOBOOKSHELF_KEY
              HOMEPAGE_FILE_AUTOBRR_KEY: /secrets/AUTOBRR_KEY
              HOMEPAGE_FILE_BAZARR_KEY: /secrets/BAZARR_KEY
              HOMEPAGE_FILE_CLOUDFLARED_KEY: /secrets/CLOUDFLARED_KEY
              HOMEPAGE_FILE_HAOS_KEY: /secrets/HAOS_KEY
              HOMEPAGE_FILE_HOMEBOX_KEY: /secrets/HOMEBOX_KEY
              HOMEPAGE_FILE_IMMICH_KEY: /secrets/IMMICH_KEY
              HOMEPAGE_FILE_JDOWNLOADER_PASSWORD: /secrets/JDOWNLOADER_PASSWORD
              HOMEPAGE_FILE_LIDARR_KEY: /secrets/LIDARR_KEY
              HOMEPAGE_FILE_MEALIE_KEY: /secrets/MEALIE_KEY
              HOMEPAGE_FILE_PLEX_KEY: /secrets/PLEX_KEY
              HOMEPAGE_FILE_PROWLARR_KEY: /secrets/PROWLARR_KEY
              HOMEPAGE_FILE_QB_PASSWORD: /secrets/QB_PASSWORD
              HOMEPAGE_FILE_RADARR_KEY: /secrets/RADARR_KEY
              HOMEPAGE_FILE_SABNZBD_ALT_KEY: /secrets/SABNZBD_ALT_KEY
              HOMEPAGE_FILE_SABNZBD_KEY: /secrets/SABNZBD_KEY
              HOMEPAGE_FILE_SCALE_01_KEY: /secrets/SCALE_01_KEY
              HOMEPAGE_FILE_SCALE_02_KEY: /secrets/SCALE_02_KEY
              HOMEPAGE_FILE_SEERR_KEY: /secrets/SEERR_KEY
              HOMEPAGE_FILE_SONARR_KEY: /secrets/SONARR_KEY
              HOMEPAGE_FILE_TAUTULLI_KEY: /secrets/TAUTULLI_KEY
              HOMEPAGE_FILE_UCG_KEY: /secrets/UCG_KEY
              HOMEPAGE_FILE_UDM_KEY: /secrets/UDM_KEY
              HOMEPAGE_FILE_WEATHERAPI_KEY: /secrets/WEATHERAPI_KEY
            envFrom:
              - secretRef:
                  name: homepage-env-secret
            probes:
              liveness: &probes
                custom: true
                spec:
                  httpGet:
                    path: /api/healthcheck
                    port: &port 3000
                    httpHeaders:
                      - name: Host
                        value: root.${DOMAIN_0}
              readiness: *probes
            resources:
              requests: { cpu: 200m, memory: 256Mi }
              limits: { memory: 384Mi }
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
    serviceAccount:
      homepage: {}
    rbac:
      roles:
        homepage:
          forceRename: *app
          type: ClusterRole
          rules:
            - apiGroups: [""]
              resources: ["namespaces", "nodes", "pods"]
              verbs: &readVerbs ["get", "list"]
            - apiGroups: ["metrics.k8s.io"]
              resources: ["nodes", "pods"]
              verbs: *readVerbs
      bindings:
        homepage:
          forceRename: *app
          type: ClusterRoleBinding
          roleRef:
            identifier: *app
          subjects:
            - identifier: *app
    persistence:
      config:
        type: configMap
        name: homepage-config
        globalMounts:
          - path: /app/config/custom.css
            subPath: custom.css
          - path: /app/config/custom.js
            subPath: custom.js
          - path: /app/config/docker.yaml
            subPath: docker.yaml
          - path: /app/config/kubernetes.yaml
            subPath: kubernetes.yaml
          - path: /app/config/proxmox.yaml
            subPath: proxmox.yaml
          - path: /app/config/services.yaml
            subPath: services.yaml
          - path: /app/config/settings.yaml
            subPath: settings.yaml
          - path: /app/config/widgets.yaml
            subPath: widgets.yaml
      bookmarks:
        type: secret
        name: homepage-bookmarks-secret
        globalMounts:
          - path: /app/config/bookmarks.yaml
            subPath: bookmarks.yaml
            readOnly: true
      assets:
        type: configMap
        name: homepage-assets
        globalMounts:
          - path: /app/public/images/background.jpg
            subPath: background.jpg
          - path: /app/public/images/favicon.png
            subPath: favicon.png
          - path: /app/public/images/logo.png
            subPath: logo.png
      secrets:
        enabled: true
        type: secret
        name: homepage-file-secret
        globalMounts:
          - path: /secrets
            readOnly: true
      logs:
        type: emptyDir
        globalMounts:
          - path: /app/config/logs
    route:
      app:
        hostnames: ['root.${DOMAIN_0}']
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
