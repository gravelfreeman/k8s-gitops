---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openchore
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      api:
        containers:
          app:
            image:
              repository: ghcr.io/liftedkilt/openchore/api
              tag: latest@sha256:8841a0005910b768b099b3c3404d07cee81abcc327acf9adf28acf85568053d6
            probes:
              liveness: &apiProbes
                enabled: true
                type: HTTP
                path: /api/users
              readiness: *apiProbes
            resources: &resources
              requests:
                cpu: 25m
                memory: 128Mi
            securityContext: &securityContext
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
      web:
        containers:
          app:
            image:
              repository: ghcr.io/liftedkilt/openchore/web
              tag: latest@sha256:c0773d8953c2d1b105263e89b0ffbf6b469412d7dc190d11c23d0ae7eccdf5fc
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources: *resources
            securityContext: *securityContext
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      data:
        existingClaim: openchore-data
        advancedMounts:
          api:
            app:
              - path: /data
      nginx-config:
        type: configMap
        name: openchore-nginx
        advancedMounts:
          web:
            app:
              - path: /etc/nginx/conf.d/default.conf
                subPath: default.conf
      workdir:
        type: emptyDir
        globalMounts:
          - path: /run
          - path: /tmp
          - path: /var/cache/nginx
    route:
      app:
        hostnames: ['openchore.${DOMAIN_0}']
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
        rules:
          - backendRefs:
              - identifier: web
                port: 8080
    service:
      api:
        controller: api
        ports:
          http:
            port: 8080
      web:
        controller: web
        ports:
          http:
            port: 8080
