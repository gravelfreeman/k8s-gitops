---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openchore
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      api:
        containers:
          app:
            image:
              repository: ghcr.io/liftedkilt/openchore/api
              tag: sha-c5a9dd8@sha256:c7e12f06f4d95ddebefe762628a0a7438720b942a354109f90c4561bc6c103db
            env:
              AI_ENDPOINT: http://openchore-litert:8080
              CONFIG_PATH: /secrets/config/config.yaml
            probes:
              liveness: &apiProbes
                enabled: true
                type: HTTP
                path: /api/users
              readiness: *apiProbes
            resources: &resources
              requests:
                cpu: 25m
                memory: 128Mi
            securityContext: &securityContext
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
      web:
        containers:
          app:
            image:
              repository: ghcr.io/liftedkilt/openchore/web
              tag: sha-c5a9dd8@sha256:c399dccfd2e709b1a91331294696bacdac8ba3bc4c44673edb94fe8cf8cf8fb7
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources: *resources
            securityContext: *securityContext
      litert:
        containers:
          app:
            image:
              repository: ghcr.io/liftedkilt/openchore/litert
              tag: sha-ce95f33@sha256:182cf41e5168045e4ffe0e59cf1fafbd6119857f855981ec481c207d566a0ed6
            env:
              XDG_CACHE_HOME: /app/model/.cache
              PYTHONDONTWRITEBYTECODE: "1"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
                type: HTTP
                path: /health
                spec:
                  failureThreshold: 6
                  timeoutSeconds: 10
            resources:
              requests:
                cpu: 500m
                memory: 4Gi
              limits:
                memory: 8Gi
            securityContext: *securityContext
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      data:
        existingClaim: openchore-data
        advancedMounts:
          api:
            app:
              - path: /data
      config:
        type: secret
        name: openchore-config-secret
        advancedMounts:
          api:
            app:
              - path: /secrets/config
      nginx-config:
        type: configMap
        name: openchore-nginx
        advancedMounts:
          web:
            app:
              - path: /etc/nginx/conf.d/default.conf
                subPath: default.conf
      litert-model:
        suffix: litert-model
        accessMode: ReadWriteOnce
        size: 10Gi
        advancedMounts:
          litert:
            app:
              - path: /app/model
      workdir:
        type: emptyDir
        globalMounts:
          - path: /run
          - path: /var/cache/nginx
    route:
      app:
        hostnames: ['openchore.${DOMAIN_0}']
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
        rules:
          - backendRefs:
              - identifier: web
                port: 8080
    service:
      api:
        controller: api
        ports:
          http:
            port: 8080
      web:
        controller: web
        ports:
          http:
            port: 8080
      litert:
        controller: litert
        ports:
          http:
            port: 8080
