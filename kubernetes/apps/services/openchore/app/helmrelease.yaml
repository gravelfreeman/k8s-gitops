---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openchore
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      api:
        containers:
          app:
            image:
              repository: ghcr.io/liftedkilt/openchore/api
              tag: sha-e0134c5@sha256:d7e815ed667e192ae5b4ca29d1edabaaa475c2a896bdafe171dfe6e6e3dffb74
            env:
              AI_ENDPOINT: http://openchore-litert:8080
            probes:
              liveness: &apiProbes
                enabled: true
                type: HTTP
                path: /api/users
              readiness: *apiProbes
            resources: &resources
              requests:
                cpu: 25m
                memory: 128Mi
            securityContext: &securityContext
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
      web:
        containers:
          app:
            image:
              repository: ghcr.io/liftedkilt/openchore/web
              tag: sha-e0134c5@sha256:4859066b7860aa71e7b50d1366e15d398ac43086cbd77331db07b11047c8d60b
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources: *resources
            securityContext: *securityContext
      litert:
        containers:
          app:
            image:
              repository: ghcr.io/liftedkilt/openchore/litert
              tag: sha-e0134c5@sha256:a728d544eabf064a3f6fe157016fc5e02d6dfda93842e2c4893bd64cbf87d1b4
            env:
              XDG_CACHE_HOME: /app/model/.cache
              PYTHONDONTWRITEBYTECODE: "1"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
                type: HTTP
                path: /health
                spec:
                  failureThreshold: 6
                  timeoutSeconds: 10
            resources:
              requests:
                cpu: 500m
                memory: 4Gi
              limits:
                memory: 8Gi
            securityContext: *securityContext
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      data:
        existingClaim: openchore-data
        advancedMounts:
          api:
            app:
              - path: /data
      nginx-config:
        type: configMap
        name: openchore-nginx
        advancedMounts:
          web:
            app:
              - path: /etc/nginx/conf.d/default.conf
                subPath: default.conf
      litert-model:
        suffix: litert-model
        accessMode: ReadWriteOnce
        size: 10Gi
        advancedMounts:
          litert:
            app:
              - path: /app/model
      workdir:
        type: emptyDir
        globalMounts:
          - path: /run
          - path: /var/cache/nginx
    route:
      app:
        hostnames: ['openchore.${DOMAIN_0}']
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
        rules:
          - backendRefs:
              - identifier: web
                port: 8080
    service:
      api:
        controller: api
        ports:
          http:
            port: 8080
      web:
        controller: web
        ports:
          http:
            port: 8080
      litert:
        controller: litert
        ports:
          http:
            port: 8080
