---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app open-webui
spec:
  components:
    - ../../../../components/common/app
    - ../../../../components/cnpg
    - ../../../../components/homepage
    - ../../../../components/volsync
  dependsOn:
    - name: cloudnative-pg
    - name: external-secrets-store
    - name: litellm
    - name: volsync
  interval: 1h
  path: kubernetes/apps/services/open-webui/app
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CAPACITY: 100Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: *app
  timeout: 10m
  wait: true
