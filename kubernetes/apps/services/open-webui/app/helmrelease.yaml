---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      open-webui:
        containers:
          app:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.11.4@sha256:9591b13f13843c7721c2b8eaf7382846c81b3ffe126526d1888d1fed50c6a33f
            env:
              DEFAULT_USER_ROLE: user
              ENABLE_LOGIN_FORM: false
              ENABLE_PASSWORD_AUTH: false
              ENABLE_OAUTH_GROUP_CREATION: true
              ENABLE_OAUTH_GROUP_MANAGEMENT: true
              ENABLE_OAUTH_ROLE_MANAGEMENT: true
              ENABLE_OAUTH_SIGNUP: true
              OAUTH_ALLOWED_ROLES: admin,privileged,user
              OAUTH_AUTHORIZE_PARAMS: '{"resource":"https://litellm.${DOMAIN_0}"}'
              OAUTH_CLIENT_ID: e7244e19-a352-4870-bf09-1e33ef9db2a1
              OAUTH_CODE_CHALLENGE_METHOD: S256
              OAUTH_GROUP_DEFAULT_SHARE: members
              OAUTH_PROVIDER_NAME: Freeman ID
              OAUTH_ROLES_CLAIM: groups
              OAUTH_SCOPES: openid email profile groups offline_access ai:chat
              OAUTH_SUB_CLAIM: sub
              OAUTH_UPDATE_PICTURE_ON_LOGIN: true
              OPENAI_API_BASE_URLS: http://litellm.litellm.svc.cluster.local:4000/v1
              OPENID_PROVIDER_URL: https://id.${DOMAIN_0}/.well-known/openid-configuration
              OPENID_REDIRECT_URI: https://chat.${DOMAIN_0}/oauth/oidc/callback
              WEBUI_URL: https://chat.${DOMAIN_0}
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: open-webui-cnpg-app
                    key: fqdn-uri
            envFrom:
              - secretRef:
                  name: open-webui-app-secret
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
                path: /health
              readiness: *probes
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              readOnlyRootFilesystem: true
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            seccompProfile:
              type: RuntimeDefault
    persistence:
      data:
        existingClaim: open-webui-data
        globalMounts:
          - path: /app/backend/data
      runtime:
        type: emptyDir
        globalMounts:
          - path: /tmp
          - path: /root/.cache/chroma
          - path: /app/backend/open_webui/static
    route:
      app:
        hostnames: ['chat.${DOMAIN_0}']
        parentRefs:
          - name: envoy-external
            namespace: envoy-gateway
            sectionName: https
    service:
      app:
        ports:
          http:
            port: 8080
