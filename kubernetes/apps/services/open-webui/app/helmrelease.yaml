---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      open-webui:
        containers:
          app:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.12.4@sha256:a5b9e403d19154796850679c8c5d1295301cee954be8b84ddd62af92426558f7
            env:
              BYPASS_ADMIN_ACCESS_CONTROL: false
              CORS_ALLOW_ORIGIN: https://chat.${DOMAIN_0}
              CONTENT_EXTRACTION_ENGINE: docling
              DEFAULT_USER_ROLE: user
              DOCLING_SERVER_URL: http://docling.docling.svc.cluster.local:5001
              DOCLING_PARAMS: >-
                {
                  "do_ocr": true,
                  "ocr_engine": "easyocr",
                  "ocr_lang": ["en", "fr"],
                  "do_table_structure": true,
                  "do_pdf_heading_hierarchy": true,
                  "do_picture_classification": true,
                  "do_picture_description": true,
                  "picture_description_preset": "docling",
                  "do_formula_enrichment": true,
                  "code_formula_preset": "docling",
                  "do_code_enrichment": true,
                  "do_chart_extraction": true,
                  "chart_extraction_preset": "docling"
                }
              ENABLE_LOCAL_WEB_FETCH: true
              ENABLE_LOGIN_FORM: false
              ENABLE_PASSWORD_AUTH: false
              ENABLE_OAUTH_GROUP_CREATION: true
              ENABLE_OAUTH_GROUP_MANAGEMENT: true
              ENABLE_OAUTH_ROLE_MANAGEMENT: true
              ENABLE_OAUTH_SIGNUP: true
              ENABLE_WEB_SEARCH: true
              OAUTH_ALLOWED_ROLES: admin,privileged,user
              OAUTH_CLIENT_ID: e7244e19-a352-4870-bf09-1e33ef9db2a1
              OAUTH_CODE_CHALLENGE_METHOD: S256
              OAUTH_GROUP_DEFAULT_SHARE: members
              OAUTH_PROVIDER_NAME: Freeman ID
              OAUTH_ROLES_CLAIM: groups
              OAUTH_SCOPES: openid email profile groups offline_access
              OAUTH_SUB_CLAIM: sub
              OAUTH_UPDATE_PICTURE_ON_LOGIN: true
              OPENID_PROVIDER_URL: https://id.${DOMAIN_0}/.well-known/openid-configuration
              OPENID_REDIRECT_URI: https://chat.${DOMAIN_0}/oauth/oidc/callback
              RAG_EMBEDDING_ENGINE: openai
              RAG_EMBEDDING_MODEL: 
              RAG_OPENAI_API_BASE_URL: http://litellm.litellm.svc.cluster.local:4000/v1
              SEARXNG_QUERY_URL: http://searxng.searxng.svc.cluster.local:8080/search
              WEB_SEARCH_ENGINE: searxng
              WEBUI_URL: https://chat.${DOMAIN_0}
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: open-webui-cnpg-app
                    key: fqdn-uri
            envFrom:
              - secretRef:
                  name: open-webui-app-secret
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
                path: /health
              readiness: *probes
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              readOnlyRootFilesystem: true
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            seccompProfile:
              type: RuntimeDefault
    persistence:
      data:
        existingClaim: open-webui-data
        globalMounts:
          - path: /app/backend/data
      runtime:
        type: emptyDir
        globalMounts:
          - path: /root/.cache/chroma
          - path: /app/backend/open_webui/static
    route:
      app:
        hostnames: ['chat.${DOMAIN_0}']
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
    service:
      app:
        ports:
          http:
            port: 8080
