---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: transmute
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      transmute:
        containers:
          app:
            image:
              repository: ghcr.io/transmute-app/transmute
              tag: 2.1.1@sha256:87b669d835d9e68bdbc4082ab061cb361cd3ecee69c14ccfa9a3814d326b6707
            env:
              DATA_DIR: /data
              APP_URL: https://transmute.${DOMAIN_0}
              OIDC_CLIENT_ID: 56fa5c53-ec71-4851-8dfb-bd346f15998e
              OIDC_ISSUER_URL: https://id.${DOMAIN_0}
              OIDC_DISPLAY_NAME: Freeman ID
              OIDC_AUTO_LAUNCH: true
            envFrom:
              - secretRef:
                  name: transmute-app-secret
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
                path: /api/health/ready
              readiness: *probes
            resources:
              requests:
                cpu: 4
                memory: 4Gi
              limits:
                memory: 8Gi
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          automountServiceAccountToken: false
    persistence:
      data:
        existingClaim: transmute-data
      workdir:
        type: emptyDir
        globalMounts:
          - path: /data/uploads
          - path: /data/outputs
          - path: /data/tmp
          - path: /.cache
    route:
        app:
          hostnames: ['transmute.${DOMAIN_0}']
          parentRefs:
            - name: envoy-internal
              namespace: envoy-gateway
              sectionName: https
    service:
      app:
        ports:
          http:
            port: 3313
