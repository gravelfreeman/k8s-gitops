---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: songhub
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      songhub:
        containers:
          app:
            image:
              repository: ghcr.io/gravelfreeman/songhub
              tag: v1.7.0@sha256:7c7f3937a58b0af41afcb4a6b9fd657114bb3fe2c6ddda80fb38050b9aaada5e
            envFrom:
              - secretRef:
                  name: songhub-app-secret
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
                path: /api/health
              readiness: *probes
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
    persistence:
      data:
        existingClaim: songhub-data
        globalMounts:
          - path: /app/saved-tabs
    route:
      app:
        hostnames: ['songhub.${DOMAIN_0}']
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
    service:
      app:
        ports:
          http:
            port: 3005
