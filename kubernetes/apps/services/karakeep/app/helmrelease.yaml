---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: karakeep
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      karakeep:
        containers:
          app:
            image:
              repository: ghcr.io/karakeep-app/karakeep
              tag: 0.34.1@sha256:69ae5315c618b7c14c1af3e34c6e211acdb231793af424ecd1cab0b70691d987
            env:
              BROWSER_WEB_URL: http://127.0.0.1:9222
              CRAWLER_FULL_PAGE_ARCHIVE: true
              DATA_DIR: /data
              DISABLE_NEW_RELEASE_CHECK: true
              DISABLE_PASSWORD_AUTH: true
              INFERENCE_ENABLE_AUTO_SUMMARIZATION: true
              INFERENCE_IMAGE_MODEL: chatgpt/gpt-6-luna
              INFERENCE_TEXT_MODEL: chatgpt/gpt-6-luna
              MEILI_ADDR: http://127.0.0.1:7700
              NEXTAUTH_URL: https://karakeep.${DOMAIN_0}
              OCR_USE_LLM: true
              OAUTH_AUTO_REDIRECT: true
              OAUTH_CLIENT_ID: 6d3891ca-91de-4d4f-be5b-a804b96a6076
              OAUTH_PROVIDER_NAME: Freeman ID
              OAUTH_WELLKNOWN_URL: https://id.${DOMAIN_0}/.well-known/openid-configuration
              OPENAI_BASE_URL: http://litellm.litellm.svc.cluster.local:4000/v1
              S6_READ_ONLY_ROOT: "1"
              S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: "1"
            envFrom:
              - secretRef:
                  name: karakeep-app-secret
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
                path: /api/health
              readiness: *probes
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 2Gi
          chrome:
            image:
              repository: ghcr.io/karakeep-app/karakeep-chrome
              tag: release@sha256:4ad61127638dd27bfe685222787c5780dd1d083d23a7658c39af657775814c44
            args:
              - --disable-gpu
              - --disable-dev-shm-usage
              - --hide-scrollbars
              - --disable-blink-features=AutomationControlled
              - --window-size=1440,900
            env:
              XDG_CACHE_HOME: /tmp
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
          meilisearch:
            image:
              repository: getmeili/meilisearch
              tag: v1.55.0@sha256:ff546679970126f8822e15d1b6a06bfbff1f2ce2e43f810cfb5258012f92de5c
            env:
              MEILI_ENV: production
              MEILI_NO_ANALYTICS: true
              MEILI_UPGRADE_DB: "true"
            envFrom:
              - secretRef:
                  name: karakeep-meilisearch-secret
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 2Gi
        defaultContainerOptions:
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      data:
        existingClaim: karakeep-data
        advancedMounts:
          karakeep:
            app:
              - path: /data
                subPath: karakeep
            meilisearch:
              - path: /meili_data
                subPath: meilisearch
      runtime:
        type: emptyDir
        advancedMounts:
          karakeep:
            app:
              - path: /app/apps/web/.next/cache
              - path: /run
    route:
      app:
        hostnames: ['karakeep.${DOMAIN_0}']
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
    service:
      app:
        ports:
          http:
            port: 3000
