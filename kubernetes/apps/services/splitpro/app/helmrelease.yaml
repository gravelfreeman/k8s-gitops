---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: splitpro
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      splitpro:
        initContainers:
          db-wait:
            image:
              repository: postgres
              tag: "18.3-alpine3.23@sha256:52098013b4b64a746626437d38afc03cabff6cdeb4d3d92e2342aa95f0ce56ea"
            command: ["/bin/sh", "-ec"]
            args: ["until pg_isready -q -h ${APP}-cnpg-rw -p 5432 -U postgres -d postgres; do sleep 2; done"]
            securityContext: &securityContext
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
        containers:
          app:
            image:
              repository: ossapps/splitpro
              tag: v2.1.3@sha256:14fba0d663bee839e7492ef39845fad4313a5e4b2caacdfd0f0bdb3c285be485
            env:
              PORT: &httpPort 3000
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: splitpro-cnpg-app
                    key: fqdn-uri
              DEFAULT_HOMEPAGE: /balances
              DISABLE_EMAIL_SIGNUP: true
              ENABLE_SENDING_INVITES: true
              FROM_EMAIL: id@${DOMAIN_0}
              EMAIL_SERVER_PORT: 587
              EMAIL_SERVER_HOST: ${SMTP_HOST_0}
              EMAIL_SERVER_USER: ${SMTP_USERNAME_0}
              NEXTAUTH_URL: https://split.${DOMAIN_0}
              OIDC_NAME: Freeman ID
              OIDC_CLIENT_ID: 31e06d58-9a6b-4e3f-8e10-819f5ab1e2fd
              OIDC_WELL_KNOWN_URL: https://id.${DOMAIN_0}/.well-known/openid-configuration
              OIDC_ALLOW_DANGEROUS_EMAIL_LINKING: true
            envFrom:
              - secretRef:
                  name: splitpro-app-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 512Mi
            securityContext: *securityContext
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          automountServiceAccountToken: false
    persistence:
      data:
        existingClaim: splitpro-data
        globalMounts:
          - path: /app/uploads
    route:
      app:
        hostnames: ['split.${DOMAIN_0}']
        parentRefs:
          - name: envoy-external
            namespace: envoy-gateway
            sectionName: https
    service:
      app:
        ports:
          http:
            port: *httpPort
