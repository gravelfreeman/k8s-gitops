---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sparkyfitness
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      sparkyfitness:
        containers:
          frontend:
            image:
              repository: codewithcj/sparkyfitness
              tag: v1.6.1@sha256:092090994d27c968d4d5ea7808f8d566aa9c323508b564f0bd4762720b358979
            env:
              SPARKY_FITNESS_FRONTEND_URL: https://sparkyfitness.${DOMAIN_0}
              SPARKY_FITNESS_SERVER_HOST: localhost
            probes:
              liveness: &frontend
                enabled: true
                type: HTTP
                path: /
              readiness: *frontend
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 256Mi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
          server:
            image:
              repository: codewithcj/sparkyfitness_server
              tag: v1.6.1@sha256:d37fcac4d0d44c212b9bfacabaf53f502adda7c9a28a2c4941c066df7a0778e7
            env:
              SPARKY_FITNESS_ADMIN_EMAIL: "id@{DOMAIN_0}"
              BETTER_AUTH_SECRET_FILE: /secrets/app/BETTER_AUTH_SECRET
              SPARKY_FITNESS_API_ENCRYPTION_KEY_FILE: /secrets/app/SPARKY_FITNESS_API_ENCRYPTION_KEY
              SPARKY_FITNESS_DISABLE_EMAIL_LOGIN: true
              SPARKY_FITNESS_FRONTEND_URL: https://sparkyfitness.${DOMAIN_0}
              SPARKY_FITNESS_OIDC_AUTO_REDIRECT: true
              SPARKY_FITNESS_OIDC_AUTO_REGISTER: true
              SPARKY_FITNESS_OIDC_AUTH_ENABLED: true
              SPARKY_FITNESS_OIDC_CLIENT_ID: 329f5095-5fac-4bbe-831c-d6fdadd696cf
              SPARKY_FITNESS_OIDC_ISSUER_URL: https://id.${DOMAIN_0}
              SPARKY_FITNESS_OIDC_PROVIDER_NAME: Freeman ID
              SPARKY_FITNESS_OIDC_PROVIDER_SLUG: freeman-id
              SPARKY_FITNESS_DB_HOST: sparkyfitness-cnpg-rw
              SPARKY_FITNESS_DB_NAME: *app
              SPARKY_FITNESS_DB_USER: *app
              SPARKY_FITNESS_DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: sparkyfitness-cnpg-app
                    key: password
            envFrom:
              - secretRef:
                  name: sparkyfitness-app-secret
            probes:
              liveness: &server
                enabled: true
                type: HTTP
                path: /api/health
              readiness: *server
            resources:
              requests:
                cpu: 200m
                memory: 256Mi
              limits:
                cpu: 1
                memory: 1Gi
            securityContext: *securityContext
        pod:
          securityContext:
            runAsNonRoot: true
            runAsGroup: 568
            runAsUser: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
    persistence:
      data:
        existingClaim: sparkyfitness-data
        advancedMounts:
          sparkyfitness:
            server:
              - path: /app/SparkyFitnessServer/uploads
      backups:
        type: emptyDir
        advancedMounts:
          sparkyfitness:
            server:
              - path: /app/SparkyFitnessServer/backup
      secrets:
        name: sparkyfitness-app-secret
        type: secret
        advancedMounts:
          sparkyfitness:
            server:
              - path: /secrets/app
    route:
      app:
        hostnames: ['sparkyfitness.${DOMAIN_0}']
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
    service:
      app:
        ports:
          http:
            port: 80
