---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: donetick
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      donetick:
        containers:
          app:
            image:
              repository: donetick/donetick
              tag: v0.1.75@sha256:5c207a86e5425052e9ffe5286f96f71babfe57337760d303a5fb56a856790d11
            env:
              DT_JWT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: donetick-app-secret
                    key: JWT_SECRET
              DT_OAUTH2_AUTH_URL: https://id.${DOMAIN_0}/authorize
              DT_OAUTH2_CLIENT_ID: ab6e378f-3a1c-4a6a-8477-e9c7a6ff2423
              DT_OAUTH2_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: donetick-app-secret
                    key: OIDC_CLIENT_SECRET
              DT_OAUTH2_NAME: Freeman ID
              DT_OAUTH2_REDIRECT_URL: https://donetick.${DOMAIN_0}/auth/oauth2
              DT_OAUTH2_SCOPES: openid,profile,email
              DT_OAUTH2_TOKEN_URL: https://id.${DOMAIN_0}/api/oidc/token
              DT_OAUTH2_USER_INFO_URL: https://id.${DOMAIN_0}/api/oidc/userinfo
              DT_SERVER_PUBLIC_HOST: https://donetick.${DOMAIN_0}
              DT_SQLITE_PATH: /donetick-data/donetick.db
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
                path: /api/v1/health
              readiness: *probes
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 256Mi
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          automountServiceAccountToken: false
    persistence:
      data:
        existingClaim: donetick-data
      tmp:
        type: emptyDir
    route:
      app:
        hostnames: ['donetick.${DOMAIN_0}']
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
    service:
      app:
        ports:
          http:
            port: 2021
