---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: norish
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      norish:
        containers:
          app:
            image:
              repository: norishapp/norish
              tag: v0.20.0-beta@sha256:a289b81273dac3b7e7a17fd2a8a2c313d5edc673e5ba42781dc155196b38b6e8
            env:
              AI_ENABLED: true
              AI_MODEL: gpt-5-mini
              AI_PROVIDER: openai
              AUTH_URL: https://norish.${DOMAIN_0}
              CHROME_WS_ENDPOINT: ws://localhost:3003
              ENABLE_REGISTRATION: true
              OIDC_CLIENT_ID: f6ffdb53-2c12-4161-9e3c-843f7e51620b
              OIDC_WELLKNOWN: https://id.${DOMAIN_0}/.well-known/openid-configuration
              OIDC_ISSUER: https://id.${DOMAIN_0}
              OIDC_NAME: Freeman ID
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: norish-cnpg-app
                    key: fqdn-uri
              REDIS_URL:
                valueFrom:
                  secretKeyRef:
                    name: norish-dragonfly-secret
                    key: REDIS_URL
            envFrom:
              - secretRef:
                  name: norish-app-secret
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
                path: /api/v1/health
              readiness: *probes
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1Gi
          chrome:
            image:
              repository: zenika/alpine-chrome
              tag: "124@sha256:8ff273195ae2d040b72b3da1199821f32ac07f5ca52b878eb5078be1d0c3488d"
            env:
              HOME: /tmp
              XDG_CACHE_HOME: /tmp/cache
            args:
              - --no-sandbox
              - --disable-gpu
              - --disable-dev-shm-usage
              - --disable-features=dbus
              - --remote-debugging-address=0.0.0.0
              - --remote-debugging-port=3003
              - --user-data-dir=/tmp/chrome
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 512Mi
        defaultContainerOptions:
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsGroup: 568
        runAsUser: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      data:
        existingClaim: norish-data
        advancedMounts:
          norish:
            app:
              - path: /app/uploads
    route:
      app:
        hostnames: ['norish.${DOMAIN_0}']
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
    service:
      app:
        ports:
          http:
            port: 3000
