---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: norish
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      norish:
        containers:
          app:
            image:
              repository: norishapp/norish
              tag: v0.22.0-beta@sha256:ba8b109e9f187ef96d253faf7a42d99af059a039c9151cfcf285d3255cd9bded
            env:
              AUTH_URL: https://norish.${DOMAIN_0}
              OBSCURA_ENDPOINT: ws://localhost:9222
              OIDC_CLIENT_ID: f6ffdb53-2c12-4161-9e3c-843f7e51620b
              OIDC_WELLKNOWN: https://id.${DOMAIN_0}/.well-known/openid-configuration
              OIDC_ISSUER: https://id.${DOMAIN_0}
              OIDC_NAME: Freeman ID
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: norish-cnpg-app
                    key: fqdn-uri
              REDIS_URL:
                valueFrom:
                  secretKeyRef:
                    name: norish-dragonfly-secret
                    key: REDIS_URL
            envFrom:
              - secretRef:
                  name: norish-app-secret
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
                path: /api/v1/health
              readiness: *probes
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1Gi
          obscura:
            image:
              repository: norishapp/obscura
              tag: 0.2.0-norish.1@sha256:5aa2f9d2e58e655b18dac0844b031fa095041febeca3882d663e0d36f95fcf23
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 512Mi
        defaultContainerOptions:
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsGroup: 568
        runAsUser: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      data:
        existingClaim: norish-data
        advancedMounts:
          norish:
            app:
              - path: /app/uploads
    route:
      app:
        hostnames: ['norish.${DOMAIN_0}']
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
    service:
      app:
        ports:
          http:
            port: 3000
