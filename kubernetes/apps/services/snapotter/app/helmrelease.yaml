---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapotter
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      snapotter:
        containers:
          app:
            image:
              repository: snapotter/snapotter
              tag: 2.2.0@sha256:2e11b4fa9138fa93e0fdfde5da3a2d042eebcfa81dd51286488872a3eb8086c8
            env:
              EXTERNAL_URL: https://snapotter.${DOMAIN_0}
              OIDC_ENABLED: true
              OIDC_PROVIDER_NAME: Freeman ID
              OIDC_ISSUER_URL: https://id.${DOMAIN_0}
              OIDC_CLIENT_ID: 922f0369-51aa-49d2-9b75-c59a43286405
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: snapotter-cnpg-app
                    key: fqdn-uri
              REDIS_URL:
                valueFrom:
                  secretKeyRef:
                    name: snapotter-dragonfly-secret
                    key: REDIS_URL
              WORKSPACE_PATH: /tmp/workspace
            envFrom:
              - secretRef:
                  name: snapotter-app-secret
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
                path: /api/v1/health
              readiness: *probes
            resources:
              requests:
                cpu: 4
                memory: 4Gi
              limits:
                memory: 8Gi
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 100Gi
        storageClass: openebs-lvm
    route:
      app:
        hostnames: ['snapotter.${DOMAIN_0}']
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
    service:
      app:
        ports:
          http:
            port: 1349
