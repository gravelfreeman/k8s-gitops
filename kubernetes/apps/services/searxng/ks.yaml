---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app searxng
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/common/app
    - ../../../../components/dragonfly
    - ../../../../components/homepage
  dependsOn:
    - name: dragonfly-operator
    - name: envoy-gateway-config
    - name: external-secrets-store
  interval: 1h
  path: kubernetes/apps/services/searxng/app
  postBuild:
    substitute:
      APP: *app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: *app
  timeout: 5m
  wait: true
