apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - externalsecret.yaml
  - helmrelease.yaml
configMapGenerator:
  - name: searxng-settings
    files:
      - settings.yml=./config/settings.yml
  - name: searxng-limiter
    files:
      - limiter.toml=./config/limiter.toml
generatorOptions:
  disableNameSuffixHash: true
