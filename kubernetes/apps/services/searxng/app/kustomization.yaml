apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - externalsecret.yaml
  - helmrelease.yaml
configMapGenerator:
  - name: searxng-config
    files:
      - settings.yml=./config/settings.yml
      - favicons.toml=./config/favicons.toml
      - limiter.toml=./config/limiter.toml
generatorOptions:
  disableNameSuffixHash: true
