---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: searxng
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      searxng:
        containers:
          app:
            image:
              repository: ghcr.io/searxng/searxng
              tag: 2026.10.19-d47cb96bf@sha256:d81e14a4328ba7a57f297dff0472be629d30bf29580406c0d5b3bdab563c9bed
            env:
              SEARXNG_BASE_URL: https://search.${DOMAIN_0}
              SEARXNG_VALKEY_URL:
                valueFrom:
                  secretKeyRef:
                    name: searxng-dragonfly-secret
                    key: REDIS_URL
            envFrom:
              - secretRef:
                  name: searxng-app-secret
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
                path: /healthz
              readiness: *probes
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 2Gi
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
        pod:
          securityContext:
            fsGroup: 977
            runAsNonRoot: true
            
            runAsUser: 977
            runAsGroup: 977
            seccompProfile:
              type: RuntimeDefault
    persistence:
      settings:
        type: configMap
        name: searxng-settings
        globalMounts:
          - path: /etc/searxng/settings.yml
            subPath: settings.yml
      limiter:
        type: configMap
        name: searxng-limiter
        globalMounts:
          - path: /etc/searxng/limiter.toml
            subPath: limiter.toml
    route:
      app:
        hostnames: ['search.${DOMAIN_0}']
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
    service:
      app:
        ports:
          http:
            port: 8080
