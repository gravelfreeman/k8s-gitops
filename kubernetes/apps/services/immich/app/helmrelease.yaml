---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    controllers:
      server:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v2.7.5@sha256:c15bff75068effb03f4355997d03dc7e0fc58720c2b54ad6f7f10d1bc57efaa5
            command: ["tini", "--", "/bin/bash", "-ec"]
            args: [. /scripts/init-cache.sh && bash /scripts/init-storage.sh && exec start.sh]
            env:
              DB_HOSTNAME: immich-cnpg-rw
              DB_USERNAME: immich
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-cnpg-app
                    key: password
            probes:
              liveness: &serverProbe
                custom: true
                spec:
                  httpGet:
                    path: /api/server/ping
                    port: &serverPort 2283
              readiness: *serverProbe
            resources:
              requests: { cpu: '1', memory: 6Gi }
              limits: { cpu: '4', memory: 12Gi }
            securityContext: &securityContext
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
      machine-learning:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              tag: v2.7.5@sha256:a2501141440f10516d329fdfba2c68082e19eb9ba6016c061ac80d23beadf7f3
            env:
              GUNICORN_CMD_ARGS: --no-control-socket
              HF_XET_CACHE: /cache/huggingface-xet
              MPLCONFIGDIR: /cache/matplotlib-config
            probes:
              liveness: &machineLearningProbe
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: &machineLearningPort 3003
              readiness: *machineLearningProbe
            resources:
              requests: { cpu: '1', memory: 6Gi }
              limits: { cpu: '4', memory: 12Gi }
            securityContext: *securityContext
    persistence:
      cache:
        type: persistentVolumeClaim
        suffix: cache
        storageClass: openebs-lvm
        accessMode: ReadWriteOnce
        size: 50Gi
        advancedMounts:
          machine-learning:
            app:
              - path: /cache
      data:
        type: persistentVolumeClaim
        existingClaim: immich-data
        advancedMounts:
          server:
            app:
              - path: /usr/src/app/upload/profile
                subPath: profile
              - path: /usr/src/app/upload/thumbs
                subPath: thumbs
      users:
        type: custom
        volumeSpec:
          csi:
            driver: nfs.csi.k8s.io
            volumeAttributes:
              server: 10.0.10.15
              share: /mnt/eden/users
        advancedMounts:
          server:
            app:
              - path: /mnt/users/${USER_1}
                subPath: ${USER_1}/.immich
      workdir:
        type: emptyDir
        globalMounts:
          - path: /tmp
        advancedMounts:
          server:
            app:
              - path: /usr/src/app/upload
      scripts:
        type: configMap
        name: scripts
        advancedMounts:
          server:
            app:
              - path: /scripts
                readOnly: true
      dragonfly-client-tls:
        type: secret
        name: immich-dragonfly-client-tls
        advancedMounts:
          server:
            app:
              - path: /certs/dragonfly
                readOnly: true
    route:
      app:
        hostnames: ['immich.${DOMAIN_0}']
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
        rules:
          - backendRefs:
              - identifier: server
                port: *serverPort
    service:
      server:
        controller: server
        ports:
          http:
            port: *serverPort
          metrics-api:
            port: 8081
          metrics-ms:
            port: 8082
      machine-learning:
        controller: machine-learning
        ports:
          http:
            port: *machineLearningPort
