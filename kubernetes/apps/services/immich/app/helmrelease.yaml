---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    controllers:
      server:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v2.7.5@sha256:c15bff75068effb03f4355997d03dc7e0fc58720c2b54ad6f7f10d1bc57efaa5
            command: ["tini", "--", "/bin/bash", "-ec"]
            args:
              - |
                bash /scripts/storage-mapping.sh
                export REDIS_URL="ioredis://$(node -e 'const fs=require(\"fs\"),d=\"/certs/dragonfly\",r=p=>fs.readFileSync(d+\"/\"+p,\"utf8\");process.stdout.write(Buffer.from(JSON.stringify({host:\"immich-dragonfly.immich.svc.cluster.local\",port:6379,db:0,tls:{ca:r(\"ca.crt\"),cert:r(\"tls.crt\"),key:r(\"tls.key\")}})).toString(\"base64\"));')"
                exec start.sh
            env:
              DB_DATABASE_NAME: app
              DB_USERNAME: app
              DB_HOSTNAME: immich-cnpg-rw
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-cnpg-app
                    key: password
            probes:
              liveness: &serverProbe
                custom: true
                spec:
                  httpGet:
                    path: /api/server/ping
                    port: &serverPort 2283
              readiness: *serverProbe
            resources:
              requests: { cpu: 100m, memory: 768Mi }
              limits: { memory: 2Gi }
            securityContext: &securityContext
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
      machine-learning:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              tag: v2.7.5@sha256:a2501141440f10516d329fdfba2c68082e19eb9ba6016c061ac80d23beadf7f3
            probes:
              liveness: &machineLearningProbe
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: &machineLearningPort 3003
              readiness: *machineLearningProbe
            resources:
              requests: { cpu: 50m, memory: 1Gi }
              limits: { memory: 4Gi }
            securityContext: *securityContext
    persistence:
      data:
        type: persistentVolumeClaim
        existingClaim: immich-data
        advancedMounts:
          server:
            app:
              - path: /usr/src/app/upload/profile
                subPath: profile
              - path: /usr/src/app/upload/thumbs
                subPath: thumbs
      machine-learning-cache:
        type: persistentVolumeClaim
        storageClass: openebs-lvm
        accessMode: ReadWriteOnce
        size: 50Gi
        advancedMounts:
          machine-learning:
            app:
              - path: /cache
                subPath: cache
      library:
        type: custom
        volumeSpec:
          csi:
            driver: nfs.csi.k8s.io
            volumeAttributes:
              server: 10.0.10.15
              share: /mnt/eden/users
        advancedMounts:
          server:
            app:
              - path: /mnt/users/${USER_0}
                subPath: ${USER_0}/.immich
      dragonfly-client-tls:
        type: secret
        name: immich-dragonfly-client-tls
        advancedMounts:
          server:
            app:
              - path: /certs/dragonfly
                readOnly: true
      scripts:
        type: configMap
        name: scripts
        advancedMounts:
          server:
            app:
              - path: /scripts/storage-mapping.sh
                subPath: storage-mapping.sh
                readOnly: true
      upload:
        type: emptyDir
        advancedMounts:
          server:
            app:
              - path: /usr/src/app/upload
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      app:
        hostnames: ['immich.${DOMAIN_0}']
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
        rules:
          - backendRefs:
              - identifier: server
                port: *serverPort
    service:
      server:
        controller: server
        ports:
          http:
            port: *serverPort
          metrics-api:
            port: 8081
          metrics-ms:
            port: 8082
      machine-learning:
        controller: machine-learning
        ports:
          http:
            port: *machineLearningPort
