---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app romm
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      romm:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
          automountServiceAccountToken: false
        containers:
          app:
            image:
              repository: ghcr.io/rommapp/romm
              tag: 4.8.1@sha256:2b7a1714b287f69b081ad2a63bb8c2fa673666a17b2f21322b580b0cd51cb266
            envFrom:
              - secretRef:
                  name: romm-app-secret
            env:
              ROMM_BASE_PATH: /romm
              ROMM_DB_DRIVER: postgresql
              DB_HOST: romm-cnpg-rw
              DB_PORT: 5432
              DB_USER: *app
              DB_PASSWD:
                valueFrom:
                  secretKeyRef:
                    name: romm-cnpg-app
                    key: password
              REDIS_HOST: romm-dragonfly
              REDIS_PORT: 6379
              REDIS_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: romm-app-secret
                    key: DRAGONFLY_KEY
              OIDC_ENABLED: true
              OIDC_PROVIDER: pocket-id
              OIDC_REDIRECT_URI: https://romm.${DOMAIN_1}/api/oauth/openid
              OIDC_SERVER_APPLICATION_URL: https://id.${DOMAIN_0}
              DISABLE_USERPASS_LOGIN: true
              ENABLE_SCHEDULED_CONVERT_IMAGES_TO_WEBP: true
              ENABLE_SCHEDULED_RETROACHIEVEMENTS_PROGRESS_SYNC: true
              HASHEOUS_API_ENABLED: true
              LAUNCHBOX_API_ENABLED: true
            probes:
              liveness: &probe
                custom: true
                spec:
                  httpGet:
                    path: /api/heartbeat
                    port: &httpPort 8080
              readiness: *probe
            resources:
              requests: { cpu: 25m, memory: 512Mi }
              limits: { memory: 2Gi }
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }

    persistence:
      config:
        type: configMap
        name: romm-config
        globalMounts:
          - path: /romm/config/config.yml
            subPath: config.yml
            readOnly: true
      data:
        type: persistentVolumeClaim
        existingClaim: romm-data
        globalMounts:
          - path: /romm/config
            subPath: config
          - path: /romm/assets
            subPath: assets
          - path: /romm/resources
            subPath: resources
      library:
        type: nfs
        server: 10.0.10.15
        path: ${DATASET_MEDIA}/library/games
        globalMounts:
          - path: /romm/library/games
      launchbox-metadata:
        type: nfs
        server: 10.0.10.15
        path: ${DATASET_BACKUPS}/launchbox
        globalMounts:
          - path: /romm/launchbox
      launchbox-media:
        type: nfs
        server: 10.0.10.15
        path: ${DATASET_BACKUPS}/launchbox
        globalMounts:
          - path: /romm/library/Images
            subPath: Images
          - path: /romm/library/Manuals
            subPath: Manuals
          - path: /romm/library/Videos
            subPath: Videos
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      app:
        hostnames: ['romm.${DOMAIN_1}']
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
    service:
      app:
        controller: *app
        ports:
          http:
            port: *httpPort
