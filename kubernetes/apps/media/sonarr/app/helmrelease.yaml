---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      sonarr:
        initContainers:
          ca-bundle:
            image:
              repository: ghcr.io/gravelfreeman/sonarr
              tag: 4.0.20.3014-bin2.0@sha256:7f7c36333209cfa9bba46fb6aec71f40d1361a4630b69bc44fa324c42908ba51
            args: [cat /etc/ssl/certs/ca-certificates.crt /glossarr-ca/ca.crt > /ca-bundle/ca-certificates.crt]
            command: [/bin/sh, -c]
        containers:
          app:
            image:
              repository: ghcr.io/gravelfreeman/sonarr
              tag: 4.0.20.3014-bin2.0@sha256:7f7c36333209cfa9bba46fb6aec71f40d1361a4630b69bc44fa324c42908ba51
            env:
              SONARR__AUTH__METHOD: External
              SONARR__LOG__ANALYTICSENABLED: "false"
              SONARR__LOG__LEVEL: info
              SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
            probes:
              liveness: &sonarrProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    scheme: HTTP
                    path: /ping
                    port: 8989
                    httpHeaders:
                      - name: Host
                        value: 'sonarr.${DOMAIN_1}'
              readiness: *sonarrProbes
            resources:
              requests:
                cpu: 100m
                memory: 2Gi
              limits:
                memory: 8Gi
        defaultContainerOptions:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
    defaultPodOptions:
      hostAliases:
        - hostnames: [skyhook.sonarr.tv]
          ip: 172.30.89.89
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      config:
        existingClaim: sonarr-data
      media:
        type: custom
        volumeSpec:
          csi:
            driver: nfs.csi.k8s.io
            volumeAttributes:
              server: 10.0.10.10
              share: /mnt/eden/media
      requests:
        type: custom
        volumeSpec:
          csi:
            driver: nfs.csi.k8s.io
            volumeAttributes:
              server: 10.0.10.10
              share: /mnt/ungava/media
      glossarr-ca:
        type: secret
        name: glossarr-ca
        items:
          - key: tls.crt
            path: ca.crt
        advancedMounts:
          sonarr:
            ca-bundle:
              - path: /glossarr-ca
      workdir:
        type: emptyDir
        advancedMounts:
          sonarr:
            app:
              - path: /config/logs
              - path: /etc/ssl/certs
            ca-bundle:
              - path: /ca-bundle
    route:
      app:
        forceRename: sonarr
        hostnames: ['sonarr.${DOMAIN_1}']
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
      api:
        hostnames: ['sonarr.${DOMAIN_1}']
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 8989
            matches:
              - path:
                  type: PathPrefix
                  value: /api
    service:
      app:
        ports:
          http:
            port: 8989
