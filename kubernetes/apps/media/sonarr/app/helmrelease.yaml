---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      sonarr:
        initContainers:
          ca-bundle:
            image:
              repository: ghcr.io/home-operations/sonarr
              tag: 4.0.19@sha256:57ddf9972fa347a025504135bf73f5c84e4b67d33285b43f170a501145d8c43b
            args: [cat /etc/ssl/certs/ca-certificates.crt /glossarr-ca/ca.crt > /ca-bundle/ca-certificates.crt]
            command: [/bin/sh, -c]
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/sonarr
              tag: 4.0.19@sha256:57ddf9972fa347a025504135bf73f5c84e4b67d33285b43f170a501145d8c43b
            env:
              SONARR__AUTH__METHOD: External
              SONARR__LOG__LEVEL: info
              SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
            probes:
              liveness: &sonarrProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    httpHeaders:
                      - name: Host
                        value: 'sonarr.${DOMAIN_1}'
                    path: /ping
                    port: 8989
                    scheme: HTTP
              readiness: *sonarrProbes
            resources:
              requests:
                cpu: 100m
                memory: 2Gi
              limits:
                memory: 8Gi
          glossarr:
            image:
              repository: ghcr.io/matt-rgx/glossarr
              tag: v1.3.0@sha256:ebd319d8a0caa37cf1c3a1751cfc19458431ab9f70043cd1b6c27f645ea1ee18
            env:
              CERT_DIR: /certs
              LANGUAGE: fra
              SECONDARY_TRANSLATION_SOURCE: tmdb
            envFrom:
              - secretRef:
                  name: glossarr-app-secret
            probes:
              liveness: &glossarrProbes
                enabled: true
                type: HTTP
                path: /health
                port: 3000
              readiness: *glossarrProbes
        defaultContainerOptions:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
    defaultPodOptions:
      hostAliases:
        - hostnames: [skyhook.sonarr.tv]
          ip: 127.0.0.1
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      config:
        existingClaim: sonarr-data
        advancedMounts:
          sonarr:
            app:
              - path: /config
      media:
        type: custom
        volumeSpec:
          csi:
            driver: nfs.csi.k8s.io
            volumeAttributes:
              server: 10.0.10.10
              share: /mnt/eden/media
        advancedMounts:
          sonarr:
            app:
              - path: /media
      requests:
        type: custom
        volumeSpec:
          csi:
            driver: nfs.csi.k8s.io
            volumeAttributes:
              server: 10.0.10.10
              share: /mnt/ungava/media
        advancedMounts:
          sonarr:
            app:
              - path: /requests
      glossarr-ca:
        type: secret
        name: glossarr-ca
        items:
          - key: tls.crt
            path: ca.crt
        advancedMounts:
          sonarr:
            ca-bundle:
              - path: /glossarr-ca
      glossarr-tls:
        type: secret
        name: glossarr-tls
        items:
          - key: tls.crt
            path: server.crt
          - key: tls.key
            path: server.key
        advancedMounts:
          sonarr:
            glossarr:
              - path: /certs
      workdir:
        type: emptyDir
        advancedMounts:
          sonarr:
            app:
              - path: /config/logs
              - path: /etc/ssl/certs
            ca-bundle:
              - path: /ca-bundle
    route:
      app:
        forceRename: sonarr
        hostnames: ['sonarr.${DOMAIN_1}']
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
      api:
        hostnames: ['sonarr.${DOMAIN_1}']
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 8989
            matches:
              - path:
                  type: PathPrefix
                  value: /api
    service:
      app:
        ports:
          http:
            port: 8989
