---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: glossarr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      glossarr:
        containers:
          app:
            image:
              repository: ghcr.io/matt-rgx/glossarr
              tag: v1.3.0@sha256:ebd319d8a0caa37cf1c3a1751cfc19458431ab9f70043cd1b6c27f645ea1ee18
            env:
              CERT_DIR: /certs
              GLOSSARR_PORT: 443
              LANGUAGE: fra
            envFrom:
              - secretRef:
                  name: glossarr-app-secret
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
                path: /health
                port: 3000
              readiness: *probes
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
    persistence:
      certs:
        type: secret
        name: glossarr-tls
        items:
          - key: tls.crt
            path: server.crt
          - key: tls.key
            path: server.key
    service:
      app:
        clusterIP: 172.30.89.89
        ports:
          https:
            port: 443
