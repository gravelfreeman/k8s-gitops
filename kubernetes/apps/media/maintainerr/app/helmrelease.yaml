---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: maintainerr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      maintainerr:
        initContainers:
          copy-ui:
            image:
              repository: ghcr.io/maintainerr/maintainerr
              tag: 3.17.0@sha256:59d0095f05ec11aef2d271812903ed4a0738338044f44bbb3f2165c89ebcd06e
            command: ["/bin/sh", "-ec"]
            args:
              - |
                mkdir -p /ui/ui
                find /opt/app/apps/server/dist/ui -type f -not -path '*/node_modules/*' -print0 | xargs -0 sed -i "s,/__PATH_PREFIX__,,g"
                cp -R /opt/app/apps/server/dist/ui/. /ui/ui/
            securityContext:
              readOnlyRootFilesystem: false
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
        containers:
          app:
            image:
              repository: ghcr.io/maintainerr/maintainerr
              tag: 3.17.0@sha256:59d0095f05ec11aef2d271812903ed4a0738338044f44bbb3f2165c89ebcd06e
            command: ["/bin/sh", "-ec"]
            args: [exec npm run --prefix /opt/app/apps/server start]
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 512Mi
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
    persistence:
      data:
        existingClaim: maintainerr-data
        globalMounts:
          - path: /opt/data
      workdir:
        type: emptyDir
        advancedMounts:
          maintainerr:
            copy-ui:
              - path: /ui
            app:
              - path: /opt/app/apps/server/dist/ui
                subPath: ui
              - path: /opt/data/logs
                subPath: logs
    route:
      app:
        hostnames: ['maintainerr.${DOMAIN_1}']
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
    service:
      app:
        ports:
          http:
            port: 6246
