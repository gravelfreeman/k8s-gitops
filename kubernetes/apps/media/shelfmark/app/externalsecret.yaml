---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: shelfmark-irc-nick
spec:
  allowRepeat: true
  digits: 0
  length: 12
  noUpper: true
  secretKeys: [IRC_NICK]
  symbols: 0
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret shelfmark-app-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *secret
  data:
    - secretKey: HARDCOVER_API_KEY
      remoteRef:
        key: common
        property: HARDCOVER_API_KEY
    - secretKey: GOOGLEBOOKS_API_KEY
      remoteRef:
        key: common
        property: GOOGLEBOOKS_API_KEY
    - secretKey: PROWLARR_API_KEY
      remoteRef:
        key: prowlarr
        property: PROWLARR_API_KEY
    - secretKey: QBITTORRENT_API_KEY
      remoteRef:
        key: qbittorrent-3
        property: QBITTORRENT_API_KEY
    - secretKey: SABNZBD_API_KEY
      remoteRef:
        key: sabnzbd-1
        property: SABNZBD_API_KEY
  dataFrom:
    - extract:
        key: shelfmark
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: shelfmark-irc-nick
