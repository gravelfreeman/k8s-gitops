---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - externalsecret.yaml
  - helmrelease.yaml
configMapGenerator:
  - name: custom-definitions
    files:
      - newasgard.yml=./resources/newasgard.yml
  - name: qcm-newznab-scripts
    files:
      - qcm-newznab.py=./resources/qcm-newznab.py
generatorOptions:
  disableNameSuffixHash: true
