---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app prowlarr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      prowlarr:
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/prowlarr
              tag: 2.4.0.5391@sha256:91af7cbc8e357dede960033c9ecfb3a65e145d90d4e495e13adb2fbc6a546807
            env:
              PROWLARR__AUTH__METHOD: External
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
                path: /ping
              readiness: *probes
            resources:
              requests:
                cpu: 25m
                memory: 512Mi
              limits:
                memory: 512Mi
            securityContext: &securityContext
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
          qcm-newznab:
            image:
              repository: docker.io/library/python
              tag: 3.14-alpine@sha256:003970a263347645cd23d4f90929ad16ba7ce7d808ee4674ffcc93cb21cc289f
            command: ["python", "-u", "/app/qcm-newznab/qcm-newznab.py"]
            envFrom:
              - secretRef:
                  name: prowlarr-app-secret
            probes:
              liveness: &qcmProbes
                <<: *probes
                port: 9697
              readiness: *qcmProbes
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 128Mi
            securityContext: *securityContext
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          automountServiceAccountToken: false
    persistence:
      config:
        existingClaim: prowlarr-data
      custom-definitions:
        type: configMap
        name: custom-definitions
        globalMounts:
          - path: /config/Definitions/Custom
      qcm-newznab-scripts:
        type: configMap
        name: qcm-newznab-scripts
        globalMounts:
          - path: /app/qcm-newznab
    route:
      app:
        hostnames: ['prowlarr.${DOMAIN_1}']
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
    service:
      app:
        ports:
          http:
            port: 9696
