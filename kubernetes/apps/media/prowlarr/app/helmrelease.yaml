---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app prowlarr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      prowlarr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/prowlarr
              tag: 2.3.5.5327@sha256:fc87e9af2f175ef19610fdcf1fcdcc84d5099127211cc6733f826409b2733237
            env:
              PROWLARR__AUTH__METHOD: External
            probes:
              liveness: &prowlarrProbes
                enabled: true
                path: /ping
                type: HTTP
              readiness: *prowlarrProbes
            resources:
              requests:
                cpu: 25m
                memory: 512Mi
              limits:
                memory: 512Mi
            securityContext: &securityContext
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
          qcm-newznab:
            image:
              repository: docker.io/library/python
              tag: 3.12-alpine@sha256:236173eb74001afe2f60862de935b74fcbd00adfca247b2c27051a70a6a39a2d
            command: ["python", "-u", "/app/qcm-newznab/qcm-newznab.py"]
            envFrom:
              - secretRef:
                  name: prowlarr-app-secret
            probes:
              liveness: &qcmProbes
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: 9697
              readiness: *qcmProbes
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 128Mi
            securityContext: *securityContext
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          automountServiceAccountToken: false
    persistence:
      data:
        type: persistentVolumeClaim
        existingClaim: prowlarr-data
        globalMounts:
          - path: /config
      custom-definitions:
        type: configMap
        name: custom-definitions
        globalMounts:
          - path: /config/Definitions/Custom
            readOnly: true
      qcm-newznab-scripts:
        type: configMap
        name: qcm-newznab-scripts
        globalMounts:
          - path: /app/qcm-newznab
            readOnly: true
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      app:
        hostnames: ['prowlarr.${DOMAIN_1}']
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
    service:
      app:
        controller: *app
        ports:
          http:
            port: 9696
