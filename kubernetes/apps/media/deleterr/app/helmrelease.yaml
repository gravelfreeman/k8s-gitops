---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: deleterr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      deleterr:
        type: cronjob
        cronjob:
          backoffLimit: 0
          schedule: "0 2 * * *"
        containers:
          app:
            image:
              repository: docker.io/rfsbraz/deleterr
              tag: 0.3.2@sha256:7b1ab09aa7b4f304fa7f80289716aa078ecbf2cbc478d09b3ec72dfc7fd404a8
            env:
              PLEXAPI_CONFIG_PATH: /config/plexapi.ini
            envFrom:
              - secretRef:
                  name: deleterr-app-secret
            resources:
              requests:
                cpu: 250m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
    persistence:
      workdir:
        type: emptyDir
        globalMounts:
          - path: /config
          - path: /config/logs
      settings:
        type: configMap
        name: settings
        globalMounts:
          - path: /config/settings.yaml
            subPath: settings.yaml
