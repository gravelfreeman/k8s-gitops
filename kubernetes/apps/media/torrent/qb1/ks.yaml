---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app qb1
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../../components/common/system
    - ../../../../../components/envoy-oidc
    - ../../../../../components/volsync
    - ../../../../../components/vpn/alfa
  dependsOn:
    - name: envoy-gateway-config
    - name: external-secrets-store
    - name: multus-networks
    - name: openebs
    - name: rook-ceph-cluster
    - name: volsync
  interval: 1h
  path: kubernetes/apps/media/torrent/qb1/app
  postBuild:
    substitute:
      APP: *app
      ENVOY_OIDC_DOMAIN: ${DOMAIN_1}
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: torrent
  timeout: 5m
  wait: true
