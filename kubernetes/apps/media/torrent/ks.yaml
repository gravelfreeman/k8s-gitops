---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &namespace torrent
spec:
  dependsOn:
    - name: envoy-gateway-config
    - name: external-secrets-store
    - name: openebs
    - name: rook-ceph-cluster
    - name: volsync
  interval: 1h
  path: kubernetes/components/common
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: *namespace
