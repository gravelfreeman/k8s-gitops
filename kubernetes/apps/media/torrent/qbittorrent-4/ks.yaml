---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app qbittorrent-4
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../../components/common/app/shared
    - ../../../../../components/envoy-oidc
    - ../../../../../components/volsync
    - ../../../../../components/vpn
  dependsOn:
    - name: gluetun-charlie
    - name: qbit-hardlinker
    - name: torrent
  interval: 1h
  path: kubernetes/apps/media/torrent/qbittorrent-4/app
  postBuild:
    substitute:
      APP: *app
      VPN_GATEWAY_NAME: gluetun-charlie
      VPN_GATEWAY_ID: "3"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: torrent
  timeout: 5m
  wait: true
