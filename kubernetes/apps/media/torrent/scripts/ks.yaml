---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: qbit-hardlinker
spec:
  dependsOn:
    - name: torrent
  interval: 1h
  path: kubernetes/apps/media/torrent/scripts/qbit-hardlinker
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: torrent
  timeout: 5m
  wait: true
