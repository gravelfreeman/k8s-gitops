---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app qbitmanage
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      qbitmanage:
        containers:
          app:
            image:
              repository: docker.io/bobokun/qbit_manage
              tag: v4.9.1@sha256:cafdbdc61315ada302a494af9ee112a7b85eda5369edbb5b3b2d69eaccd63b2b
            env:
              QBT_CONFIG: config*.yml
              QBT_SCHEDULE: 1440
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 512Mi
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
    persistence:
      media:
        type: custom
        volumeSpec:
          csi:
            driver: nfs.csi.k8s.io
            volumeAttributes:
              server: 10.0.10.10
              share: /mnt/eden/media
        globalMounts:
          - path: /data
      overseerr:
        type: custom
        volumeSpec:
          csi:
            driver: nfs.csi.k8s.io
            volumeAttributes:
              server: 10.0.10.10
              share: /mnt/ungava/overseerr
        globalMounts:
          - path: /overseerr
      config:
        type: configMap
        name: qbitmanage-config
        globalMounts:
          - path: /config
            readOnly: true
    service:
      app:
        controller: *app
        ports:
          http:
            port: 12321
