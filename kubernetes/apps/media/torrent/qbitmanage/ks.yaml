---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app qbitmanage
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../../components/common/system
  dependsOn:
    - name: qbittorrent-1
    - name: qbittorrent-2
    - name: qbittorrent-3
    - name: qbittorrent-4
  interval: 1h
  path: kubernetes/apps/media/torrent/qbitmanage/app
  postBuild:
    substitute:
      APP: *app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: torrent
  timeout: 5m
  wait: true
