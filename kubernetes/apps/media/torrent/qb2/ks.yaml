---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app qb2
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../../components/common/system
    - ../../../../../components/vpn
    - ../../../../../components/volsync
  dependsOn:
    - name: torrent
    - name: envoy-gateway-config
    - name: external-secrets-store
    - name: gluetun-alfa
    - name: openebs
    - name: rook-ceph-cluster
    - name: volsync
  interval: 1h
  path: kubernetes/apps/media/torrent/qb2/app
  postBuild:
    substitute:
      APP: *app
      VPN_GATEWAY: gluetun-alfa
      VPN_INSTANCE: "1"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: torrent
  timeout: 5m
  wait: true
