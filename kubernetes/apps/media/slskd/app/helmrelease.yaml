---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: slskd
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      slskd:
        containers:
          app:
            image:
              repository: ghcr.io/slskd/slskd
              tag: 0.26.2@sha256:d0963a3e5b16facd295bf4f2156dad0182f246b1b21a032cae12f5494c694843
            env:
              SLSKD_APP_DIR: /data
              SLSKD_NO_AUTH: true
              SLSKD_NO_VERSION_CHECK: true
              SLSKD_SHARED_DIR: /media
            envFrom:
              - secretRef:
                  name: slskd-app-secret
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
                path: /health
                port: 5030
              readiness: *probes
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1Gi
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
    persistence:
      data:
        existingClaim: slskd-data
      media:
        type: custom
        volumeSpec:
          csi:
            driver: nfs.csi.k8s.io
            volumeAttributes:
              server: 10.0.10.10
              share: /mnt/eden/media
        globalMounts:
          - path: /app/downloads
            subPath: temp/slskd
          - path: /app/incomplete
            subPath: temp/slskd/.temp
          - path: /media
            subPath: temp/downloads/music
      runtime:
        type: emptyDir
        globalMounts:
          - path: /.net
          - path: /data/logs
            subPath: logs
    route:
      app:
        hostnames: ['slskd.${DOMAIN_1}']
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 5030
    service:
      app:
        ports:
          forward-tcp:
            port: 50300
            protocol: TCP
          http:
            port: 5030
