---
apiVersion: v1
kind: ConfigMap
metadata:
  name: plex-worker-init
data:
  install-intel-vaapi: |
    #!/usr/bin/with-contenv bash
    set -euo pipefail

    install -d -m 0700 /run/user/0

    export DEBIAN_FRONTEND=noninteractive
    apt-get update
    apt-get install -y --no-install-recommends \
      intel-media-va-driver-non-free \
      libva-drm2 \
      libva2
    rm -rf /var/lib/apt/lists/*

    cat > /usr/local/bin/plex-transcoder-vaapi <<'EOF'
    #!/usr/bin/env bash
    vaapi_libs=/usr/lib/x86_64-linux-gnu:/usr/lib/plexmediaserver/lib
    if [ -n "$LD_LIBRARY_PATH" ]; then
      export LD_LIBRARY_PATH="$vaapi_libs:$LD_LIBRARY_PATH"
    else
      export LD_LIBRARY_PATH="$vaapi_libs"
    fi
    export LIBVA_DRIVER_NAME=iHD
    export LIBVA_DRIVERS_PATH=/usr/lib/x86_64-linux-gnu/dri
    export XDG_RUNTIME_DIR=/run/user/0
    exec "/usr/lib/plexmediaserver/Plex Transcoder" "$@"
    EOF
    chmod 0755 /usr/local/bin/plex-transcoder-vaapi
