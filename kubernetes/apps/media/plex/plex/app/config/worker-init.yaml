---
apiVersion: v1
kind: ConfigMap
metadata:
  name: plex-worker-init
data:
  install-intel-vaapi: |
    #!/usr/bin/with-contenv bash
    set -euo pipefail

    install -d -m 0700 /run/user/0

    root=/opt/plex-vaapi-alpine
    cache=/run/plex-vaapi-alpine
    base=https://dl-cdn.alpinelinux.org/alpine/edge
    rm -rf "$root" "$cache"
    install -d "$root" "$cache"

    fetch_pkg() {
      repo="$1"
      pkg="$2"
      curl -fsSLo "$cache/$pkg" "$base/$repo/x86_64/$pkg"
      tar -xzf "$cache/$pkg" -C "$root"
    }

    # renovate: datasource=custom.alpine-apk depName=main/musl packageName=musl registryUrl=https://dl-cdn.alpinelinux.org/alpine/edge/main/x86_64/
    fetch_pkg main musl-1.2.6-r2.apk
    # renovate: datasource=custom.alpine-apk depName=main/libgcc packageName=libgcc registryUrl=https://dl-cdn.alpinelinux.org/alpine/edge/main/x86_64/
    fetch_pkg main libgcc-15.2.0-r9.apk
    # renovate: datasource=custom.alpine-apk depName=main/libstdc++ packageName=libstdc%2B%2B registryUrl=https://dl-cdn.alpinelinux.org/alpine/edge/main/x86_64/
    fetch_pkg main libstdc++-15.2.0-r8.apk
    # renovate: datasource=custom.alpine-apk depName=main/libdrm packageName=libdrm registryUrl=https://dl-cdn.alpinelinux.org/alpine/edge/main/x86_64/
    fetch_pkg main libdrm-2.4.134-r0.apk
    # renovate: datasource=custom.alpine-apk depName=main/libva packageName=libva registryUrl=https://dl-cdn.alpinelinux.org/alpine/edge/main/x86_64/
    fetch_pkg main libva-2.23.0-r0.apk
    # renovate: datasource=custom.alpine-apk depName=main/libpciaccess packageName=libpciaccess registryUrl=https://dl-cdn.alpinelinux.org/alpine/edge/main/x86_64/
    fetch_pkg main libpciaccess-0.19-r0.apk
    # renovate: datasource=custom.alpine-apk depName=community/intel-gmmlib packageName=intel-gmmlib registryUrl=https://dl-cdn.alpinelinux.org/alpine/edge/community/x86_64/
    fetch_pkg community intel-gmmlib-22.10.0-r0.apk
    # renovate: datasource=custom.alpine-apk depName=community/intel-media-driver packageName=intel-media-driver registryUrl=https://dl-cdn.alpinelinux.org/alpine/edge/community/x86_64/
    fetch_pkg community intel-media-driver-26.2.1-r0.apk

    cat > /usr/local/bin/plex-transcoder-vaapi <<'EOF'
    #!/usr/bin/env bash
    vaapi_libs=/opt/plex-vaapi-alpine/usr/lib:/opt/plex-vaapi-alpine/lib:/usr/lib/plexmediaserver/lib
    if [ -n "$LD_LIBRARY_PATH" ]; then
      export LD_LIBRARY_PATH="$vaapi_libs:$LD_LIBRARY_PATH"
    else
      export LD_LIBRARY_PATH="$vaapi_libs"
    fi
    export LIBVA_DRIVER_NAME=iHD
    export LIBVA_DRIVERS_PATH=/opt/plex-vaapi-alpine/usr/lib/dri
    export XDG_RUNTIME_DIR=/run/user/0
    exec "/usr/lib/plexmediaserver/Plex Transcoder" "$@"
    EOF
    chmod 0755 /usr/local/bin/plex-transcoder-vaapi
