---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app plex
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      orchestrator:
        containers:
          orchestrator:
            image:
              repository: ghcr.io/pabloromeo/clusterplex_orchestrator
              tag: 1.4.16@sha256:0fe80de2d22cf62cc180a7f19b30956eaaf35512c3b78608168e483004dde99f
            env:
              WORKER_SELECTION_STRATEGY: LOAD_TASKS
            probes:
              liveness: &orchestratorProbes
                enabled: true
                type: HTTP
                path: /health
              readiness: *orchestratorProbes
            resources:
              requests:
                cpu: 200m
                memory: 64Mi
              limits:
                memory: 128Mi
            securityContext: &containerSecurityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
        pod:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
      plex:
        containers:
          plex:
            image:
              repository: lscr.io/linuxserver/plex
              tag: 1.43.3@sha256:7f9a1d574958fc2f177c14ca190d4b811a58c274477f5bae8fb44ee676fb96bf
            env:
              PGID: "568"
              PUID: "568"
              VERSION: docker
              DOCKER_MODS: ghcr.io/gravelfreeman/clusterplex_dockermod:sha-81d8cb0@sha256:ba6b744d6ca05246dbea5d97dedee961ed0be9814e3f9f12cd7a6d076696ba56
              ORCHESTRATOR_URL: http://plex-orchestrator:3500
              ADVERTISE_IP: http://10.0.20.240:32400,https://plex.${DOMAIN_1}
              TRANSCODE_OPERATING_MODE: local
              # TRANSCODE_OPERATING_MODE: both
              PMS_SERVICE: *app
              PMS_PORT: "32400"
              LOCAL_RELAY_PORT: "32499"
            probes:
              liveness:
                enabled: false
              readiness: &plexProbes
                enabled: true
                type: HTTP
                path: /identity
                port: 32400
                spec:
                  timeoutSeconds: 5
              startup:
                <<: *plexProbes
                spec:
                  failureThreshold: 120
                  periodSeconds: 10
            resources: &resources
              requests:
                cpu: "2"
                memory: 4Gi
              limits:
                gpu.intel.com/i915: 1
                memory: 12Gi
            securityContext: *containerSecurityContext
        pod:
          nodeSelector:
            intel.feature.node.kubernetes.io/gpu: "true"
          securityContext: &plexSecurityContext
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            supplementalGroups: [44]
            seccompProfile:
              type: RuntimeDefault
      worker:
        type: daemonset
        containers:
          worker:
            image:
              repository: lscr.io/linuxserver/plex
              tag: 1.43.3@sha256:7f9a1d574958fc2f177c14ca190d4b811a58c274477f5bae8fb44ee676fb96bf
            env:
              PGID: "568"
              PUID: "568"
              VERSION: docker
              DOCKER_MODS: ghcr.io/gravelfreeman/clusterplex_worker_dockermod:sha-81d8cb0@sha256:174b5db49660ec14ab08eae04145e139006ec64adc89ca203fb9f3645abc29a5
              ORCHESTRATOR_URL: http://plex-orchestrator:3500
              STAT_CPU_INTERVAL: "2000"
              FFMPEG_HWACCEL: vaapi
              TRANSCODER_PATH: /usr/local/bin/
              TRANSCODER_NAME: plex-transcoder-vaapi
            probes:
              liveness: &workerProbes
                enabled: true
                type: HTTP
                path: /health
                port: 3501
              readiness: *workerProbes
              startup:
                <<: *workerProbes
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources: *resources
            securityContext: *containerSecurityContext
        pod:
          nodeSelector:
            intel.feature.node.kubernetes.io/gpu: "true"
          securityContext: *plexSecurityContext
    persistence:
      data:
        existingClaim: plex-data
        advancedMounts:
          plex:
            plex:
              - path: /config
      media:
        type: custom
        volumeSpec:
          csi:
            driver: nfs.csi.k8s.io
            volumeAttributes:
              server: 10.0.10.10
              share: /mnt/eden/media
        advancedMounts:
          plex:
            plex:
              - path: /media
                readOnly: true
          worker:
            worker:
              - path: /media
                readOnly: true
      requests:
        type: custom
        volumeSpec:
          csi:
            driver: nfs.csi.k8s.io
            volumeAttributes:
              server: 10.0.10.10
              share: /mnt/ungava/media
        advancedMounts:
          plex:
            plex:
              - path: /requests
                readOnly: true
          worker:
            worker:
              - path: /requests
                readOnly: true
      runtime:
        suffix: runtime
        storageClass: ceph-filesystem
        accessMode: ReadWriteMany
        size: 256Gi
        advancedMounts:
          plex:
            plex:
              - path: /config/Library/Application Support/Plex Media Server/Cache
                subPath: cache
              - path: /config/Library/Application Support/Plex Media Server/Drivers
                subPath: drivers
              # - path: /transcode
              #   subPath: transcode
          worker:
            worker:
              - path: /codecs
                subPath: codecs
              - path: /config/Library/Application Support/Plex Media Server/Cache
                subPath: cache
              - path: /config/Library/Application Support/Plex Media Server/Drivers
                subPath: drivers
              - path: /transcode
                subPath: transcode
      # TEMP TEST
      transcode-local:
        type: emptyDir
        advancedMounts:
          plex:
            plex:
              - path: /transcode
      worker-init:
        type: configMap
        name: plex-worker-init
        defaultMode: 0555
        advancedMounts:
          worker:
            worker:
              - path: /custom-cont-init.d/install-intel-vaapi
                subPath: install-intel-vaapi
      tmp:
        enabled: false
        type: emptyDir
    route:
      plex:
        hostnames: ['plex.${DOMAIN_1}']
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
        rules:
          - backendRefs:
              - identifier: *app
                port: 32400
    service:
      orchestrator:
        controller: orchestrator
        ports:
          http:
            port: 3500
      plex:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 10.0.20.240
        labels:
          io.cilium/bgp-advertise: "true"
          network.k8s-gitops.io/lb-pool: services
        controller: *app
        externalTrafficPolicy: Local
        ports:
          http:
            protocol: TCP
            port: 32400
            targetPort: 32400
          relay:
            protocol: TCP
            port: 32499
            targetPort: 32499
