---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: imagemaid
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      imagemaid:
        type: cronjob
        cronjob:
          backoffLimit: 0
          schedule: "0 4 * * *"
        containers:
          app:
            image:
              repository: docker.io/kometateam/imagemaid
              tag: v1.3.0@sha256:82d5928bbc6c3e6b0c7e3ba2aa69b930f09b7c91ed4c89ff6d073ed2a1c49077
            command: ["/tini", "-s", "--", "/bin/sh", "-ec"]
            args:
              - |
                export PLEX_TOKEN="$(cat /run/secrets/PLEX_TOKEN)"
                export DISCORD="$(cat /run/secrets/DISCORD)"
                exec python3 /imagemaid.py
            env:
              MODE: remove
              TIMEOUT: "86400"
              LOCAL_DB: "False"
              OPTIMIZE_DB: "True"
              CLEAN_BUNDLES: "True"
              PHOTO_TRANSCODER: "True"
              EMPTY_TRASH: "False"
              PLEX_PATH: /plex/Library/Application Support/Plex Media Server
              PLEX_URL: http://plex.plex.svc.cluster.local:32400
              PYTHONDONTWRITEBYTECODE: "1"
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/controller: plex
                  topologyKey: kubernetes.io/hostname
    persistence:
      plex:
        existingClaim: plex-data
      secret:
        type: secret
        name: imagemaid-app-secret
        globalMounts:
          - path: /run/secrets
      config:
        type: emptyDir
