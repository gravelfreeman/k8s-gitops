---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret imagemaid-app-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *secret
  data:
    - secretKey: PLEX_TOKEN
      remoteRef:
        key: plex
        property: PLEX_TOKEN
    - secretKey: DISCORD
      remoteRef:
        key: common
        property: DISCORD_WEBHOOK_0
