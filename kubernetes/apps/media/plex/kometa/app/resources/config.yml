# yaml-language-server: $schema=https://raw.githubusercontent.com/kometa-team/kometa/nightly/json-schema/config-schema.json
libraries:
  Séries:
    <<: &libraryBase
      operations:
        mass_critic_rating_update: imdb
      remove_overlays: false
      reapply_overlays: false
    collection_files:
      - file: /config/series.yml
    overlay_files:
      - &overlayMediaInfo
        file: /config/media_info.yml
      - &overlayAudienceRating
        file: /config/audience_rating.yml
      - &overlayFrenchFlag
        file: /config/french_flag.yml
      - &overlaySeriesStatus
        file: /config/series_status.yml
      - file: /config/leaving_soon.yml
  Films:
    <<: *libraryBase
    collection_files:
      - file: /config/movies.yml
    overlay_files:
      - *overlayMediaInfo
      - *overlayAudienceRating
      - *overlayFrenchFlag
  Films sur demande:
    <<: *libraryBase
    collection_files:
      - file: /config/movies.yml
    overlay_files:
      - *overlayMediaInfo
      - *overlayAudienceRating
      - *overlayFrenchFlag
      - file: /config/leaving_soon.yml
  Films québécois: &defaultTemplate
    <<: *libraryBase
    collection_files:
      - file: /config/movies.yml
    overlay_files:
      - *overlayMediaInfo
      - *overlayAudienceRating
  Films jeunesse: *defaultTemplate
  Séries comédie: *defaultTemplate
  Séries documentaires: *defaultTemplate
  Séries québécoises:
    <<: *libraryBase
    collection_files:
      - file: /config/series.yml
    overlay_files:
      - *overlayMediaInfo
      - *overlayAudienceRating
      - *overlayFrenchFlag
      - *overlaySeriesStatus
  Séries jeunesse: *defaultTemplate
  Spectacles musique: *defaultTemplate
  Louis de Funès: *defaultTemplate
  Comédie: *defaultTemplate
settings:
  overlay_artwork_filetype: webp_lossy
  overlay_artwork_quality: 95
plex:
  url: http://plex.plex.svc.cluster.local:32400
  token: <<plextoken>>
tmdb:
  apikey: <<tmdbapikey>>
  language: fr
radarr:
  url: http://radarr.radarr.svc.cluster.local:7878
  token: <<radarrapikey>>
sonarr:
  url: http://sonarr.sonarr.svc.cluster.local:8989
  token: <<sonarrapikey>>
