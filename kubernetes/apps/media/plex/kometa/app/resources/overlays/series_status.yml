overlays:
  airing_shows:
    plex_search:
      any:
        episode_air_date: 14
    overlay:
      <<: &statusOverlay
        name: text( )
        group: status
        horizontal_align: center
        horizontal_offset: 170
        vertical_align: top
        vertical_offset: 40
        back_color: "#FFFFFF00"
        back_height: 105
        back_radius: 30
        back_width: 1100
        font: fonts/Inter-Medium.ttf
        font_color: "#FFFFFF"
        font_size: 50
      weight: 40
      url: https://raw.githubusercontent.com/gravelfreeman/kometa-posters/main/overlays/images/status/airing.png
  returning_shows:
    plex_all: true
    filters:
      tmdb_status: returning
    overlay:
      <<: *statusOverlay
      weight: 30
      url: https://raw.githubusercontent.com/gravelfreeman/kometa-posters/main/overlays/images/status/returning.png
  canceled_shows:
    plex_all: true
    filters:
      tmdb_status: canceled
    overlay:
      <<: *statusOverlay
      weight: 20
      url: https://raw.githubusercontent.com/gravelfreeman/kometa-posters/main/overlays/images/status/canceled.png
  ended_shows:
    plex_all: true
    filters:
      tmdb_status: ended
    overlay:
      <<: *statusOverlay
      weight: 10
      url: https://raw.githubusercontent.com/gravelfreeman/kometa-posters/main/overlays/images/status/ended.png
