---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app plex-auto-languages
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../../components/common/system
  dependsOn:
    - name: clusterplex
  interval: 1h
  path: kubernetes/apps/media/plex/plex-auto-languages/app
  postBuild:
    substitute:
      APP: *app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: plex
  timeout: 5m
  wait: true
