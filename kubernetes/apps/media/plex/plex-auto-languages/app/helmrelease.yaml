---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex-auto-languages
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      plex-auto-languages:
        containers:
          app:
            image:
              repository: ghcr.io/journeydocker/plex-auto-languages
              tag: 1.5.3@sha256:976ad44607f5b1ad71f7cbc7a785d3b708c4abdb61b07f27b84d0a06f67e9ed0
            env:
              UPDATE_STRATEGY: all
              PLEX_TOKEN_FILE: /run/secrets/plex_token
              PLEX_URL: http://plex.plex.svc.cluster.local:32400
              PYTHONDONTWRITEBYTECODE: "1"
            probes:
              liveness:
                enabled: true
                type: HTTP
                path: /health
                port: 9880
              readiness:
                enabled: true
                type: HTTP
                path: /ready
                port: 9880
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          automountServiceAccountToken: false
    persistence:
      workdir:
        type: emptyDir
        globalMounts:
          - path: /config
          - path: /logs
          - path: /.local
          - path: /tmp
      secret:
        type: secret
        name: plex-auto-languages-app-secret
        globalMounts:
          - path: /run/secrets
            readOnly: true
