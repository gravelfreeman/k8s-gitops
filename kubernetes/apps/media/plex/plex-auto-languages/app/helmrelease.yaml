---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex-auto-languages
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      plex-auto-languages:
        containers:
          app:
            image:
              repository: ghcr.io/journeydocker/plex-auto-languages
              tag: 1.6.0@sha256:9b00a7877f9f85e0228a5d9aa3df5e6671f1116f1e9a8654e9d3f8ed40f2d694
            env:
              UPDATE_STRATEGY: all
              PLEX_TOKEN_FILE: /run/secrets/plex_token
              PLEX_URL: http://plex.plex.svc.cluster.local:32400
              PYTHONDONTWRITEBYTECODE: "1"
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
    persistence:
      secrets:
        type: secret
        name: plex-auto-languages-app-secret
        globalMounts:
          - path: /run/secrets
      workdir:
        type: emptyDir
        globalMounts:
          - path: /config
          - path: /logs
          - path: /.local
