---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aurral
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      aurral:
        containers:
          app:
            image:
              repository: ghcr.io/lklynet/aurral
              tag: 3.1.0@sha256:17d1f8ff2aaa3907d846c38b47eebdd44b10fbe00b2c993373a6da940ac2504f
            env:
              AURRAL_DATA_DIR: /data
              AURRAL_PUBLIC_URL: https://aurral.${DOMAIN_1}
              FILE_BROWSE_ROOTS: /media
              LIBRARY_FOLDER: /media/library/music
              OIDC_CLIENT_ID: 3cc120d9-1c07-4edc-83bb-a585fb387396
              OIDC_ENABLED: true
              OIDC_ISSUER: https://id.${DOMAIN_0}
              OIDC_REDIRECT_URI: https://aurral.${DOMAIN_1}/sso/callback
            envFrom:
              - secretRef:
                  name: aurral-app-secret
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
                path: /api/health/live
              readiness: *probes
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
    persistence:
      data:
        existingClaim: aurral-data
      media:
        type: custom
        volumeSpec:
          csi:
            driver: nfs.csi.k8s.io
            volumeAttributes:
              server: 10.0.10.10
              share: /mnt/eden/media
    route:
      app:
        hostnames: ['aurral.${DOMAIN_1}']
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
    service:
      app:
        ports:
          http:
            port: 3001
