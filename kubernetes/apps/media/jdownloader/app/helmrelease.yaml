---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jdownloader
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      jdownloader:
        containers:
          app:
            image:
              repository: ghcr.io/tuxpeople/jdownloader-headless
              tag: 3.1.0@sha256:e342de810f022b32a7df3adc83c486cca72b33d780a544b3e8ce14e0dbc55e79
            envFrom:
              - secretRef:
                  name: jdownloader-app-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/bin/sh", "-c", "pidof java >/dev/null"]
              readiness: *probes
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
    persistence:
      data:
        existingClaim: jdownloader-data
        globalMounts:
          - path: /opt/JDownloader
      downloads:
        type: custom
        volumeSpec:
          csi:
            driver: nfs.csi.k8s.io
            volumeAttributes:
              server: 10.0.10.10
              share: /mnt/eden/media/temp/jdownloader
        globalMounts:
          - path: /opt/JDownloader/Downloads
