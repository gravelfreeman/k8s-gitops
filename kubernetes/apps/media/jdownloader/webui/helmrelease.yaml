---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jdownloader-webui
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      jdownloader-webui:
        containers:
          app:
            image:
              repository: ghcr.io/bennyborn/my-own-jdownloader
              tag: 1.1.0@sha256:8cc3d644a4439be06f9a9d064f4c8127f91cac20305fab988a427c9d3c3137d6
            command: [node]
            args: [backend/dist/index.js]
            env:
              JD_SOLVER_URL: http://jdownloader-webui.jdownloader.svc.cluster.local:3000
            envFrom:
              - secretRef:
                  name: jdownloader-app-secret
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
                path: /api/health
              readiness: *probes
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
    persistence:
      data:
        existingClaim: jdownloader-data
        globalMounts:
          - path: /app/data
    route:
      app:
        hostnames: ['jdownloader.${DOMAIN_1}']
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
    service:
      app:
        ports:
          http:
            port: 3000
