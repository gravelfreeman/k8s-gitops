---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tracearr
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/common/app
    - ../../../../components/homepage
    - ../../../../components/cnpg
    - ../../../../components/dragonfly
  dependsOn:
    - name: cloudnative-pg
    - name: cloudnative-pg-catalogs
    - name: dragonfly-operator
    - name: envoy-gateway-config
    - name: external-secrets-store
  interval: 1h
  path: kubernetes/apps/media/tracearr/app
  postBuild:
    substitute:
      APP: *app
      CNPG_DATABASE_EXTENSIONS: '[{"name":"timescaledb"},{"name":"timescaledb_toolkit"}]'
      CNPG_IMAGE_CATALOG_NAME: postgresql-timescaledb
      CNPG_MAX_LOCKS_PER_TRANSACTION: '"4096"'
      CNPG_SHARED_PRELOAD_LIBRARIES: '[timescaledb]'
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: *app
  timeout: 10m
  wait: true
