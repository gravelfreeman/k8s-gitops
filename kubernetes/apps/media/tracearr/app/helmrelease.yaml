---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tracearr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      tracearr:
        containers:
          app:
            image:
              repository: ghcr.io/connorgallopo/tracearr
              tag: 2.4.0@sha256:287d9b75dd2c95075988cdab6a55d586303e0f14a80e1c105c2ed0e02e133b8e
            env:
              NODE_ENV: production
              OIDC_CLIENT_ID: 3cd6c47f-3033-4a2d-a0a0-e950ae63b311
              OIDC_ISSUER_URL: https://id.${DOMAIN_0}
              OIDC_PROVIDER_NAME: Freeman ID
              REDIS_URL_FILE: /dragonfly/REDIS_URL
              TRUST_PROXY: true
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: tracearr-cnpg-app
                    key: fqdn-uri
            envFrom:
              - secretRef:
                  name: tracearr-app-secret
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
                path: /health
              readiness: *probes
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 2Gi
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
    persistence:
      cache:
        type: emptyDir
        globalMounts:
          - path: /app/data/image-cache
    route:
      app:
        hostnames: ['tracearr.${DOMAIN_1}']
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
    service:
      app:
        ports:
          http:
            port: 3000
