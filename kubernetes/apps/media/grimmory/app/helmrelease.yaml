---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app grimmory
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      grimmory:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          mariadb-reset-sql:
            image:
              repository: docker.io/library/mariadb
              tag: 12.2.2-noble@sha256:e0236fc6386e7eacd9359e59d0a078bd7aa0d18280d36d13061121bedeaee903
            command: ["sh", "-ec"]
            args:
              - |
                test -n "$MARIADB_PASSWORD"
                test -n "$MARIADB_ROOT_PASSWORD"
                APP_PW="$(printf '%s' "$MARIADB_PASSWORD" | sed "s/'/''/g")"
                ROOT_PW="$(printf '%s' "$MARIADB_ROOT_PASSWORD" | sed "s/'/''/g")"
                cat >/tmp/reset.sql <<EOF
                CREATE USER IF NOT EXISTS 'grimmory'@'127.0.0.1' IDENTIFIED BY '$APP_PW';
                CREATE USER IF NOT EXISTS 'grimmory'@'localhost' IDENTIFIED BY '$APP_PW';
                CREATE USER IF NOT EXISTS 'grimmory'@'%' IDENTIFIED BY '$APP_PW';
                ALTER USER 'grimmory'@'127.0.0.1' IDENTIFIED BY '$APP_PW';
                ALTER USER 'grimmory'@'localhost' IDENTIFIED BY '$APP_PW';
                ALTER USER 'grimmory'@'%' IDENTIFIED BY '$APP_PW';
                GRANT ALL PRIVILEGES ON grimmory.* TO 'grimmory'@'127.0.0.1';
                GRANT ALL PRIVILEGES ON grimmory.* TO 'grimmory'@'localhost';
                GRANT ALL PRIVILEGES ON grimmory.* TO 'grimmory'@'%';
                CREATE USER IF NOT EXISTS 'root'@'localhost' IDENTIFIED BY '$ROOT_PW';
                ALTER USER 'root'@'localhost' IDENTIFIED BY '$ROOT_PW';
                GRANT ALL PRIVILEGES ON *.* TO 'root'@'localhost' WITH GRANT OPTION;
                FLUSH PRIVILEGES;
                EOF
            envFrom:
              - secretRef:
                  name: grimmory-app-secret
        containers:
          grimmory:
            image:
              repository: ghcr.io/grimmory-tools/grimmory
              tag: v3.0.3@sha256:a903a2b44c308bd1738b6f7cdb5a2e5a2a1ae23a092f30eb68581e2be1af50cd
            command: ["java"]
            args: ["-jar", "/app/app.jar"]
            env:
              DATABASE_URL: jdbc:mariadb://localhost:3306/grimmory
              DATABASE_USERNAME: *app
            envFrom:
              - secretRef:
                  name: grimmory-app-secret
            probes:
              liveness: &probe
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/healthcheck
                    port: &httpPort 6060
              readiness: *probe
            resources:
              requests: { cpu: 50m, memory: 2Gi }
              limits: { memory: 6Gi }
          mariadb:
            image:
              repository: docker.io/library/mariadb
              tag: 12.2.2-noble@sha256:e0236fc6386e7eacd9359e59d0a078bd7aa0d18280d36d13061121bedeaee903
            args: ["--init-file=/tmp/reset.sql"]
            env:
              MARIADB_DATABASE: *app
              MARIADB_USER: *app
            envFrom:
              - secretRef:
                  name: grimmory-app-secret
        defaultContainerOptions:
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      data:
        type: persistentVolumeClaim
        existingClaim: grimmory-data
        advancedMounts:
          grimmory:
            grimmory:
              - path: /app/data
                subPath: app
            mariadb:
              - path: /var/lib/mysql
                subPath: mariadb/data
      media:
        type: custom
        volumeSpec:
          csi:
            driver: nfs.csi.k8s.io
            volumeAttributes:
              server: 10.0.10.15
              share: /mnt/eden/media
        advancedMounts:
          grimmory:
            grimmory:
              - path: /books
                subPath: library/books
              - path: /bookdrop
                subPath: temp/bookdrop
      mysqld:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Mi
        advancedMounts:
          grimmory:
            mariadb:
              - path: /run/mysqld
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      app:
        forceRename: *app
        hostnames: ['grimmory.${DOMAIN_1}']
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
      kobo:
        hostnames: ['grimmory.${DOMAIN_1}']
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /api/kobo
    service:
      grimmory:
        controller: *app
        ports:
          http:
            port: *httpPort
