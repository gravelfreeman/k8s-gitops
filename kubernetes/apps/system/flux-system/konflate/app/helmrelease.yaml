apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app konflate
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    config:
      clusterPath: ./kubernetes/flux/cluster
      refreshInterval: "0"
      repo: github://gravelfreeman/k8s-gitops
      prComments: true
      publicUrl: https://konflate.${DOMAIN_0}
      statusChecks: true
    httpRoute:
      enabled: true
      hostnames: ['konflate.${DOMAIN_0}']
      parentRefs:
        - name: envoy-internal
          namespace: envoy-gateway
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 50m
      limits:
        memory: 1Gi
    secret:
      existingSecret: konflate-app-secret
