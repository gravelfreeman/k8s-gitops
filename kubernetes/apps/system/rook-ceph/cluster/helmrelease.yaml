---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app rook-ceph-cluster
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    cephClusterSpec:
      cephConfig:
        global:
          device_failure_prediction_mode: local
      cleanupPolicy:
        wipeDevicesFromOtherClusters: true
      dashboard:
        ssl: false
        prometheusEndpoint: http://prometheus-operated.kube-prometheus-stack.svc.cluster.local:9090
      mgr:
        modules:
          - name: diskprediction_local
            enabled: true
          - name: pg_autoscaler
            enabled: true
          - name: rook
            enabled: true
      network:
        provider: host
        addressRanges:
          public: ["10.0.10.0/24"]
          cluster: ["169.254.0.0/24"]
        connections:
          requireMsgr2: true
      resources:
        mgr:
          requests: { cpu: 500m, memory: 512Mi }
          limits: { memory: 2Gi }
        mon:
          requests: { cpu: 500m, memory: 2Gi }
          limits: { memory: 5Gi }
        osd:
          requests: { cpu: "1", memory: 4Gi }
          limits: { memory: 8Gi }
      storage:
        devicePathFilter: "/dev/disk/by-id/nvme-SAMSUNG_MZQL21T9HCJR-00B7C_.*"
        useAllDevices: false
        useAllNodes: true
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          allowVolumeExpansion: true
          isDefault: true
          mountOptions: ["discard"]
          parameters:
            compression_algorithm: zstd
            compression_mode: passive
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-publish-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-publish-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
            imageFeatures: deep-flatten,exclusive-lock,fast-diff,layering,object-map
            imageFormat: "2"
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-block
      deletionPolicy: Delete
      isDefault: false
    cephFileSystems: []
    cephObjectStores: []
    monitoring:
      enabled: true
      createPrometheusRules: true
      metricsDisabled: false
    route:
      dashboard:
        host:
          name: ceph.${DOMAIN_0}
          path: /
          pathType: PathPrefix
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
    toolbox:
      enabled: false
