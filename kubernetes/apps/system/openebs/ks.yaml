---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app openebs
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/common
  dependsOn:
    - name: snapshot-controller
  interval: 1h
  path: kubernetes/apps/system/openebs/app
  postBuild:
    substitute:
      POD_SECURITY_ENFORCE: privileged
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: *app
  timeout: 5m
  wait: true
