apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app openebs
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    analytics:
      enabled: false
    localpv:
      basePath: /var/mnt/local-hostpath
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: openebs-localpv-provisioner
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: openebs-localpv-provisioner
              spec:
                template:
                  spec:
                    containers:
                      - name: openebs-localpv-provisioner
                        securityContext:
                          allowPrivilegeEscalation: false
                          capabilities:
                            drop: ["ALL"]
                          runAsNonRoot: true
                          runAsUser: 65532
                          runAsGroup: 65532
