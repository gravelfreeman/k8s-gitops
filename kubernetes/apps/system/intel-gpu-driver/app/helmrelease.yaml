---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app intel-gpu-driver
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    cdi:
      dynamicPath: /run/cdi
      staticPath: /run/cdi
    kubeletPlugin:
      privileged: true
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu: "true"
      healthMonitoring:
        enabled: false
