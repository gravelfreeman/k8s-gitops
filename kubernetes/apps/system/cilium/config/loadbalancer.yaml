---
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: main
spec:
  blocks:
    - start: 10.0.20.2
      stop: 10.0.20.254
  serviceSelector:
    matchLabels:
      io.cilium/l2-announcer: "true"
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: main
spec:
  loadBalancerIPs: true
  interfaces: [^enp8(7|9)s0$]
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  serviceSelector:
    matchLabels:
      io.cilium/l2-announcer: "true"
