---
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: services
spec:
  blocks:
    - start: 10.0.20.2
      stop: 10.0.20.254
  serviceSelector:
    matchLabels:
      io.cilium/l2-announcer: "true"
      io.cilium/l2-network: services
---
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: dmz
spec:
  blocks:
    - start: 10.0.25.2
      stop: 10.0.25.254
  serviceSelector:
    matchLabels:
      io.cilium/l2-announcer: "true"
      io.cilium/l2-network: dmz
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: services
spec:
  loadBalancerIPs: true
  interfaces: [^enp87s0$]
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  serviceSelector:
    matchLabels:
      io.cilium/l2-announcer: "true"
      io.cilium/l2-network: services
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: dmz
spec:
  loadBalancerIPs: true
  interfaces: [^enp87s0\.25$]
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  serviceSelector:
    matchLabels:
      io.cilium/l2-announcer: "true"
      io.cilium/l2-network: dmz
