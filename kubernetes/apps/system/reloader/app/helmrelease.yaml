# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app reloader
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    fullnameOverride: *app
    reloader:
      readOnlyRootFileSystem: true
      podMonitor:
        enabled: true
