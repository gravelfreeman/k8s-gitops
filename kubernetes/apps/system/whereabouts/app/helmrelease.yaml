---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: whereabouts
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: whereabouts-chart
    namespace: flux-system
  values:
    image:
      repository: ghcr.io/k8snetworkplumbingwg/whereabouts
      tag: v0.9.4@sha256:f279fd7dc1124d7819330fb2e07357990b2b4c5d8733aef1b028573c29f05e14
    nodeSelector:
      kubernetes.io/os: linux
    resources:
      requests:
        cpu: 25m
        memory: 50Mi
      limits:
        memory: 64Mi
    securityContext:
      privileged: true
