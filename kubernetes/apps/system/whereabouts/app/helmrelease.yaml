---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: whereabouts
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: whereabouts-chart
    namespace: flux-system
  values:
    image:
      repository: ghcr.io/k8snetworkplumbingwg/whereabouts
      tag: v0.9.3@sha256:145241f222b8647b4eafc59944bbb80e1d068c2f7c370c739f864e4209c25a69
    nodeSelector:
      kubernetes.io/os: linux
    resources:
      requests:
        cpu: 25m
        memory: 50Mi
      limits:
        memory: 64Mi
    securityContext:
      privileged: true
