# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app k8tz
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: *app
  postRenderers:
    - kustomize:
        patches:
          - patch: |-
              - op: add
                path: /webhooks/0/objectSelector
                value:
                  matchExpressions:
                    - key: app
                      operator: NotIn
                      values:
                        - volume-exposer
            target:
              group: admissionregistration.k8s.io
              kind: MutatingWebhookConfiguration
              name: *app
              version: v1
  values:
    namespace: null
    replicaCount: 2
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: *app
    timezone: America/Montreal
    cronJobTimeZone: true
    webhook:
      certManager:
        enabled: true
        issuerRef:
          name: k8tz-webhook-issuer
          kind: Issuer
      ignoredNamespaces:
        - descheduler
        - dragonfly
        - envoy-gateway
        - external-dns
        - external-secrets
        - kube-system
        - openebs
        - reloader
        - rook-ceph
        - snapshot-controller
        - system-upgrade
