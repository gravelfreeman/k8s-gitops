apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: iot
spec:
  config: |-
    {
      "cniVersion": "1.1.0",
      "name": "iot",
      "plugins": [
        {
          "type": "macvlan",
          "master": "enp89s0.30",
          "mode": "bridge",
          "ipam": {
            "type": "static",
            "routes": [
              {"dst": "10.0.5.0/24", "gw": "10.0.30.1"},
              {"dst": "10.0.40.0/24", "gw": "10.0.30.1"},
              {"dst": "10.0.50.0/24", "gw": "10.0.30.1"}
            ]
          }
        }
      ]
    }
