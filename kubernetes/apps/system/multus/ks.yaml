---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app multus
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/common/system
  dependsOn:
    - name: cilium
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: multus
      namespace: kube-system
  interval: 1h
  path: kubernetes/apps/system/multus/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: kube-system
  timeout: 5m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: multus-networks
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: multus
  components:
    - ../../../../components/common
  dependsOn:
    - name: multus
    - name: node-network-operator-config
    - name: whereabouts
  interval: 1h
  path: kubernetes/apps/system/multus/networks
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: multus
  timeout: 5m
  wait: true
