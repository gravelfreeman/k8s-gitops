---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: toolhive-mcp
  labels:
    envoy-gateway-access: external
spec:
  hostnames:
    - mcp.${DOMAIN_0}
  parentRefs:
    - name: envoy-external
      namespace: envoy-gateway
      sectionName: https
  rules:
    - backendRefs:
        - name: vmcp-toolhive-mcp
          port: 4483
