---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret toolhive-auth-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *secret
  data:
    - secretKey: signing-key
      remoteRef:
        key: toolhive-signing-key
        property: signing-key.pem
  dataFrom:
    - extract:
        key: toolhive
