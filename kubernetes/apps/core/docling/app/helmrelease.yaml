---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: docling
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      docling:
        containers:
          app:
            image:
              repository: ghcr.io/docling-project/docling-serve-cpu
              tag: v1.37.0@sha256:6eda9c524992147c1b0b06a1a9be4894bd68b1f43c86d92c32f996c4c60d18a3
            env:
              DOCLING_SERVE_DEFAULT_PICTURE_DESCRIPTION_PRESET: docling
              DOCLING_SERVE_ENABLE_REMOTE_SERVICES: true
              DOCLING_SERVE_MAX_SYNC_WAIT: 600
              EASYOCR_MODULE_PATH: /opt/app-root/src/.cache/easyocr
            envFrom:
              - secretRef:
                  name: docling-app-secret
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
                path: /health
              readiness: *probes
            resources:
              requests:
                cpu: 1
                memory: 4Gi
              limits:
                cpu: 4
                memory: 12Gi
            securityContext:
              readOnlyRootFilesystem: false
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
    persistence:
      cache:
        accessMode: ReadWriteOnce
        size: 20Gi
        storageClass: ceph-block
        globalMounts:
          - path: /opt/app-root/src/.cache
    service:
      app:
        ports:
          http:
            port: 5001
