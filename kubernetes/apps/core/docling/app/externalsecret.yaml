---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret docling-app-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *secret
    template:
      data:
        DOCLING_SERVE_CUSTOM_PICTURE_DESCRIPTION_PRESETS: >-
          {{ dict "docling" (dict
            "model_spec" (dict
              "name" "chatgpt/gpt-6-luna"
              "default_repo_id" "chatgpt/gpt-6-luna"
              "prompt" "Describe visible content in detail for a course knowledge base. Include text, labels, axes, values, and relationships. For a flowchart, process, or system diagram, also provide a faithful Mermaid diagram in a fenced mermaid code block; if Mermaid cannot represent the structure, provide concise Markdown or pseudocode. Distinguish visible facts from uncertainty."
              "response_format" "plaintext")
            "engine_options" (dict
              "engine_type" "api"
              "url" "http://litellm.litellm.svc.cluster.local:4000/v1/chat/completions"
              "headers" (dict "Authorization" (printf "Bearer %s" .DOCLING_VIRTUAL_KEY))
              "params" (dict "model" "chatgpt/gpt-6-luna")
              "timeout" 300)) | toJson }}
        DOCLING_SERVE_CUSTOM_CODE_FORMULA_PRESETS: >-
          {{ dict "docling" (dict
            "model_spec" (dict
              "name" "Luna Code and Formula Extraction"
              "default_repo_id" "chatgpt/gpt-6-luna"
              "prompt" "Extract all visible mathematical formulas as valid LaTeX source, preserving symbols, subscripts, superscripts, and operators. Extract visible code as source code and identify its language. Do not explain or paraphrase the formula or code."
              "response_format" "plaintext")
            "engine_options" (dict
              "engine_type" "api"
              "url" "http://litellm.litellm.svc.cluster.local:4000/v1/chat/completions"
              "headers" (dict "Authorization" (printf "Bearer %s" .DOCLING_VIRTUAL_KEY))
              "params" (dict "model" "chatgpt/gpt-6-luna")
              "timeout" 300)
            "extract_code" true
            "extract_formulas" true) | toJson }}
        DOCLING_SERVE_CUSTOM_CHART_EXTRACTION_PRESETS: >-
          {{ dict "docling" (dict
            "model_spec" (dict
              "name" "Luna Chart Extraction"
              "default_repo_id" "chatgpt/gpt-6-luna"
              "prompt" "Extract chart data faithfully. Keep units, labels, series, and categories. Never infer values that are not visible."
              "response_format" "plaintext")
            "engine_options" (dict
              "engine_type" "api"
              "url" "http://litellm.litellm.svc.cluster.local:4000/v1/chat/completions"
              "headers" (dict "Authorization" (printf "Bearer %s" .DOCLING_VIRTUAL_KEY))
              "params" (dict "model" "chatgpt/gpt-6-luna")
              "timeout" 300)
            "chart2csv" true
            "chart2summary" true
            "use_natural_language_prompts" true) | toJson }}
      engineVersion: v2
      mergePolicy: Replace
  data:
    - secretKey: DOCLING_VIRTUAL_KEY
      remoteRef:
        key: litellm
        property: DOCLING_VIRTUAL_KEY
