---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  image: ghcr.io/berriai/litellm:v1.104.0@sha256:625981c83410a3ea68eb0697590a57ec1d764d634514d54fa5db0591077ee839
  env:
    - name: AUTO_REDIRECT_UI_LOGIN_TO_SSO
      value: "true"
    - name: GENERIC_AUTHORIZATION_ENDPOINT
      value: https://id.${DOMAIN_0}/authorize
    - name: GENERIC_CLIENT_ID
      value: 98e4e090-b109-4dbf-bd3f-8687cfd767cb
    - name: GENERIC_CLIENT_USE_PKCE
      value: "true"
    - name: GENERIC_TOKEN_ENDPOINT
      value: https://id.${DOMAIN_0}/api/oidc/token
    - name: GENERIC_USERINFO_ENDPOINT
      value: https://id.${DOMAIN_0}/api/oidc/userinfo
    - name: JWT_AUDIENCE
      value: https://litellm.${DOMAIN_0}
    - name: JWT_ISSUER
      value: https://id.${DOMAIN_0}
    - name: JWT_PUBLIC_KEY_URL
      value: https://id.${DOMAIN_0}/.well-known/jwks.json
    - name: LITELLM_LOG
      value: INFO
    - name: LITELLM_MODE
      value: PRODUCTION
    - name: PROXY_BASE_URL
      value: https://litellm.${DOMAIN_0}
    - name: REDIS_HOST
      value: litellm-dragonfly.litellm.svc.cluster.local
    - name: REDIS_PORT
      value: "6379"
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: litellm-cnpg-app
          key: fqdn-uri
    - name: REDIS_PASSWORD
      valueFrom:
        secretKeyRef:
          name: litellm-dragonfly-secret
          key: password
  envFrom:
    - secretRef:
        name: litellm-app-secret
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
  livenessProbe:
    httpGet:
      path: /health/liveliness
      port: 4000
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
  route:
    hostnames: ['litellm.${DOMAIN_0}']
    parentRefs:
      - name: envoy-internal
        namespace: envoy-gateway
        sectionName: https
  volumeMounts:
    - name: chatgpt-tokens
      mountPath: /home/nonroot/.config/litellm/chatgpt
  volumes:
    - name: chatgpt-tokens
      persistentVolumeClaim:
        claimName: litellm-data
  generalSettings:
    database_url: os.environ/DATABASE_URL
    disable_env_credential_login: true
    disable_password_login_when_sso_enabled: true
    enable_jwt_auth: true
    litellm_jwtauth:
      enforce_team_based_model_access: true
      team_ids_jwt_field: groups
      user_id_jwt_field: preferred_username
      user_id_upsert: true
    master_key: os.environ/LITELLM_MASTER_KEY
    require_key_mcp_access_defined: true
  litellmSettings:
    cache: true
    cache_params:
      type: redis
      host: os.environ/REDIS_HOST
      port: os.environ/REDIS_PORT
      password: os.environ/REDIS_PASSWORD
    mcp_semantic_tool_filter:
      enabled: true
      embedding_model: text-embedding-3-small
      similarity_threshold: 0.3
      top_k: 10
  routerSettings:
    redis_host: os.environ/REDIS_HOST
    redis_password: os.environ/REDIS_PASSWORD
    redis_port: os.environ/REDIS_PORT
  apiAccess:
    masterKeyRef:
      name: litellm-app-secret
      key: LITELLM_MASTER_KEY
