---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: grafana
spec:
  workload:
    image: grafana/mcp-grafana:2.0.2@sha256:78d208116ec52b09b44f0eca66892073b39aefcb64483c54d43255c8eab7e97a
    args: [-t, streamable-http, --allowed-hosts, grafana.litellm.svc.cluster.local:8000]
    port: 8000
    env:
      - name: GRAFANA_URL
        value: http://grafana.kube-prometheus-stack.svc.cluster.local
    envFrom:
      - secretRef:
          name: grafana-mcp-secret
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 512Mi
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-mcp-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: grafana-mcp-secret
  dataFrom:
    - extract:
        key: grafana-mcp
