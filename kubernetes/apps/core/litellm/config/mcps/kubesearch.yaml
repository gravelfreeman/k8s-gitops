---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: kubesearch
spec:
  workload:
    image: ghcr.io/perfectra1n/kubesearch-mcp:latest@sha256:4620f09fffb30672b429b9bbffb8a657d34dcee420729598c3f65732a3c89079
    port: 3000
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 512Mi
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
