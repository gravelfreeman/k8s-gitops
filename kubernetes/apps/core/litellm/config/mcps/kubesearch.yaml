---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: kubesearch
spec:
  workload:
    image: ghcr.io/perfectra1n/kubesearch-mcp:latest@sha256:e5613e0824cf4446fb64e9e3210513c173e7201d36161272b71455341302fc3d
    port: 3000
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 512Mi
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
