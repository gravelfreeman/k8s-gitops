---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: soju
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      soju:
        containers:
          app:
            image:
              repository: codeberg.org/emersion/soju
              tag: v0.11.1@sha256:d96e0e796eab43fdea143e2ccfdd586bb5b04e3bb6a6dc544b01c35ebeaef74a
            args: ["-config", "/etc/soju/config"]
            env:
              PGUSER: soju
              PGPASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: soju-cnpg-app
                    key: password
            # v0.11.0+
            # probes:
            #   liveness: &probes
            #     enabled: true
            #     type: HTTP
            #     path: /metrics
            #     port: 8080
            #   readiness: *probes
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 256Mi
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
    persistence:
      config:
        type: configMap
        name: soju-config
        globalMounts:
          - path: /etc/soju/config
            subPath: config
    route:
      irc:
        kind: TLSRoute
        hostnames:
          - irc.${DOMAIN_0}
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: tcp
    service:
      app:
        ports:
          tcp:
            port: 6697
