---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app onepassword
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    connect:
      api:
        httpPort: 80
        serviceMonitor:
          enabled: true
      credentialsName: onepassword-credentials
