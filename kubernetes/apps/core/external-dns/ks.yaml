---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app external-dns
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/common
  dependsOn:
    - name: external-secrets-store
  interval: 1h
  path: kubernetes/apps/core/external-dns/unifi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: *app
  timeout: 5m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app external-dns-cloudflare
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-dns
    - name: external-secrets-store
  interval: 1h
  path: kubernetes/apps/core/external-dns/cloudflare
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: external-dns
  timeout: 5m
  wait: true
