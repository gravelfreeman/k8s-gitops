---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app external-dns-unifi
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: external-dns
    namespace: flux-system
  values:
    domainFilters:
      - ${DOMAIN_0}
      - ${DOMAIN_1}
      - ${DOMAIN_2}
    extraArgs:
      - --gateway-name=envoy-internal
    fullnameOverride: *app
    policy: sync
    provider:
      name: webhook
      webhook:
        env:
          - name: UNIFI_HOST
            value: https://10.0.20.1
          - name: UNIFI_API_KEY
            valueFrom:
              secretKeyRef:
                name: external-dns-unifi-secret
                key: UNIFI_API_KEY
        image:
          repository: ghcr.io/home-operations/external-dns-unifi-webhook
          tag: 0.10.13@sha256:211a3c951fc94386b14190a99239caa9c8e4b036b35259180979c5df4bd90cdd
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
    serviceMonitor:
      enabled: true
    sources:
      - gateway-httproute
      - gateway-tlsroute
      - service
    txtOwnerId: default
    txtPrefix: k8s.
