apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flux-system
labels:
  - fields:
      - path: metadata/labels
        create: true
      - group: kustomize.toolkit.fluxcd.io
        version: v1
        kind: Kustomization
        path: spec/postBuild/substitute
        create: true
    pairs:
      domain: core
resources:
  - cloudflared/ks.yaml
  - cloudnative-pg/ks.yaml
  - dragonfly/ks.yaml
  - envoy-gateway/ks.yaml
  - external-dns/ks.yaml
  - external-secrets/ks.yaml
  - gluetun/ks.yaml
  - gluetun/instances/alfa.yaml
  - gluetun/instances/bravo.yaml
  - gluetun/instances/charlie.yaml
  - gluetun/instances/delta.yaml
  - gluetun/instances/echo.yaml
  - onepassword-connect/ks.yaml
  - pocket-id/ks.yaml
  - volsync/ks.yaml
