apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - certificate.yaml
  - envoyproxy.yaml
  - extensionpolicy.yaml
  - gateway-external.yaml
  - gateway-internal.yaml
  - gatewayclass.yaml
  - https-redirect.yaml
  - trafficpolicy.yaml
configMapGenerator:
  - name: envoy-external-extensions
    files:
      - lua=resources/block-user-agents.lua
generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  disableNameSuffixHash: true
