---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app dragonfly-operator
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/common
  dependsOn:
    - name: cert-manager
  interval: 1h
  path: kubernetes/apps/core/dragonfly/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: dragonfly
  timeout: 5m
  wait: true
