---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &namespace gluetun
spec:
  dependsOn:
    - name: envoy-gateway-config
    - name: external-secrets-store
    - name: multus
    - name: whereabouts
  interval: 1h
  path: kubernetes/components/common
  postBuild:
    substitute:
      POD_SECURITY_ENFORCE: privileged
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: *namespace
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app gluetun-router
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/common/app/shared
  dependsOn:
    - name: gluetun
    - name: flux-shared
    - name: external-secrets-store
  interval: 1h
  path: kubernetes/apps/core/gluetun/router
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: gluetun
  timeout: 5m
  wait: true
