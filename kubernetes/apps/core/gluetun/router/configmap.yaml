---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gluetun-router
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
data:
  router.sh: |
    #!/bin/sh
    set -eu

    GLUETUN_NAMESPACE="${GLUETUN_NAMESPACE:-gluetun}"
    HANDLER_STATE_DIR="${HANDLER_STATE_DIR:-/tmp/gluetun-router}"
    RECONCILE_INTERVAL="${RECONCILE_INTERVAL:-15}"

    log() {
      printf '%s [gluetun-router] %s\n' "$(date -Iseconds)" "$*"
    }

    kube_api() {
      token="$(cat "/var/run/secrets/kubernetes.io/serviceaccount/token")"

      curl -fs --max-time 10 \
        --cacert "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt" \
        -H "Authorization: Bearer ${token}" \
        "https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS:-443}${1}"
    }

    agent_key() {
      secret="${1}-agent"
      json="$(kube_api "/api/v1/namespaces/${GLUETUN_NAMESPACE}/secrets/${secret}" 2>/dev/null || printf '{}')"

      printf '%s' "${json}" | jq -r '.data.AGENT_TOKEN // empty | @base64d'
    }

    gateways() {
      kube_api "/api/v1/namespaces/${GLUETUN_NAMESPACE}/pods" | jq -r '
        .items[]
        | select(.status.phase == "Running")
        | .metadata.labels["network.k8s-gitops.io/vpn-gateway"] as $gateway
        | select($gateway != null and $gateway != "")
        | $gateway
      '
    }

    desired_targets() {
      gateway="${1}"
      pods_file="${HANDLER_STATE_DIR}/pods.json"
      services_file="${HANDLER_STATE_DIR}/services.json"

      kube_api /api/v1/pods > "${pods_file}"
      kube_api /api/v1/services > "${services_file}"

      jq -r \
        --arg gateway "${gateway}" \
        --slurpfile services "${services_file}" '
          ($services[0]) as $services |
          def ready:
            .status.phase == "Running"
            and any(.status.conditions[]?; .type == "Ready" and .status == "True");

          def opted_in($gateway):
            .metadata.labels["vpn.k8s-gitops.io/port-forward-gateway"] == $gateway;

          def client_ip($gateway):
            (.metadata.annotations["k8s.v1.cni.cncf.io/network-status"] // "[]")
            | fromjson? // []
            | .[]
            | select(
                .name == ("gluetun/" + $gateway + "-client")
                or .name == ("multus/" + $gateway + "-client")
                or .name == ($gateway + "-client")
              )
            | .ips[0] // .ip // empty;

          def handler:
            ([.spec.containers[]? | select(.name == "app") | .image][0] // .spec.containers[0].image)
            | split("@")[0]
            | split(":")[0]
            | split("/")[-1];

          def selects($pod):
            (.spec.selector // {}) as $selector
            | ($selector | length) > 0
            and all($selector | to_entries[]; $pod.metadata.labels[.key] == .value);

          def forward_service($pod):
            [
              $services.items[]
              | select(.metadata.namespace == $pod.metadata.namespace)
              | select(selects($pod))
              | select(any(.spec.ports[]?; .name == "forward-tcp" or .name == "forward-udp"))
            ][0];

          [
            .items[]
            | select(ready and opted_in($gateway))
            | . as $pod
            | client_ip($gateway) as $ip
            | select($ip != null and $ip != "")
            | forward_service($pod) as $service
            | select($service != null)
            | {
                namespace: .metadata.namespace,
                service: $service.metadata.name,
                ip: $ip,
                handler: handler,
                http: ([$service.spec.ports[]? | select(.name == "http") | .port][0] // "-"),
                tcp: ([$service.spec.ports[]? | select(.name == "forward-tcp") | .port][0] // "-"),
                udp: ([$service.spec.ports[]? | select(.name == "forward-udp") | .port][0] // "-")
              }
          ]
          | sort_by(.namespace, .service)
          | .[]
          | ["target", .handler, .namespace, .service, .ip, (.http | tostring), (.tcp | tostring), (.udp | tostring)]
          | @tsv
        ' "${pods_file}"
    }

    agent_service() {
      gateway="${1}"

      kube_api "/api/v1/namespaces/${GLUETUN_NAMESPACE}/services" | jq -r --arg gateway "${gateway}" --argjson port 9000 '
        [
          .items[]
          | select((.spec.selector // {})["app.kubernetes.io/instance"] == $gateway)
          | select(any(.spec.ports[]?; .name == "agent" and .port == $port))
          | .metadata.name
        ][0] // empty
      '
    }

    send_targets() {
      gateway="${1}"
      key="${2}"
      targets="${3}"
      service="$(agent_service "${gateway}")"

      if [ -z "${service}" ]; then
        log "${gateway}: missing agent service"
        return 1
      fi

      host="${service}.${GLUETUN_NAMESPACE}.svc.cluster.local"

      AGENT_REPLY="$({
        printf 'token %s\n' "${key}"
        printf '%s\n' "${targets}"
        printf 'end\n'
      } | nc -w 10 "${host}" 9000)"

      status="$(printf '%s\n' "${AGENT_REPLY}" | awk '$1 != "result" { line=$0 } END { print line }')"
      case "${status}" in
        "ok unchanged") ;;
        "") log "${gateway}: no response" ;;
        *) log "${gateway}: ${status}" ;;
      esac
    }

    run_handlers() {
      gateway="${1}"
      state_file="${HANDLER_STATE_DIR}/${gateway}.handlers"
      new_state="$(printf '%s\n' "${AGENT_REPLY}" | awk '$1 == "result" { print }')"

      [ -n "${new_state}" ] || return 0
      if [ -f "${state_file}" ] && [ "$(cat "${state_file}")" = "${new_state}" ]; then
        return 0
      fi

      failed=0
      while read -r keyword slot external_port handler namespace service target_ip http_port tcp_port udp_port; do
        [ "${keyword}" = "result" ] || continue

        target_url=""
        if [ "${http_port}" != "-" ]; then
          target_url="http://${service}.${namespace}.svc.cluster.local:${http_port}"
        fi

        log "${gateway}: handler ${handler} slot ${slot}"
        SLOT="${slot}" \
        HANDLER="${handler}" \
        EXTERNAL_PORT="${external_port}" \
        TARGET_HTTP_PORT="${http_port}" \
        TARGET_IP="${target_ip}" \
        TARGET_NAMESPACE="${namespace}" \
        TARGET_SERVICE="${service}" \
        TARGET_TCP_PORT="${tcp_port}" \
        TARGET_UDP_PORT="${udp_port}" \
        TARGET_URL="${target_url}" \
        VPN_GATEWAY="${gateway}" \
          /bin/sh "/router/${handler}.sh" || failed=1
      done <<EOF_RESULTS
    ${new_state}
    EOF_RESULTS

      if [ "${failed}" -eq 0 ]; then
        printf '%s' "${new_state}" > "${state_file}"
        return 0
      fi

      return 1
    }

    reconcile_gateway() {
      gateway="${1}"
      key="$(agent_key "${gateway}")"

      if [ -z "${key}" ]; then
        log "${gateway}: missing agent key"
        return 0
      fi

      targets="$(desired_targets "${gateway}")" || return 1
      send_targets "${gateway}" "${key}" "${targets}"
      run_handlers "${gateway}"
    }

    mkdir -p "${HANDLER_STATE_DIR}"
    log "starting"
    log "monitoring interval=${RECONCILE_INTERVAL}s"

    while true; do
      gateways | while read -r gateway; do
        reconcile_gateway "${gateway}" || log "${gateway}: reconcile failed"
      done

      sleep "${RECONCILE_INTERVAL}"
    done
