---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - config/agent.yaml
  - config/router.yaml
  - config/token-generator.yaml
  - crds/clients.yaml
  - crds/gateways.yaml
  - helmrelease.yaml
  - rbac.yaml
configMapGenerator:
  - name: gluetun-router
    behavior: merge
    files:
      - handlers/qbittorrent.sh
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
