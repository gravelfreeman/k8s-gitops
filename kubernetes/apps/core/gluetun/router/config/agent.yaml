---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gluetun-agent
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
data:
  agent.sh: |
    set -eu
    log() {
      printf '%s [gluetun-agent] %s\n' "$(date -Iseconds)" "$*"
    }

    log "${GLUETUN_GATEWAY_NAME}: starting on :9000"

    exec socat \
      TCP-LISTEN:9000,reuseaddr,fork \
      EXEC:"/bin/sh /agent/apply.sh"

  apply.sh: |
    set -eu

    CLIENT_INTERFACE="${CLIENT_INTERFACE:-vpn}"
    BASE_STATE_FILE="${BASE_STATE_FILE:-/tmp/gluetun/agent.base-state}"
    PORTS_FILE="${PORTS_FILE:-/tmp/gluetun/agent.ports}"
    STATE_FILE="${STATE_FILE:-/tmp/gluetun/agent.state}"
    TARGETS_FILE="${TARGETS_FILE:-/tmp/gluetun/agent.targets}"
    VPN_INTERFACE="${VPN_INTERFACE:-tun0}"
    log() {
      printf '%s [gluetun-agent] %s\n' "$(date -Iseconds)" "$*" >&2
    }

    read -r keyword provided_key
    if [ "${keyword}" != "token" ] || [ "${provided_key}" != "${AGENT_TOKEN}" ]; then
      log "${GLUETUN_GATEWAY_NAME}: forbidden request"
      printf 'forbidden\n'
      exit 1
    fi

    : > "${TARGETS_FILE}"
    while read -r keyword handler namespace service target_ip http_port tcp_port udp_port; do
      case "${keyword}" in
        target)
          printf '%s %s %s %s %s %s %s\n' \
            "${handler}" \
            "${namespace}" \
            "${service}" \
            "${target_ip}" \
            "${http_port}" \
            "${tcp_port}" \
            "${udp_port}" \
            >> "${TARGETS_FILE}"
          ;;
        end)
          break
          ;;
      esac
    done
    client_cidr() {
      ip -o -4 route show dev "${CLIENT_INTERFACE}" scope link | awk '{ print $1; exit }'
    }
    forwarded_ports() {
      json="$(curl -fs --max-time 10 \
        -H "X-API-Key: ${GLUETUN_API_KEY}" \
        "http://127.0.0.1:8000/v1/portforward")"

      printf '%s' "${json}" | jq -r '
        (.ports // (if (.port // 0) > 0 then [.port] else [] end))
        | map(select(. > 0) | tostring)
        | join(" ")
      '
    }

    port_forwarding_requested() {
      case "${GLUETUN_PORT_FORWARDS:-0}" in
        ""|*[!0-9]*|0) return 1 ;;
        *) return 0 ;;
      esac
    }
    write_ports_file() {
      : > "${PORTS_FILE}"
      for port in ${ports}; do
        printf '%s\n' "${port}" >> "${PORTS_FILE}"
      done
    }
    port_count() {
      set -- ${ports}
      printf '%s' "$#"
    }
    ensure_filter_rule() {
      iptables -C "$@" 2>/dev/null || iptables -A "$@"
    }
    ensure_nat_rule() {
      iptables -t nat -C "$@" 2>/dev/null || iptables -t nat -A "$@"
    }
    ensure_base_networking() {
      client_network="$(client_cidr)"
      if [ -z "${client_network}" ]; then
        log "${GLUETUN_GATEWAY_NAME}: missing client network on ${CLIENT_INTERFACE}"
        return 1
      fi

      desired_base_state="${CLIENT_INTERFACE} ${VPN_INTERFACE} ${client_network}"
      iptables -P FORWARD DROP

      iptables -N "K8S_GTN_BASE_FWD" 2>/dev/null || true
      iptables -t nat -N "K8S_GTN_BASE_NAT" 2>/dev/null || true

      iptables -C FORWARD -j "K8S_GTN_BASE_FWD" 2>/dev/null \
        || iptables -I FORWARD 1 -j "K8S_GTN_BASE_FWD"
      iptables -t nat -C POSTROUTING -j "K8S_GTN_BASE_NAT" 2>/dev/null \
        || iptables -t nat -I POSTROUTING 1 -j "K8S_GTN_BASE_NAT"

      base_state_changed=0
      if [ ! -f "${BASE_STATE_FILE}" ] || [ "$(cat "${BASE_STATE_FILE}")" != "${desired_base_state}" ]; then
        iptables -F "K8S_GTN_BASE_FWD"
        iptables -t nat -F "K8S_GTN_BASE_NAT"
        base_state_changed=1
      fi

      ensure_filter_rule "K8S_GTN_BASE_FWD" -i "${CLIENT_INTERFACE}" -o "${VPN_INTERFACE}" -j ACCEPT
      ensure_filter_rule "K8S_GTN_BASE_FWD" -i "${VPN_INTERFACE}" -o "${CLIENT_INTERFACE}" \
        -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
      ensure_nat_rule "K8S_GTN_BASE_NAT" -s "${client_network}" -o "${VPN_INTERFACE}" -j MASQUERADE

      if [ "${base_state_changed}" -eq 1 ]; then
        printf '%s' "${desired_base_state}" > "${BASE_STATE_FILE}.tmp"
        mv "${BASE_STATE_FILE}.tmp" "${BASE_STATE_FILE}"
      fi
    }
    flush_forwarding() {
      iptables -t nat -N "K8S_GTN_PF_NAT" 2>/dev/null || true
      iptables -N "K8S_GTN_PF_FWD" 2>/dev/null || true

      iptables -t nat -C PREROUTING -i "${VPN_INTERFACE}" -j "K8S_GTN_PF_NAT" 2>/dev/null \
        || iptables -t nat -I PREROUTING 1 -i "${VPN_INTERFACE}" -j "K8S_GTN_PF_NAT"
      iptables -C FORWARD -i "${VPN_INTERFACE}" -o "${CLIENT_INTERFACE}" -j "K8S_GTN_PF_FWD" 2>/dev/null \
        || iptables -I FORWARD 1 -i "${VPN_INTERFACE}" -o "${CLIENT_INTERFACE}" -j "K8S_GTN_PF_FWD"

      iptables -t nat -F "K8S_GTN_PF_NAT"
      iptables -F "K8S_GTN_PF_FWD"
    }
    forwarded_target_port() {
      external_port="${1}"
      target_port="${2}"

      if [ "${target_port}" = "external" ]; then
        printf '%s' "${external_port}"
      else
        printf '%s' "${target_port}"
      fi
    }
    apply_targets() {
      slot=0
      while read -r handler namespace service target_ip http_port tcp_port udp_port; do
        slot=$((slot + 1))
        external_port="$(sed -n "${slot}p" "${PORTS_FILE}")"
        [ -n "${external_port}" ] || break

        if [ "${tcp_port}" != "-" ]; then
          target_tcp_port="$(forwarded_target_port "${external_port}" "${tcp_port}")"
          iptables -t nat -A "K8S_GTN_PF_NAT" -p tcp --dport "${external_port}" \
            -j DNAT --to-destination "${target_ip}:${target_tcp_port}"
          iptables -A "K8S_GTN_PF_FWD" -p tcp -d "${target_ip}" --dport "${target_tcp_port}" -j ACCEPT
        fi

        if [ "${udp_port}" != "-" ]; then
          target_udp_port="$(forwarded_target_port "${external_port}" "${udp_port}")"
          iptables -t nat -A "K8S_GTN_PF_NAT" -p udp --dport "${external_port}" \
            -j DNAT --to-destination "${target_ip}:${target_udp_port}"
          iptables -A "K8S_GTN_PF_FWD" -p udp -d "${target_ip}" --dport "${target_udp_port}" -j ACCEPT
        fi
      done < "${TARGETS_FILE}"
    }
    forwarding_rules_present() {
      iptables -t nat -S "K8S_GTN_PF_NAT" >/dev/null 2>&1 || return 1
      iptables -S "K8S_GTN_PF_FWD" >/dev/null 2>&1 || return 1
      iptables -t nat -C PREROUTING -i "${VPN_INTERFACE}" -j "K8S_GTN_PF_NAT" 2>/dev/null || return 1
      iptables -C FORWARD -i "${VPN_INTERFACE}" -o "${CLIENT_INTERFACE}" -j "K8S_GTN_PF_FWD" 2>/dev/null || return 1

      slot=0
      while read -r handler namespace service target_ip http_port tcp_port udp_port; do
        slot=$((slot + 1))
        external_port="$(sed -n "${slot}p" "${PORTS_FILE}")"
        [ -n "${external_port}" ] || break

        if [ "${tcp_port}" != "-" ]; then
          target_tcp_port="$(forwarded_target_port "${external_port}" "${tcp_port}")"
          iptables -t nat -C "K8S_GTN_PF_NAT" -p tcp --dport "${external_port}" \
            -j DNAT --to-destination "${target_ip}:${target_tcp_port}" 2>/dev/null || return 1
          iptables -C "K8S_GTN_PF_FWD" -p tcp -d "${target_ip}" --dport "${target_tcp_port}" -j ACCEPT 2>/dev/null || return 1
        fi

        if [ "${udp_port}" != "-" ]; then
          target_udp_port="$(forwarded_target_port "${external_port}" "${udp_port}")"
          iptables -t nat -C "K8S_GTN_PF_NAT" -p udp --dport "${external_port}" \
            -j DNAT --to-destination "${target_ip}:${target_udp_port}" 2>/dev/null || return 1
          iptables -C "K8S_GTN_PF_FWD" -p udp -d "${target_ip}" --dport "${target_udp_port}" -j ACCEPT 2>/dev/null || return 1
        fi
      done < "${TARGETS_FILE}"
    }
    results() {
      slot=0
      while read -r handler namespace service target_ip http_port tcp_port udp_port; do
        slot=$((slot + 1))
        external_port="$(sed -n "${slot}p" "${PORTS_FILE}")"
        [ -n "${external_port}" ] || break

        printf 'result %s %s %s %s %s %s %s %s %s\n' \
          "${slot}" \
          "${external_port}" \
          "${handler}" \
          "${namespace}" \
          "${service}" \
          "${target_ip}" \
          "${http_port}" \
          "$(forwarded_target_port "${external_port}" "${tcp_port}")" \
          "$(forwarded_target_port "${external_port}" "${udp_port}")"
      done < "${TARGETS_FILE}"
    }

    target_count="$(wc -l < "${TARGETS_FILE}" | tr -d ' ')"
    ensure_base_networking
    if [ "${target_count}" -gt 0 ] && port_forwarding_requested; then
      ports="$(forwarded_ports)"
    else
      ports=""
    fi
    write_ports_file

    port_count="$(port_count)"
    desired_state="$(printf '%s\n' "${ports}" && cat "${TARGETS_FILE}")"

    if [ -f "${STATE_FILE}" ] \
      && [ "$(cat "${STATE_FILE}")" = "${desired_state}" ] \
      && forwarding_rules_present; then
      results
      printf 'ok unchanged\n'
      exit 0
    fi

    flush_forwarding
    if [ -n "${ports}" ]; then
      apply_targets
    fi

    printf '%s' "${desired_state}" > "${STATE_FILE}"
    log "${GLUETUN_GATEWAY_NAME}: applied targets=${target_count} ports=${port_count}"
    log "${GLUETUN_GATEWAY_NAME}: monitoring"
    results
    printf 'ok\n'
