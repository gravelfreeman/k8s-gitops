# yaml-language-server: $schema=https://www.schemastore.org/any.json
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gluetunclients.gluetun.k8s-gitops.io
spec:
  group: gluetun.k8s-gitops.io
  names:
    kind: GluetunClient
    listKind: GluetunClientList
    plural: gluetunclients
    singular: gluetunclient
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - gateway
                - service
              properties:
                gateway:
                  type: string
                  minLength: 1
                  maxLength: 253
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                handler:
                  type: string
                  minLength: 1
                  maxLength: 63
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                service:
                  type: string
                  minLength: 1
                  maxLength: 253
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
      additionalPrinterColumns:
        - name: Gateway
          type: string
          jsonPath: .spec.gateway
        - name: Service
          type: string
          jsonPath: .spec.service
        - name: Handler
          type: string
          jsonPath: .spec.handler
