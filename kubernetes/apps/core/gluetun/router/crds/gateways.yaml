# yaml-language-server: $schema=https://www.schemastore.org/any.json
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gluetungateways.gluetun.k8s-gitops.io
spec:
  group: gluetun.k8s-gitops.io
  names:
    kind: GluetunGateway
    listKind: GluetunGatewayList
    plural: gluetungateways
    singular: gluetungateway
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - service
              properties:
                agentPort:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  default: 9000
                service:
                  type: string
                  minLength: 1
                  maxLength: 253
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
      additionalPrinterColumns:
        - name: Service
          type: string
          jsonPath: .spec.service
        - name: AgentPort
          type: integer
          jsonPath: .spec.agentPort
