---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gluetun-router-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: gluetun-router-secret
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        slskd-api-key: 'X-API-Key: {{ .SLSKD_API_KEY }}'
  data:
    - secretKey: SLSKD_API_KEY
      remoteRef:
        key: slskd
        property: SLSKD_API_KEY
