---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app gluetun-bravo
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      gluetun-bravo:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          bootstrap:
            image:
              repository: ghcr.io/nicolaka/netshoot
              tag: v0.15@sha256:47b907d662d139d1e2f22bfe14f4efca1e3f1feed283572f47c970c780c03b61
            command: ["/bin/sh", "-ec"]
            args:
              - |
                sysctl -w net.ipv4.ip_forward=1
                chown -R 1000:1000 /tmp/gluetun
                iptables -P FORWARD DROP
                iptables -A FORWARD -i vpn -o tun0 -j ACCEPT
                iptables -A FORWARD -i tun0 -o vpn -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
                iptables -t nat -A POSTROUTING -s 100.100.2.0/24 -o tun0 -j MASQUERADE
            securityContext:
              privileged: true
              allowPrivilegeEscalation: true
              readOnlyRootFilesystem: false
              runAsGroup: 0
              runAsUser: 0
        containers:
          gluetun:
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: latest@sha256:25273bc5c8df54359bbf079c201d263ffb4140b793b1ba8c86907635ed636b13
            env:
              VPN_TYPE: wireguard
              VPN_PORT_FORWARDING: on
              VPN_PORT_FORWARDING_PORTS_COUNT: '4'
              VPN_SERVICE_PROVIDER_SECRETFILE: /run/secrets/gluetun/vpn_service_provider
              WIREGUARD_PRIVATE_KEY_SECRETFILE: /run/secrets/gluetun/wireguard_private_key
              SERVER_CITIES_SECRETFILE: /run/secrets/gluetun/server_cities
              DNS_UPSTREAM_RESOLVER_TYPE: DoH
              PORT_FORWARD_ONLY: on
              FIREWALL_INPUT_PORTS: 8888,8388,1080
              HTTPPROXY: on
              HTTPPROXY_LOG: on
              SHADOWSOCKS: on
              SHADOWSOCKS_LOG: on
              PUBLICIP_ENABLED: off
              VERSION_INFORMATION: off
            lifecycle:
              postStart:
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - ip rule del table 51820 || true; ip -6 rule del table 51820 || true
            probes:
              liveness: &gluetunProbe
                custom: true
                spec:
                  exec:
                    command: [/gluetun-entrypoint, healthcheck]
              readiness: *gluetunProbe
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                add: [CHOWN, NET_ADMIN, NET_RAW]
                drop: [ALL]
              readOnlyRootFilesystem: false
              runAsGroup: 0
              runAsUser: 0
          socks5:
            enabled: true
            image:
              repository: ghcr.io/ariadata/go-socks5-proxy
              tag: main-4c0d6b6@sha256:5f7399545e7aba33908314413a4b45e28cdcd2a7826b520d317b4724c004d228
            probes:
              liveness: &socks5Probe
                custom: true
                spec:
                  tcpSocket:
                    port: 1080
              readiness: *socks5Probe
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              readOnlyRootFilesystem: true
              runAsGroup: 1000
              runAsUser: 1000
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: multus/gluetun-bravo-gateway@vpn
          labels:
            network.k8s-gitops.io/vpn-gateway: bravo
          dnsConfig:
            options:
              - name: ndots
                value: "1"
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          automountServiceAccountToken: false
    persistence:
      device:
        type: custom
        volumeSpec:
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        advancedMounts:
          gluetun-bravo:
            gluetun:
              - path: /dev/net/tun
      secrets:
        type: secret
        name: gluetun-bravo-secret
        advancedMounts:
          gluetun-bravo:
            gluetun:
              - path: /gluetun/auth/config.toml
                subPath: config.toml
                readOnly: true
              - path: /run/secrets/gluetun/vpn_service_provider
                subPath: vpn_service_provider
                readOnly: true
              - path: /run/secrets/gluetun/wireguard_private_key
                subPath: wireguard_private_key
                readOnly: true
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp/gluetun
    service:
      app:
        controller: *app
        ports:
          http:
            port: 8000
      proxies:
        enabled: true
        type: LoadBalancer
        annotations:
          external-dns.alpha.kubernetes.io/hostname: bravo.${DOMAIN_2}
          "lbipam.cilium.io/ips": 10.0.20.22
        labels:
          io.cilium/bgp-advertise: "true"
          network.k8s-gitops.io/lb-pool: services
        controller: *app
        ports:
          http:
            port: 8888
            targetPort: 8888
            protocol: TCP
          shadowsocks:
            port: 8388
            targetPort: 8388
            protocol: TCP
          socks5:
            port: 1080
            targetPort: 1080
            protocol: TCP
