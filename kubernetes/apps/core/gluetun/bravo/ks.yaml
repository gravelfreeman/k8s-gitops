---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app bravo
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../../components/common/system
  dependsOn:
    - name: flux-shared
    - name: envoy-gateway-config
    - name: external-secrets-store
    - name: multus-networks
  interval: 1h
  path: kubernetes/apps/core/gluetun/bravo/app
  postBuild:
    substitute:
      APP: *app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: gluetun
  timeout: 5m
  wait: true
