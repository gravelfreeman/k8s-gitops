---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app gluetun-echo
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: gluetun-router
  interval: 1h
  path: kubernetes/components/vpn/gateway
  postBuild:
    substitute:
      APP: *app
      VPN_GATEWAY_ID: "5"
      VPN_PROXIES_ENABLED: "true"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: gluetun
  timeout: 5m
  wait: true
