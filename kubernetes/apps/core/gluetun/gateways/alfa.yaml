---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app gluetun-alfa
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: gluetun-router
  interval: 1h
  path: kubernetes/components/gluetun/gateway
  postBuild:
    substitute:
      APP: *app
      GLUETUN_GATEWAY_ID: "1"
      GLUETUN_PORT_FORWARDS: "2"
      GLUETUN_PROXIES_ENABLED: "true"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: gluetun
  timeout: 5m
  wait: true
