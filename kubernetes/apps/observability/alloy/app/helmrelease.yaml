---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: alloy
  values:
    fullnameOverride: alloy
    crds:
      create: false
    global:
      podSecurityContext:
        runAsGroup: 473
        runAsNonRoot: true
        runAsUser: 473
        seccompProfile:
          type: RuntimeDefault
    alloy:
      configMap:
        create: false
        key: config.alloy
        name: alloy-configmap
      enableReporting: false
      extraEnv:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
    configReloader:
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
    controller:
      podAnnotations:
        configmap.reloader.stakater.com/reload: alloy-configmap
    serviceMonitor:
      enabled: true
