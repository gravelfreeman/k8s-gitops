---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mosquitto-tls
spec:
  commonName: mosquitto.mosquitto.svc.cluster.local
  dnsNames:
    - mosquitto
    - mosquitto.mosquitto
    - mosquitto.mosquitto.svc
    - mosquitto.mosquitto.svc.cluster.local
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: mqtt-ca
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
    size: 256
  secretName: mosquitto-tls
  usages: [server auth]
