---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app home-assistant-mcp
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/common/app/shared
  dependsOn:
    - name: home-assistant
    - name: external-secrets-store
  interval: 30m
  path: kubernetes/apps/domotics/home-assistant/mcp
  postBuild:
    substitute:
      APP: *app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: home-assistant
  timeout: 5m
  wait: true
