---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: home-assistant
spec:
  alias: home_assistant
  workload:
    image: ghcr.io/homeassistant-ai/ha-mcp:8.7.0@sha256:600677bbd7574dfb59682e40d6945f73fcc8852d3684b3671506602473942448
    command: [ha-mcp-web]
    port: 8086
    env:
      - name: HOMEASSISTANT_URL
        value: http://home-assistant.home-assistant.svc.cluster.local:8123
      - name: HA_MCP_DISABLE_SETTINGS_UI
        value: "true"
    envFrom:
      - secretRef:
          name: ha-mcp-secret
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 512Mi
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
