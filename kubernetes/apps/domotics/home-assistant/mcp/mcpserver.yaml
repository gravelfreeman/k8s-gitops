---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: home-assistant
spec:
  alias: home_assistant
  authType: oauth2
  params:
    oauth2_flow: authorization_code
  workload:
    image: ghcr.io/homeassistant-ai/ha-mcp:8.5.0@sha256:e1538bcdadb13a5467bbb8258fba3262a05518585e18115742da638adec7057c
    command: [ha-mcp-oauth]
    port: 8086
    env:
      - name: HOMEASSISTANT_URL
        value: http://home-assistant.home-assistant.svc.cluster.local:8123
      - name: MCP_BASE_URL
        value: https://ha.${DOMAIN_0}
      - name: HA_MCP_DISABLE_SETTINGS_UI
        value: "true"
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 512Mi
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
