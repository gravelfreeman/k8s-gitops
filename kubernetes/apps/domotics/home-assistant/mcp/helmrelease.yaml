---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant-mcp
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      home-assistant-mcp:
        containers:
          app:
            image:
              repository: ghcr.io/homeassistant-ai/ha-mcp
              tag: 8.5.0@sha256:e1538bcdadb13a5467bbb8258fba3262a05518585e18115742da638adec7057c
            command: [ha-mcp-web]
            env:
              FASTMCP_CHECK_FOR_UPDATES: "off"
              HA_MCP_CONFIG_DIR: /data
              HA_MCP_DISABLE_UPDATE_CHECK: true
              HOMEASSISTANT_URL: http://home-assistant.home-assistant.svc.cluster.local:8123
              MCP_HEALTHZ: true
              MCP_HOST: 0.0.0.0
              MCP_PORT: &port 8086
            envFrom:
              - secretRef:
                  name: home-assistant-mcp-secret
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
                path: /healthz
              readiness: *probes
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
    persistence:
      data:
        existingClaim: home-assistant-mcp-data
    service:
      app:
        ports:
          http:
            port: *port
