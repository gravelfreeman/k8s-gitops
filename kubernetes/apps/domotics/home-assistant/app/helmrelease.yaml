---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      home-assistant:
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: '[{"name":"iot","namespace":"multus","ips":["10.0.30.30/24"],"mac":"02:0a:00:1e:00:7b"}]'
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.10.4@sha256:0fa107b398ab3fd3c3f7f8e215705579b5e77a30f5cb2e542aa74a7bdd2c4d5b
            args: [--log-file, /tmp/home-assistant.log]
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  periodSeconds: 10
                  failureThreshold: 30
            resources:
              requests:
                cpu: '1'
                memory: 4Gi
              limits:
                memory: 8Gi
          git-sync:
            image:
              repository: registry.k8s.io/git-sync/git-sync
              tag: v4.8.0@sha256:a20644562fba94773e594885cb001aadb5a3172175f13ac1215e5b2033c9200e
            args:
              - --repo=https://github.com/gravelfreeman/ha-gitops
              - --ref=main
              - --root=/config/.git-sync
              - --sparse-checkout-file=/etc/git-sync/sparse-checkout
              - --exechook-command=/etc/git-sync/exechook.sh
              - --verbose=6
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
        defaultContainerOptions:
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsGroup: 568
        runAsUser: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      config:
        existingClaim: home-assistant-data
      secrets:
        type: secret
        name: home-assistant-app-secret
        advancedMounts:
          home-assistant:
            app:
              - path: /config/secrets.yaml
                subPath: secrets.yaml
      workdir:
        type: emptyDir
        advancedMounts:
          home-assistant:
            app:
              - path: /config/.venv
      git-sync-config:
        type: configMap
        name: git-sync-config
        defaultMode: 0555
        advancedMounts:
          home-assistant:
            git-sync:
              - path: /etc/git-sync
      git-sync-secret:
        type: secret
        name: git-sync-secret
        advancedMounts:
          home-assistant:
            git-sync:
              - path: /run/secrets/git-sync-secret
    route:
      app:
        hostnames: ['home.${DOMAIN_0}']
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
    service:
      app:
        ports:
          http:
            port: 8123
