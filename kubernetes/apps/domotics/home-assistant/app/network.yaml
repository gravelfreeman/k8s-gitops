apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: home-assistant
spec:
  config: |-
    {
      "cniVersion": "1.1.0",
      "name": "home-assistant",
      "plugins": [
        {
          "type": "macvlan",
          "master": "enp89s0",
          "mode": "bridge",
          "ipam": {
            "type": "static",
            "routes": [
              {
                "dst": "10.0.30.0/24",
                "gw": "10.0.10.1"
              }
            ]
          }
        }
      ]
    }
