apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - externalsecret.yaml
  - helmrelease.yaml
configMapGenerator:
  - name: git-sync-config
    files:
      - exechook.sh=./resources/exechook.sh
      - sparse-checkout=./resources/sparse-checkout
generatorOptions:
  disableNameSuffixHash: true
