---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bambuddy
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      bambuddy:
        containers:
          app:
            image:
              repository: ghcr.io/maziggy/bambuddy
              tag: 0.2.4
            env:
              VIRTUAL_PRINTER_PASV_ADDRESS: 10.0.30.?
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                add: [NET_BIND_SERVICE]
                drop: [ALL]
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: '[{"name":"iot","namespace":"multus","ips":["10.0.30.?/24"],"mac":"?"}]'
          hostUsers: false
          securityContext:
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
            runAsNonRoot: true
            runAsGroup: 2000
            runAsUser: 2000
            seccompProfile:
              type: RuntimeDefault
    persistence:
      data:
        existingClaim: bambuddy-data
        globalMounts:
          - path: /app/data
      logs:
        type: emptyDir
        globalMounts:
          - path: /app/logs
    route:
      app:
        hostnames: ['bambuddy.${DOMAIN_0}']
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
    service:
      app:
        ports:
          http:
            port: 8000
