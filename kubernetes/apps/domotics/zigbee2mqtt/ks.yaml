---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app zigbee2mqtt
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: zigbee2mqtt
  components:
    - ../../../../components/common/app
    - ../../../../components/envoy-oidc
    - ../../../../components/volsync
  dependsOn:
    - name: cert-manager-issuers
    - name: envoy-gateway-config
    - name: external-secrets-store
    - name: mosquitto
    - name: openebs
    - name: rook-ceph-cluster
    - name: volsync
  interval: 30m
  path: kubernetes/apps/domotics/zigbee2mqtt/app
  postBuild:
    substitute:
      APP: *app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: *app
  wait: true
