---
# yaml-language-server: $schema=https://www.schemastore.org/any.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-oidc-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ${APP}-oidc-secret
  data:
    - secretKey: client-id
      remoteRef:
        key: ${APP}
        property: client-id
    - secretKey: client-secret
      remoteRef:
        key: ${APP}
        property: client-secret
