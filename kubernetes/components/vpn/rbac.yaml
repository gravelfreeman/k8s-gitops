---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${APP}-gluetun-client
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["${VPN_SERVICE:=${APP}}"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${APP}-gluetun-client
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${APP}-gluetun-client
subjects:
  - kind: ServiceAccount
    name: gluetun-router
    namespace: gluetun
