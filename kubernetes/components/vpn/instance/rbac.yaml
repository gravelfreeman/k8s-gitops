---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${APP}-agent-secret-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["${APP}-agent-secret"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${APP}-agent-secret-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${APP}-agent-secret-reader
subjects:
  - kind: ServiceAccount
    name: gluetun-router
    namespace: gluetun
