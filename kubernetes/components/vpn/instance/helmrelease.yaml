---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ${APP}
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      ${APP}:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          ip-forward:
            image: &gluetunImage
              repository: ghcr.io/qdm12/gluetun
              tag: latest@sha256:25273bc5c8df54359bbf079c201d263ffb4140b793b1ba8c86907635ed636b13
            command: ["/bin/sh", "-ec"]
            args: ["sysctl -w net.ipv4.ip_forward=1"]
            securityContext:
              privileged: true
              readOnlyRootFilesystem: true
              runAsUser: 0
        containers:
          gluetun:
            image: *gluetunImage
            command: ["/bin/sh", "-ec"]
            args:
              - |
                ip rule del table 51820 2>/dev/null || true
                ip -6 rule del table 51820 2>/dev/null || true
                exec /gluetun-entrypoint
            env:
              DNS_UPSTREAM_IPV6: off
              DNS_UPSTREAM_RESOLVERS: quad9
              DNS_UPSTREAM_RESOLVER_TYPE: doh
              FIREWALL_INPUT_PORTS: '{{- $ports := list "9000" -}}{{- if .Values.service.proxies.ports.http.enabled -}}{{- $ports = append $ports "8888" -}}{{- end -}}{{- if .Values.service.proxies.ports.shadowsocks.enabled -}}{{- $ports = append $ports "8388" -}}{{- end -}}{{- if .Values.service.proxies.ports.socks5.enabled -}}{{- $ports = append $ports "1080" -}}{{- end -}}{{ join "," $ports }}'
              HTTP_CONTROL_SERVER_AUTH_CONFIG_FILEPATH: /run/secrets/gluetun/config.toml
              HTTP_CONTROL_SERVER_LOG: off
              HTTPPROXY: '{{ ternary "on" "off" .Values.service.proxies.ports.http.enabled }}'
              IPV6: off
              PORT_FORWARD_ONLY: '{{ ternary "on" "off" (gt (int "${VPN_PORT_FORWARDING_PORTS_COUNT:=0}") 0) }}'
              PUBLICIP_ENABLED: off
              SHADOWSOCKS: '{{ ternary "on" "off" .Values.service.proxies.ports.shadowsocks.enabled }}'
              STORAGE_SERVERS_DIRECTORY_PATH: /tmp/gluetun/servers/
              VERSION_INFORMATION: off
              VPN_PORT_FORWARDING: '{{ ternary "on" "off" (gt (int "${VPN_PORT_FORWARDING_PORTS_COUNT:=0}") 0) }}'
              VPN_PORT_FORWARDING_PORTS_COUNT: "${VPN_PORT_FORWARDING_PORTS_COUNT:=0}"
              VPN_SERVICE_PROVIDER_SECRETFILE: /run/secrets/gluetun/vpn_service_provider
              VPN_TYPE: wireguard
              WIREGUARD_ENDPOINT_IP_SECRETFILE: /run/secrets/gluetun/wireguard_endpoint_ip
              WIREGUARD_ENDPOINT_PORT_SECRETFILE: /run/secrets/gluetun/wireguard_endpoint_port
              WIREGUARD_PRIVATE_KEY_SECRETFILE: /run/secrets/gluetun/wireguard_private_key
            probes:
              liveness: &gluetunProbe
                custom: true
                spec:
                  exec:
                    command: [/gluetun-entrypoint, healthcheck]
              readiness: *gluetunProbe
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                add: [CHOWN, NET_ADMIN, NET_RAW]
                drop: [ALL]
              readOnlyRootFilesystem: false
              runAsGroup: 0
              runAsUser: 0
          agent:
            image:
              repository: ghcr.io/nicolaka/netshoot
              tag: v0.15@sha256:47b907d662d139d1e2f22bfe14f4efca1e3f1feed283572f47c970c780c03b61
            command: ["/bin/sh", "/agent/agent.sh"]
            env:
              VPN_GATEWAY:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['network.k8s-gitops.io/vpn-gateway']
              AGENT_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: ${APP}-agent-secret
                    key: AGENT_TOKEN
              GLUETUN_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: ${APP}-secret
                    key: GLUETUN_API_KEY
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                add: [NET_ADMIN]
                drop: [ALL]
              readOnlyRootFilesystem: true
              runAsGroup: 0
              runAsUser: 0
          socks5:
            enabled: ${VPN_SOCKS5_ENABLED:=${VPN_PROXIES_ENABLED:=false}}
            image:
              repository: ghcr.io/ariadata/go-socks5-proxy
              tag: main-4c0d6b6@sha256:5f7399545e7aba33908314413a4b45e28cdcd2a7826b520d317b4724c004d228
            probes:
              liveness: &socks5Probe
                custom: true
                spec:
                  tcpSocket:
                    port: 1080
              readiness: *socks5Probe
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              readOnlyRootFilesystem: true
              runAsGroup: 1000
              runAsUser: 1000
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: gluetun/${APP}-gateway@vpn
          labels:
            network.k8s-gitops.io/vpn-gateway: ${APP}
          dnsConfig:
            options:
              - name: ndots
                value: "1"
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          automountServiceAccountToken: false
    persistence:
      agent:
        type: configMap
        name: gluetun-agent
        advancedMounts:
          ${APP}:
            agent:
              - path: /agent
                readOnly: true
      device:
        type: hostPath
        hostPath: /dev/net/tun
        hostPathType: CharDevice
        advancedMounts:
          ${APP}:
            gluetun:
              - path: /dev/net/tun
      secrets:
        type: secret
        name: ${APP}-secret
        advancedMounts:
          ${APP}:
            gluetun:
              - path: /run/secrets/gluetun
                readOnly: true
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp/gluetun
    service:
      app:
        controller: *app
        ports:
          http:
            port: 8000
          agent:
            port: 9000
            targetPort: 9000
            protocol: TCP
      proxies:
        enabled: ${VPN_PROXIES_ENABLED:=false}
        type: LoadBalancer
        annotations:
          external-dns.alpha.kubernetes.io/hostname: ${APP}.${DOMAIN_2}
          "lbipam.cilium.io/ips": "10.0.20.2${VPN_INSTANCE}"
        labels:
          io.cilium/bgp-advertise: "true"
          network.k8s-gitops.io/lb-pool: services
        controller: *app
        ports:
          http:
            enabled: ${VPN_HTTPPROXY_ENABLED:=${VPN_PROXIES_ENABLED:=false}}
            port: 8888
            targetPort: 8888
            protocol: TCP
          shadowsocks:
            enabled: ${VPN_SHADOWSOCKS_ENABLED:=${VPN_PROXIES_ENABLED:=false}}
            port: 8388
            targetPort: 8388
            protocol: TCP
          socks5:
            enabled: ${VPN_SOCKS5_ENABLED:=${VPN_PROXIES_ENABLED:=false}}
            port: 1080
            targetPort: 1080
            protocol: TCP
