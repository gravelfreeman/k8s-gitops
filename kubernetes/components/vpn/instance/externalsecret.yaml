---
# yaml-language-server: $schema=https://www.schemastore.org/any.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret ${APP}-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *secret
    template:
      engineVersion: v2
      data:
        GLUETUN_API_KEY: '{{ index . (printf "%s_GLUETUN_API_KEY" (replace "-" "_" (upper "${APP}"))) }}'
        config.toml: |
          [[roles]]
          name = "port-forward"
          routes = ["GET /v1/portforward"]
          auth = "apikey"
          apikey = "{{ index . (printf "%s_GLUETUN_API_KEY" (replace "-" "_" (upper "${APP}"))) }}"
        server_hostnames: >-
          {{- $app := replace "-" "_" (upper "${APP}") -}}
          {{- $value := coalesce
            (get . "GLUETUN_ALPHA_SERVER_HOSTNAMES")
            (get . (printf "%s_SERVER_HOSTNAMES" $app))
            (get . (printf "%s_SERVER_HOSTNAME" $app)) -}}
          {{- $value -}}
        vpn_service_provider: '{{ index . (printf "%s_VPN_SERVICE_PROVIDER" (replace "-" "_" (upper "${APP}"))) }}'
        wireguard_private_key: '{{ index . (printf "%s_WIREGUARD_PRIVATE_KEY" (replace "-" "_" (upper "${APP}"))) }}'
      mergePolicy: Replace
  dataFrom:
    - extract:
        key: gluetun
---
# yaml-language-server: $schema=https://www.schemastore.org/any.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &agentSecret ${APP}-agent-secret
spec:
  refreshPolicy: OnChange
  target:
    name: *agentSecret
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: gluetun-agent-token
