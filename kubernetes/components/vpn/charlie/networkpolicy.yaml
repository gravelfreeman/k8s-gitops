---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ${APP}-vpn-egress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: ${APP}
      network.k8s-gitops.io/vpn-egress: charlie
  egress:
    - toCIDRSet:
        - cidr: 10.0.0.0/8
        - cidr: 100.100.3.1/32
        - cidr: 169.254.0.0/16
        - cidr: 172.16.0.0/12
        - cidr: 192.168.0.0/16
