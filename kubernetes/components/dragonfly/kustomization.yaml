apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - dragonfly.yaml
  - externalsecret.yaml
patches:
  - patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: _
      spec:
        values:
          persistence:
            dragonfly:
              type: secret
              name: ${APP}-dragonfly-secret
              globalMounts:
                - path: /dragonfly
    target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
