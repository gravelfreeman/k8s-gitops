# yaml-language-server: $schema=https://www.schemastore.org/any.json
---
apiVersion: gluetun.k8s-gitops.io/v1alpha1
kind: GluetunClient
metadata:
  name: ${APP}
spec:
  gateway: ${GLUETUN_GATEWAY_NAME}
  portForwarding:
    useServicePort: ${GLUETUN_FORWARD_USE_SERVICE_PORT:=true}
  service: ${GLUETUN_SERVICE:=${APP}}
