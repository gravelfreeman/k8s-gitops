---
name: Renovate
on:
    workflow_dispatch:
    schedule:
        - cron: "0 */6 * * *"
permissions:
    contents: write
    issues: write
    pull-requests: write
jobs:
    renovate:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - name: Renovate
              uses: renovatebot/github-action@693b9ef15eec82123529a37c782242f091365961 # v46.1.14
              with:
                  token: ${{ github.token }}
              env:
                  RENOVATE_ALLOWED_COMMANDS: '["^bash \\.renovate/scripts/alpine-sha\\.sh$"]'
                  RENOVATE_REPOSITORIES: ${{ github.repository }}
