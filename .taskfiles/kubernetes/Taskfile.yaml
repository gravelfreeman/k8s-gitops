# yaml-language-server: $schema=https://taskfile.dev/schema.json
---
version: "3"

tasks:

  configmap:push:
    desc: Push local app ConfigMap changes directly to the cluster [APP=required]
    cmd: bash "$(git rev-parse --show-toplevel)/.taskfiles/kubernetes/scripts/configmap-push.sh" "{{.APP}}"
    requires:
      vars: [APP]
    preconditions:
      - which base64 bash flux git jq kubectl kustomize yq

  namespace:delete:
    desc: Clear finalizers from a Terminating namespace [NS=required]
    prompt: Clear finalizers from namespace {{.NS}} ... continue?
    silent: true
    cmd: >-
      namespace_json="$(kubectl get namespace "{{.NS}}" -o json)" &&
      test "$(printf '%s' "$namespace_json" | jq -r '.status.phase')" = Terminating &&
      printf '%s' "$namespace_json" |
      jq '.spec.finalizers = []' |
      kubectl replace --raw "/api/v1/namespaces/{{.NS}}/finalize" -f -
    requires:
      vars: [NS]
    preconditions:
      - which jq kubectl

  pvc:mount:
    desc: Mount a PVC in a temporary BusyBox pod (PVC=<pvc-name> [NS=<namespace>] [RUN_AS_USER=568] [RUN_AS_GROUP=568])
    silent: true
    cmd: >-
      PVC="{{.PVC}}" NS="{{.NS | default ""}}" RUN_AS_USER="{{.RUN_AS_USER | default "568"}}" RUN_AS_GROUP="{{.RUN_AS_GROUP | default "568"}}" POD="pvc-mount-{{.PVC}}"; [ -n "$NS" ] || NS="$(kubectl get pvc -A --field-selector metadata.name="$PVC" -o jsonpath='{.items[0].metadata.namespace}')"; [ -n "$NS" ] || { echo "PVC '$PVC' not found"; exit 1; }; export PVC POD RUN_AS_USER RUN_AS_GROUP; envsubst < .taskfiles/kubernetes/templates/pvc-mount.yaml | kubectl -n "$NS" apply -f - && kubectl -n "$NS" wait pod/"$POD" --for=condition=Ready --timeout=2m && kubectl -n "$NS" exec -it "$POD" -- sh
    requires:
      vars: [PVC]

  pvc:unmount:
    desc: Delete the temporary BusyBox PVC pod (PVC=<pvc-name> [NS=<namespace>])
    silent: true
    cmd: >-
      PVC="{{.PVC}}" NS="{{.NS | default ""}}" POD="pvc-mount-{{.PVC}}"; [ -n "$NS" ] || NS="$(kubectl get pod -A --field-selector metadata.name="$POD" -o jsonpath='{.items[0].metadata.namespace}')"; [ -n "$NS" ] || { echo "pod '$POD' not found"; exit 1; }; kubectl -n "$NS" delete pod "$POD" --ignore-not-found
    requires:
      vars: [PVC]

  secrets:list:
    desc: List ignored app files
    silent: true
    cmd: |-
      while IFS= read -r ignored_path || [ -n "$ignored_path" ]; do
        case "$ignored_path" in /kubernetes/apps/*/*/*) ;; *) continue ;; esac
        externalsecret_path=".${ignored_path%/app/*}/app/externalsecret.yaml"
        [ -f "$externalsecret_path" ] || continue
        yq --no-doc --output-format=tsv "
          .spec.data[]?
          | select(.secretKey == \"${ignored_path##*/}\" and .remoteRef.key)
          | [\"$(basename "${ignored_path%/app/*}")\", .remoteRef.key, (.remoteRef.property // .secretKey), \".$ignored_path\"]
        " "$externalsecret_path"
      done < .gitignore
    preconditions:
      - sh: test -f .gitignore
      - sh: which yq

  secrets:push:
    desc: Push ignored app files to 1Password and refresh live secrets
    silent: true
    cmd: |-
      task kubernetes:secrets:list \
      | while IFS="$(printf '\t')" read -r app item file_name file_path; do
          op document edit "$item" "$file_path" --file-name "$file_name" --vault "{{.OP_VAULT}}" > /dev/null || exit 1
          manifest_path="${file_path#./}"
          externalsecret_path="${manifest_path%/app/*}/app/externalsecret.yaml"
          externalsecret_name="$(SECRET_KEY="$file_name" yq -r 'select(.spec.data[].secretKey == strenv(SECRET_KEY)) | .metadata.name' "$externalsecret_path")"
          secret_name="$(kubectl get externalsecret "$externalsecret_name" -n "$app" -o jsonpath='{.spec.target.name}')"
          expected_hash="$(sha256sum "$file_path" | awk '{print $1}')"
          refresh_time="$(kubectl get externalsecret "$externalsecret_name" -n "$app" -o jsonpath='{.status.refreshTime}')"
          kubectl annotate externalsecret "$externalsecret_name" -n "$app" "force-sync=$(date +%s)" --overwrite > /dev/null
          until [ "$(kubectl get externalsecret "$externalsecret_name" -n "$app" -o jsonpath='{.status.refreshTime}')" != "$refresh_time" ]; do sleep 1; done
          secret_key="$(printf '%s' "$file_name" | sed 's/\./\\./g')"
          secret_hash=""
          for _ in $(seq 1 24); do
            secret_hash="$(kubectl get secret "$secret_name" -n "$app" -o jsonpath="{.data.${secret_key}}" | base64 -d | sha256sum | awk '{print $1}')"
            [ "$secret_hash" = "$expected_hash" ] && break
            kubectl annotate externalsecret "$externalsecret_name" -n "$app" "force-sync=$(date +%s)" --overwrite > /dev/null
            sleep 5
          done
          [ "$secret_hash" = "$expected_hash" ] || { echo "Secret $app/$secret_name did not match $file_path" >&2; exit 1; }
          kubectl get deployment,statefulset,daemonset -n "$app" -l "app.kubernetes.io/name=$app" -o name \
          | while IFS= read -r workload; do
              kubectl rollout restart -n "$app" "$workload"
              kubectl rollout status -n "$app" "$workload" --timeout=2m
            done
          echo "$app/$file_name -> $item"
        done
    preconditions:
      - sh: test -f .gitignore
      - sh: op user get --me
      - sh: which awk base64 date kubectl op sed sha256sum sleep yq

  tuppr:reset:
    desc: Reset the Tuppr Talos upgrade campaign
    prompt: Reset the Tuppr Talos upgrade campaign ... continue?
    silent: true
    cmds:
      - kubectl annotate talosupgrade.tuppr.home-operations.com talos tuppr.home-operations.com/reset="$(date -u +%FT%TZ)" --overwrite
      - task kubernetes:tuppr:watch
    preconditions:
      - sh: which kubectl
      - sh: which task

  tuppr:watch:
    desc: Watch the Tuppr Talos upgrade campaign
    silent: true
    cmd: kubectl get talosupgrade.tuppr.home-operations.com talos -w
    preconditions:
      - sh: which kubectl
