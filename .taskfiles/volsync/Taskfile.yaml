# yaml-language-server: $schema=https://taskfile.dev/schema.json
---
version: "3"

tasks:

  list:
    desc: List VolSync restic snapshots on Backblaze B2 [APP=required]
    cmd: restic -r "s3:https://${S3_ENDPOINT}/${S3_BUCKET}/volsync/{{.APP}}" --password-command 'op read "op://{{.OP_VAULT}}/backblaze/RESTIC_PASSWORD"' snapshots
    requires:
      vars: [APP]
    preconditions:
      - op user get --me
      - which op restic

  backup:
    desc: Create an on-demand VolSync restic backup [APP=required NS=APP CLAIM=data]
    cmds:
      - kubectl patch persistentvolumeclaim "{{.PVC_NAME}}" -n "{{.NS}}" --type=merge -p "{\"metadata\":{\"annotations\":{\"volsync.backube/copy-trigger\":\"$VOLSYNC_TRIGGER_ID\"}}}"
      - |-
        for _ in $(seq 720); do
          state="$(kubectl get replicationsource.volsync.backube "{{.PVC_NAME}}" -n "{{.NS}}" -ojsonpath="{.status.lastSyncTime}|{.status.latestMoverStatus.result}")"
          if [ "${state%%|*}" != "$VOLSYNC_INITIAL_LAST_SYNC_TIME" ]; then [ "${state#*|}" = "Successful" ]; exit $?; fi
          sleep 10
        done
        exit 124
    env:
      VOLSYNC_INITIAL_LAST_SYNC_TIME:
        sh: kubectl get replicationsource.volsync.backube "{{.PVC_NAME}}" -n "{{.NS}}" -ojsonpath="{.status.lastSyncTime}"
      VOLSYNC_TRIGGER_ID:
        sh: printf "manual-%s-%s\n" "{{.PVC_NAME}}" "$(date -u +%Y%m%dT%H%M%SZ)"
    requires:
      vars: [APP]
    vars:
      CLAIM: "{{.CLAIM | default \"data\"}}"
      NS: "{{.NS | default .APP}}"
      PVC_NAME: "{{.PVC | default (printf \"%s-%s\" .APP .CLAIM)}}"
    preconditions:
      - test "$(kubectl get persistentvolumeclaim "{{.PVC_NAME}}" -n "{{.NS}}" -ojsonpath="{.metadata.annotations.volsync\.backube/latest-copy-status}")" = "WaitingForTrigger"
      - which date kubectl seq

  copy:
    desc: Copy VolSync restic snapshots on Backblaze B2 [SOURCE=required TARGET=required]
    prompt: Copy VolSync restic snapshots from {{.SOURCE}} to {{.TARGET}}?
    cmds:
      - restic -r "s3:https://${S3_ENDPOINT}/${S3_BUCKET}{{.TARGET}}" --password-command 'op read "op://{{.OP_VAULT}}/backblaze/RESTIC_PASSWORD"' init --from-repo "s3:https://${S3_ENDPOINT}/${S3_BUCKET}{{.SOURCE}}" --from-password-command 'op read "op://{{.OP_VAULT}}/backblaze/RESTIC_PASSWORD"' --copy-chunker-params || true
      - GOMEMLIMIT="{{.RESTIC_COPY_GOMEMLIMIT}}" GOGC="{{.RESTIC_COPY_GOGC}}" restic -r "s3:https://${S3_ENDPOINT}/${S3_BUCKET}{{.TARGET}}" --password-command 'op read "op://{{.OP_VAULT}}/backblaze/RESTIC_PASSWORD"' copy --from-repo "s3:https://${S3_ENDPOINT}/${S3_BUCKET}{{.SOURCE}}" --from-password-command 'op read "op://{{.OP_VAULT}}/backblaze/RESTIC_PASSWORD"' {{.RESTIC_COPY_ARGS}}
    requires:
      vars: [SOURCE, TARGET]
    vars:
      RESTIC_COPY_ARGS: '{{.RESTIC_COPY_ARGS | default ""}}'
      RESTIC_COPY_GOGC: '{{.RESTIC_COPY_GOGC | default "20"}}'
      RESTIC_COPY_GOMEMLIMIT: '{{.RESTIC_COPY_GOMEMLIMIT | default "256MiB"}}'
    preconditions:
      - op user get --me
      - which op restic

  delete:
    desc: Delete a VolSync restic repository prefix from Backblaze B2 [TARGET=required]
    prompt: Permanently delete every object and version under {{.RESTIC_TARGET}} from Backblaze B2? This cannot be undone.
    cmds:
      - aws --endpoint-url "https://${S3_ENDPOINT}" s3 rm "s3://${S3_BUCKET}{{.RESTIC_TARGET}}/" --recursive --only-show-errors
      - |-
        prefix="{{.RESTIC_TARGET}}"; prefix="${prefix#/}/"
        aws --endpoint-url "https://${S3_ENDPOINT}" s3api list-object-versions --bucket "${S3_BUCKET}" --prefix "${prefix}" |
          jq -c '[.Versions[]?, .DeleteMarkers[]?] | map({Key, VersionId}) | range(0; length; 1000) as $i | {Objects: .[$i:$i+1000], Quiet: true}' |
          while IFS= read -r batch; do
            aws --endpoint-url "https://${S3_ENDPOINT}" s3api delete-objects --bucket "${S3_BUCKET}" --delete "${batch}" >/dev/null
          done
    requires:
      vars: [TARGET]
    vars:
      RESTIC_TARGET: '{{trimSuffix "/" .TARGET}}'
    preconditions:
      - test -n "{{.RESTIC_TARGET}}"
      - which aws jq

  restore:
    desc: Restore VolSync restic snapshots locally [SOURCE=required]
    prompt: Restore VolSync restic snapshot {{.RESTIC_SNAPSHOT}} from {{.SOURCE}} to {{.RESTORE_TARGET}}?
    cmds:
      - mkdir -p "{{.RESTORE_TARGET}}"
      - restic -r "s3:https://${S3_ENDPOINT}/${S3_BUCKET}{{.SOURCE}}" restore "{{.RESTIC_SNAPSHOT}}" --target "{{.RESTORE_TARGET}}"
    requires:
      vars: [SOURCE]
    vars:
      RESTIC_SNAPSHOT: "{{.SNAPSHOT | default \"latest\"}}"
      RESTORE_TARGET: "{{.TARGET | default \"/workspaces/k8s-gitops/restore/volsync\"}}"
    preconditions:
      - op user get --me
      - which mkdir op restic
