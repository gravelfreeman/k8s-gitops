---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile
helmDefaults:
  cleanupOnFail: true
  wait: true
  waitForJobs: true

releases:
  - name: cilium
    namespace: kube-system
    chart: oci://quay.io/cilium/charts/cilium
    version: 1.19.4
    values: ["./templates/values.yaml.gotmpl"]
    hooks:
      - events: ["postsync"]
        command: sh
        args:
          - -ec
          - |-
            kubectl kustomize ../../kubernetes/apps/system/cilium/config \
              | kubectl apply \
                  --server-side \
                  --namespace=kube-system \
                  --field-manager=kustomize-controller \
                  --filename -
        showlogs: true

  - name: cert-manager
    namespace: cert-manager
    createNamespace: true
    chart: oci://quay.io/jetstack/charts/cert-manager
    version: v1.20.2
    values: ["./templates/values.yaml.gotmpl"]
    needs: ["kube-system/cilium"]

  - name: external-secrets
    namespace: external-secrets
    createNamespace: true
    chart: oci://ghcr.io/external-secrets/charts/external-secrets
    version: 2.3.0
    values: ["./templates/values.yaml.gotmpl"]
    needs: ["cert-manager/cert-manager"]

  - name: onepassword
    namespace: external-secrets
    chart: oci://ghcr.io/1password/connect
    version: 2.4.1
    values: ["./templates/values.yaml.gotmpl"]
    needs: ["external-secrets/external-secrets"]
    hooks:
      - events: ["presync"]
        command: sh
        args: ["-c", "op inject --in-file ../resources.yaml | kubectl apply --server-side --filename -"]
        showlogs: true
      - events: ["postsync"]
        command: kubectl
        args:
          - apply
          - --server-side
          - --field-manager=kustomize-controller
          - --kustomize
          - ../../kubernetes/apps/core/external-secrets/store
        showlogs: true

  - name: flux-operator
    namespace: flux-system
    createNamespace: true
    chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
    version: 0.50.0
    values: ["./templates/values.yaml.gotmpl"]
    needs: ["external-secrets/onepassword"]

  - name: flux-instance
    namespace: flux-system
    chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-instance
    version: 0.50.0
    wait: false
    values: ["./templates/values.yaml.gotmpl"]
    needs: ["flux-system/flux-operator"]
