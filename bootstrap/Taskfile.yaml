---
version: "3"

vars:
  OPENEBS_LVM_DEBUG: talosctl --nodes "$node" debug docker.io/openebs/lvm-driver:1.8.0
  OPENEBS_LVM_NODES: for node in {{splitList "," .NODES | join " "}}; do

tasks:
  talos:
    desc: Bootstrap Talos
    prompt: Bootstrap Talos ...?
    cmds:
      - until talosctl --nodes {{.RANDOM_CONTROLLER}} bootstrap; do sleep 5; done
      - talosctl kubeconfig --nodes {{.RANDOM_CONTROLLER}} --force
    preconditions:
      - talosctl config info
      - talosctl --nodes {{.RANDOM_CONTROLLER}} get machineconfig
      - which jq talosctl

  apps:
    desc: Bootstrap Kubernetes apps
    prompt: Bootstrap Kubernetes apps ...?
    cmds:
      - kubectl config set-cluster {{.CONTEXT}} --server https://10.0.10.100:6443
      - defer: talosctl kubeconfig --nodes {{.RANDOM_CONTROLLER}} --force
      - |-
        until kubectl wait nodes --for=condition=Ready=True --all --timeout=30s \
          || kubectl wait nodes --for=condition=Ready=False --all --timeout=10m; do
          sleep 5
        done
      - task: helmfile
    vars:
      CONTEXT:
        sh: talosctl config info --output json | jq --raw-output '.context'
    preconditions:
      - op user get --me
      - talosctl config info
      - talosctl --nodes {{.RANDOM_CONTROLLER}} get machineconfig
      - "{{.OPENEBS_LVM_NODES}} {{.OPENEBS_LVM_DEBUG}} --args=vgs --args=lvmvg || exit 1; done"
      - which jq kubectl op talosctl

  openebs-lvm:
    desc: Prepare OpenEBS LVM volume group on Talos nodes
    prompt: Prepare OpenEBS LVM volume group on Talos nodes ...?
    cmds:
      - >-
        {{.OPENEBS_LVM_NODES}} device="$(talosctl --nodes "$node" get volumestatus {{.OPENEBS_LVM_VOLUME}}
        --output=jsonpath='{.spec.location}')"; {{.OPENEBS_LVM_DEBUG}} --args=/bin/sh --args=-ec
        --args="pvcreate -y $device && vgcreate lvmvg $device" || exit 1; done
    vars:
      OPENEBS_LVM_VOLUME: r-openebs-lvm
    preconditions:
      - talosctl config info
      - talosctl --nodes {{.NODES}} get machineconfig
      - which jq talosctl

  helmfile:
    internal: true
    cmds:
      - |-
        helmfile --file {{.BOOTSTRAP_DIR}}/helmfile.d/00-crds.yaml template --quiet \
          | yq ea -e 'select(.kind == "CustomResourceDefinition")' \
          | kubectl apply --server-side --field-manager bootstrap --force-conflicts --filename -
      - helmfile --file {{.BOOTSTRAP_DIR}}/helmfile.d/01-apps.yaml sync --hide-notes
    preconditions:
      - test -f {{.BOOTSTRAP_DIR}}/helmfile.d/00-crds.yaml
      - test -f {{.BOOTSTRAP_DIR}}/helmfile.d/01-apps.yaml
      - test -f {{.BOOTSTRAP_DIR}}/resources.yaml
      - which helmfile kubectl op sh yq
